<style>
:root{--paper:#f6f4eb;--ink:#252d29;--muted:#727970;--accent:#ec6341;--line:#dcded3}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button:disabled{cursor:default} .wrap{max-width:1320px;margin:auto;padding:0 48px}header{height:98px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:30px;font-weight:850;letter-spacing:-2px;display:flex;align-items:center;gap:8px}.logo i{display:block;width:9px;height:9px;background:var(--accent);border-radius:50%;align-self:end;margin-bottom:14px}.nav{display:flex;gap:30px;align-items:center;font-size:12px;font-weight:600}.nav a:hover{color:var(--accent)}.repo{display:flex;gap:8px;align-items:center}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:650}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.stage{margin:30px 0 64px}.slides{position:relative;aspect-ratio:16/7;min-height:380px;border-radius:18px;overflow:hidden;background:#0d1c24;color:#f4f4e9;box-shadow:0 15px 40px #1d372615}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}.slide.on{opacity:1;visibility:visible;transition:opacity .8s}.slide-art{position:absolute;inset:0;display:block}.slide-art .art{height:100%;transform:scale(1.02);transition:transform 8s ease-out}.slide.on .slide-art .art{transform:scale(1.07)}.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}.slide-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#08151ce6,#08151c9c 34%,#08151c00 64%),linear-gradient(transparent 55%,#08151c8c)}.slide-copy{position:absolute;left:44px;bottom:42px;max-width:430px}.slide-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;font-weight:650;border-radius:20px;padding:5px 11px;border:1px solid #d8e9e540;background:#f3f5e914;backdrop-filter:blur(4px)}.tag.featured{background:var(--accent);border-color:var(--accent);color:#fff}.tag.new{background:#f4f4e9;border-color:#f4f4e9;color:var(--ink)}.slide h2{font-size:clamp(34px,4.4vw,58px);font-weight:500;letter-spacing:-2px;line-height:1.02;margin:0 0 12px}.slide p{color:#cfdcd8;font-size:14px;line-height:1.65;margin:0 0 24px}.pill{background:#f4f4e9;color:var(--ink);padding:12px 20px;border-radius:28px;display:inline-flex;align-items:center;gap:14px;font-size:12px;font-weight:650}.pill:hover{background:var(--accent);color:#fff}.slide-date{font-size:10px;color:#a9bcb7;margin-left:16px;letter-spacing:.4px}.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}.dots{display:flex;gap:6px;flex-wrap:wrap}.dots button{border:0;padding:0;background:none;width:34px;height:20px;display:grid;align-items:center}.dots button:before{content:'';display:block;height:3px;border-radius:2px;background:var(--line);transition:background .3s}.dots button:hover:before{background:var(--muted)}.dots button[aria-current=true]:before{background:var(--ink)}.stage-ctl{display:flex;align-items:center;gap:6px}.round-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;font-size:14px}.round-btn:hover{border-color:var(--ink)}.surprise{border:0;background:none;padding:10px 12px;font-size:12px;font-weight:600;color:var(--ink)}.surprise:hover{color:var(--accent)}.section-head{border-top:1px solid var(--line);padding-top:28px;display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}h2{font-size:28px;letter-spacing:-.8px;font-weight:500;line-height:1.2;margin:7px 0 0}.section-head .eyebrow{color:var(--muted)}.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.filter{background:none;border:0;border-radius:20px;padding:9px 16px;color:var(--muted);font-size:11px}.filter[aria-pressed=true]{background:var(--ink);color:var(--paper)}.search{position:relative;margin-left:12px}.search input{width:180px;background:transparent;border:1px solid var(--line);border-radius:20px;padding:9px 15px 9px 32px;font-size:11px;color:var(--ink)}.search:before{content:'⌕';position:absolute;top:4px;left:12px;font-size:19px;color:var(--muted)}.results-line{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:0 0 22px;letter-spacing:.4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 25px}.card{min-width:0;animation:appear .3s ease both}.thumb{height:205px;border-radius:12px;overflow:hidden;position:relative;display:block;background:#183634}.thumb .art{height:100%;transition:transform .5s}.thumb:hover .art{transform:scale(1.055)}.thumb:after{content:'↗';position:absolute;bottom:12px;right:12px;background:#f6f4ebed;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:var(--ink);opacity:0;transition:opacity .2s}.thumb:hover:after{opacity:1}.featured-tag{position:absolute;right:13px;top:13px;font-size:8px;letter-spacing:1px;text-transform:uppercase;font-weight:650;color:#fff;background:var(--accent);border-radius:12px;padding:3px 8px}.category-tag{position:absolute;left:14px;top:13px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#f5f5e9c9;border:1px solid #f5f5e937;border-radius:12px;padding:3px 8px;background:#0a1e2544}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px}.card h3{font-size:18px;font-weight:550;letter-spacing:-.4px;line-height:1.25;margin:0}.card h3 a:hover{color:var(--accent)}.version{font:9px ui-monospace,monospace;background:#e9eadf;border-radius:5px;padding:4px 7px;flex-shrink:0;color:var(--muted)}.description{font-size:12px;line-height:1.7;color:var(--muted);margin:9px 0 13px;min-height:40px}.card-actions{border-top:1px solid var(--line);padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-size:10px}.launch{color:var(--accent);font-weight:650}.card-actions a:hover{text-decoration:underline}.source{color:var(--muted)}.editions{margin-top:11px;font-size:10px;color:var(--muted)}.editions-label{display:block;margin-bottom:7px;letter-spacing:.4px}.versions{display:flex;gap:6px;flex-wrap:wrap}.versions button{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:10px;color:var(--muted);max-width:100%;overflow-wrap:anywhere;text-align:left}.versions button:hover{border-color:var(--accent);color:var(--accent)}.versions button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}.empty{padding:70px 10px;text-align:center;color:var(--muted);grid-column:1/-1}.empty h3{color:var(--ink)}footer{display:flex;justify-content:space-between;align-items:center;padding:29px 0 35px;margin-top:70px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}footer .logo{color:var(--ink);font-size:21px}footer .logo i{margin-bottom:9px;width:6px;height:6px}.footer-right{display:flex;gap:20px}noscript{display:block;padding:20px;background:#eedac3;border-radius:10px;margin:20px 0}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(min-width:1450px){.thumb{height:230px}}@media(max-width:1000px){.wrap{padding:0 30px}.section-head{align-items:start;flex-direction:column}.search{margin-left:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slide-copy{left:32px;bottom:32px}}@media(max-width:650px){.wrap{padding:0 22px}header{height:78px}.nav{gap:18px;font-size:10px}.nav .collection-link{display:none}.stage{margin:20px 0 48px}.slides{aspect-ratio:auto;height:480px;min-height:0}.slide-shade{background:linear-gradient(#08151c00 25%,#08151cb3 52%,#08151cf2)}.slide-copy{left:22px;right:22px;bottom:24px}.slide h2{font-size:36px}.slide p{font-size:13px;margin-bottom:18px}.surprise{display:none}.dots{gap:2px}.dots button{width:22px}.grid{grid-template-columns:1fr;gap:32px}.thumb{height:230px}.filters{width:100%;gap:3px}.filter{padding:8px 12px}.search{margin:12px 0 0;width:100%}.search input{width:100%}.results-line span:last-child{display:none}footer{gap:15px;flex-wrap:wrap}.description{min-height:0}.section-head{margin-bottom:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<body><div class="wrap">
<header><a class="logo" href="./" aria-label="Fun home">fun<i></i></a><nav class="nav" aria-label="Main navigation"><a class="collection-link" href="#collection">The collection</a><a class="repo" href="https://github.com/johnoscott/fun">View on GitHub <span aria-hidden="true">↗</span></a></nav></header>
<main><h1 class="visually-hidden">Fun: small files, big escapes</h1><section class="stage" aria-roledescription="carousel" aria-label="Featured escapes"><div class="slides" id="slides"></div><div class="stage-bar"><div class="dots" id="dots" role="group" aria-label="Choose a slide"></div><div class="stage-ctl"><button class="surprise" id="surprise" type="button">Surprise me ↗</button><button class="round-btn" id="prev" type="button" aria-label="Previous slide">←</button><button class="round-btn" id="pause" type="button" aria-label="Pause slideshow">❚❚</button><button class="round-btn" id="next" type="button" aria-label="Next slide">→</button></div></div></section>
<section id="collection" aria-labelledby="collection-title"><div class="section-head"><div><div class="eyebrow">The shelves</div><h2 id="collection-title">Find your next rabbit hole.</h2></div><div class="filters" role="group" aria-label="Filter projects"><button class="filter" data-filter="All" aria-pressed="true">All projects</button><div class="search"><input id="search" type="search" placeholder="Find something…" aria-label="Search projects"></div></div></div><div class="results-line"><span id="count" aria-live="polite"></span><span>A collection in constant motion</span></div><div class="grid" id="grid"></div><noscript>Enable JavaScript to browse the full gallery, or <a href="https://github.com/johnoscott/fun">browse all artefacts on GitHub</a>.</noscript></section></main>
<footer><a class="logo" href="./">fun<i></i></a><span>Made out of curiosity. Kept for the fun of it.</span><div class="footer-right"><a href="https://github.com/johnoscott">John Scott ↗</a><a href="https://github.com/johnoscott/fun">Source ↗</a></div></footer>
</div>
<script>
const projects = /* ARTEFACT_DATA */[];
const categories = /* CATEGORY_DATA */[];
const carousel = /* CAROUSEL_DATA */[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=path=>path.split('/').map(encodeURIComponent).join('/');
const source=path=>'https://github.com/johnoscott/fun/blob/main/'+href(path);
function artwork(slug){
let hash=0;for(const c of slug)hash=(hash*31+c.charCodeAt(0))>>>0;
const colors=[['#192c49','#799bd7','#c4dafa'],['#203c34','#c2d178','#e2ebaf'],['#39305b','#b7a1de','#f1cbac'],['#4b2d33','#ed967e','#f8d496'],['#113e46','#56bcb3','#c3e5d7']];
const [bg,fg,hi]=colors[hash%colors.length];let shapes='';
if(slug==='aquarium'){
shapes=`<defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#1a7479"/><stop offset="1" stop-color="#102d44"/></linearGradient></defs><path fill="url(#water)" d="M0 0h600v380H0z"/><circle cx="474" cy="58" r="29" fill="#f5df9d" opacity=".7"/><path d="M160 0L40 380h90L190 0M370 0L280 380h70L405 0" fill="#a8edde" opacity=".06"/><path d="M0 325Q140 280 300 335T600 310V380H0" fill="#155557"/><path d="M0 355Q190 309 370 351T600 340V380H0" fill="#123e48"/>`;
for(let i=0;i<11;i++){const x=45+(i*83)%510,y=90+(i*47)%180,s=i%3===0?1.3:.65,c=['#f4ba79','#85d4bb','#e595a7','#abc8ed'][i%4];shapes+=`<g transform="translate(${x} ${y}) scale(${s})"><path d="M22 0l18-15v30z" fill="${c}"/><ellipse rx="27" ry="14" fill="${c}"/><path d="M-5-12v24M6-12v24" stroke="#fff4d0" stroke-width="4" opacity=".6"/><circle cx="-15" cy="-3" r="3" fill="#203d48"/></g>`;}
for(let i=0;i<9;i++){let x=i*79;shapes+=`<path d="M${x} 355q-14-32 2-70m-2 50q-22-2-25-22m25 5q20-9 18-24" fill="none" stroke="${i%2?'#75bfa0':'#d38895'}" stroke-width="6" stroke-linecap="round"/>`;}
for(let i=0;i<16;i++)shapes+=`<circle cx="${(i*131)%580}" cy="${(i*67)%310}" r="${2+i%3}" fill="none" stroke="#b5e9d6" opacity=".3"/>`;
}else if(slug.includes('clock')){shapes=`<circle cx="300" cy="190" r="132" fill="#eeeee3"/><circle cx="300" cy="190" r="118" fill="none" stroke="#d4d6cc"/>`;for(let i=0;i<60;i++)shapes+=`<path d="M300 75v${i%5?6:17}" stroke="#273a39" stroke-width="${i%5?2:5}" transform="rotate(${i*6} 300 190)"/>`;shapes+='<path d="M300 190l-58-50m58 50l65-64" stroke="#283c3b" stroke-width="9"/><path d="M300 215V94" stroke="#ea6547" stroke-width="3"/><circle cx="300" cy="190" r="7" fill="#ea6547"/>';
}else if(slug.includes('dna')){for(let i=0;i<29;i++){const y=26+i*12,x=Math.sin(i*.28)*85;shapes+=`<path d="M${300-x} ${y}H${300+x}" stroke="${fg}" opacity=".5" stroke-width="3"/><circle cx="${300-x}" cy="${y}" r="7" fill="${fg}"/><circle cx="${300+x}" cy="${y}" r="7" fill="${hi}"/>`;}
}else if(slug.includes('spirograph')||slug.includes('mandelbrot')){for(let i=0;i<42;i++)shapes+=`<ellipse cx="300" cy="190" rx="${slug.includes('mandelbrot')?55+i*2:135}" ry="${slug.includes('mandelbrot')?30+i:53}" fill="none" stroke="${i%3?fg:hi}" stroke-width=".9" opacity=".7" transform="rotate(${i*8.57} 300 190)"/>`;
}else if(slug.includes('northern')||slug.includes('cyber')){for(let i=0;i<60;i++)shapes+=`<path d="M${i*11-20} 50Q${i*11+35} ${130+Math.sin(i*.15)*50} ${i*11} ${230+Math.sin(i*.12)*65}" fill="none" stroke="${i%3?fg:hi}" stroke-width="4" opacity="${.08+(i%6)*.04}"/>`;shapes+='<path d="M0 335l70-80 80 65 90-85 95 65 50-42 115 92v40H0" fill="#101e2c"/>';
}else if(slug.includes('origami')){for(let i=0;i<15;i++){const x=(i*97)%600,y=60+(i*53)%300;shapes+=`<path d="M${x} ${y}l60-45 35 85z" fill="${i%3?fg:hi}" opacity="${.2+i%4*.17}"/><path d="M${x+60} ${y-45}l-20 60 55 25z" fill="${bg}" opacity=".3"/>`;}
}else if(slug.includes('sputnik')||slug.includes('space')||slug.includes('quantum')){shapes=`<circle cx="300" cy="190" r="97" fill="${fg}"/><path d="M238 126l45 13 12 32-29 28-38-14-20-29m87 33l55 12 8 42-35 38-17-37" fill="${hi}" opacity=".7"/><ellipse cx="300" cy="190" rx="190" ry="55" transform="rotate(-25 300 190)" fill="none" stroke="${hi}" opacity=".65"/><circle cx="459" cy="124" r="9" fill="${hi}"/>`;
}else if(slug.includes('retro')||slug.includes('vector')){for(let i=0;i<24;i++){const x=65+(i%8)*65,y=75+Math.floor(i/8)*62;shapes+=`<path d="M${x} ${y}h8v-8h8v8h8v8h8v16h-8v-8h-24v8h-8v-16h8z" fill="${i%2?fg:hi}"/>`;}shapes+=`<path d="M285 320l15-22 15 22z" fill="${hi}"/>`;
}else{for(let i=0;i<14;i++){const x=(hash+i*97)%600,y=35+(i*79)%310,r=14+(i*13)%65;shapes+=`<${i%2?'circle':'rect'} ${i%2?`cx="${x}" cy="${y}" r="${r}"`:`x="${x}" y="${y}" width="${r}" height="${r}" rx="6" transform="rotate(${i*13} ${x} ${y})"`} fill="${i%3?fg:hi}" opacity="${.15+i%4*.15}"/>`;}}
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path fill="${bg}" d="M0 0h600v380H0z"/>${shapes}</svg>`;
}
const verbs={Screensavers:'Launch escape ↗',Experiments:'Launch escape ↗'};
const shot=(f,slug)=>f.thumb?`<img src="${esc(href(f.thumb))}" alt="" loading="lazy" decoding="async">`:artwork(slug);
// Carousel of the newest featured projects. Advances every 7s unless paused, hovered, focused or reduced motion is on.
const NEW_DAYS=21,isNew=p=>Date.now()-Date.parse(p.added)<NEW_DAYS*864e5;
const added=p=>new Date(p.added).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const slidesEl=document.querySelector('#slides'),dotsEl=document.querySelector('#dots'),pauseBtn=document.querySelector('#pause');
const slides=carousel.map(s=>projects.find(p=>p.slug===s)).filter(Boolean);
slidesEl.innerHTML=slides.map((p,i)=>{const f=p.primary,target=esc(href(f.path));return `<article class="slide" role="group" aria-roledescription="slide" aria-label="${i+1} of ${slides.length}: ${esc(p.name)}"><a class="slide-art" href="${target}" tabindex="-1" aria-hidden="true"><div class="art">${f.hero||f.thumb?`<img src="${esc(href(f.hero||f.thumb))}" alt=""${i?' loading="lazy"':''} decoding="async">`:artwork(p.slug)}</div></a><div class="slide-shade"></div><div class="slide-copy"><div class="slide-tags"><span class="tag featured">Featured</span>${isNew(p)?'<span class="tag new">New</span>':''}<span class="tag">${esc(p.category)}</span></div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><a class="pill" href="${target}">${verbs[p.category]||'Open ↗'}</a><span class="slide-date">Added ${esc(added(p))}</span></div></article>`;}).join('');
dotsEl.innerHTML=slides.map((p,i)=>`<button type="button" aria-label="Show ${esc(p.name)}"></button>`).join('');
let current=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,held=false,timer;
function show(i){current=(i+slides.length)%slides.length;slidesEl.querySelectorAll('.slide').forEach((s,j)=>{s.classList.toggle('on',j===current);s.inert=j!==current;});dotsEl.querySelectorAll('button').forEach((d,j)=>d.setAttribute('aria-current',String(j===current)));schedule();}
function schedule(){clearTimeout(timer);if(!paused&&!held&&slides.length>1)timer=setTimeout(()=>show(current+1),7000);}
function setPaused(v){paused=v;pauseBtn.textContent=v?'▶':'❚❚';pauseBtn.setAttribute('aria-label',v?'Play slideshow':'Pause slideshow');schedule();}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);pauseBtn.onclick=()=>setPaused(!paused);
dotsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show([...dotsEl.children].indexOf(b));});
const stage=document.querySelector('.stage');stage.addEventListener('mouseenter',()=>{held=true;schedule();});stage.addEventListener('mouseleave',()=>{held=false;schedule();});stage.addEventListener('focusin',()=>{held=true;schedule();});stage.addEventListener('focusout',e=>{if(!stage.contains(e.relatedTarget)){held=false;schedule();}});
stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);else if(e.key==='ArrowRight')show(current+1);});
setPaused(paused);show(0);
let filter='All';
const grid=document.querySelector('#grid'),search=document.querySelector('#search');
const picked=new Map();
function card(p){const f=picked.get(p.slug)||p.primary,target=f.playable?href(f.path):source(f.path),many=p.files.length>1;return `<a class="thumb" href="${esc(target)}" aria-label="${f.playable?'Open':'View source for'} ${esc(p.name)}${many?' '+esc(f.label):''}"><div class="art">${shot(f,p.slug)}</div><span class="category-tag">${esc(p.category)}</span>${p.featured?'<span class="featured-tag">Featured</span>':''}</a><div class="card-head"><h3><a href="${esc(target)}">${esc(p.name)}</a></h3><span class="version">${f.playable?(many?esc(f.label.split(' · ')[0]):'HTML'):'SOURCE ONLY'}</span></div><p class="description">${esc(f.playable?p.description:'A workshop experiment that needs server code or assets. Explore the source on GitHub.')}</p><div class="card-actions"><a class="launch" href="${esc(target)}">${f.playable?(verbs[p.category]||'Open ↗'):'Explore source ↗'}</a>${f.playable?`<a class="source" href="${esc(href(f.path))}" download>Download HTML ↓</a>`:`<a class="source" href="${esc(source(f.path))}">GitHub ↗</a>`}</div>${many?`<div class="editions"><span class="editions-label" id="ed-${esc(p.slug)}">${p.files.length} editions</span><div class="versions" role="group" aria-labelledby="ed-${esc(p.slug)}">${p.files.map((v,i)=>`<button type="button" data-slug="${esc(p.slug)}" data-i="${i}" aria-pressed="${v===f}" title="${esc(v.title)}">${esc(v.label)}${v.playable?'':' · source'}</button>`).join('')}</div></div>`:''}`;}
function render(){const term=search.value.toLowerCase().trim();const items=projects.filter(p=>(filter==='All'||p.category===filter)&&`${p.name} ${p.slug} ${p.description} ${p.files.map(f=>f.title+' '+f.label).join(' ')}`.toLowerCase().includes(term));document.querySelector('#count').textContent=`${items.length} project${items.length===1?'':'s'} · ${items.reduce((n,p)=>n+p.files.length,0)} artefacts`;grid.innerHTML=items.map(p=>`<article class="card" data-slug="${esc(p.slug)}">${card(p)}</article>`).join('')||'<div class="empty"><h3>No rabbit holes here… yet.</h3><p>Try another search or choose a different shelf.</p></div>';}
grid.addEventListener('click',e=>{const b=e.target.closest('.versions button');if(!b)return;const p=projects.find(x=>x.slug===b.dataset.slug);picked.set(p.slug,p.files[+b.dataset.i]);const el=b.closest('.card');el.innerHTML=card(p);el.querySelector(`.versions button[data-i="${b.dataset.i}"]`).focus();});
const filterGroup=document.querySelector('.filters'),searchBox=filterGroup.querySelector('.search');for(const c of categories)if(projects.some(p=>p.category===c)){const b=document.createElement('button');b.className='filter';b.dataset.filter=c;b.setAttribute('aria-pressed','false');b.textContent=c;filterGroup.insertBefore(b,searchBox);}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));search.addEventListener('input',render);document.querySelector('#surprise').onclick=()=>{const playable=projects.flatMap(p=>p.files.filter(f=>f.playable));if(playable.length)location.href=href(playable[Math.floor(Math.random()*playable.length)].path);};render();
</script></body></html>
