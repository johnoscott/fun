<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowchart Diagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        svg {
            display: block;
            margin: 0 auto;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .label {
            font-size: 14px;
            font-weight: 500;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Project Approval Workflow</h1>
        <svg width="600" height="800" viewBox="0 0 600 800">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
            </defs>

            <!-- Start -->
            <rect x="250" y="20" width="100" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
            <text x="300" y="50" class="label" fill="white">Start</text>

            <!-- Arrow -->
            <line x1="300" y1="70" x2="300" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- Process: Submit Project -->
            <rect x="225" y="110" width="150" height="60" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="4"/>
            <text x="300" y="138" class="label" fill="white">Submit Project</text>
            <text x="300" y="158" style="font-size: 12px; text-anchor: middle; fill: white;">Proposal</text>

            <!-- Arrow -->
            <line x1="300" y1="170" x2="300" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- Decision: Budget OK? -->
            <polygon points="300,210 380,260 300,310 220,260" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
            <text x="300" y="263" class="label" fill="white">Budget</text>
            <text x="300" y="280" class="label" fill="white">OK?</text>

            <!-- No path (left) -->
            <line x1="220" y1="260" x2="100" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="150" y="250" style="font-size: 12px; fill: #333; font-weight: 500;">No</text>

            <!-- Reject box -->
            <rect x="20" y="230" width="160" height="60" fill="#F44336" stroke="#C62828" stroke-width="2" rx="4"/>
            <text x="100" y="258" class="label" fill="white">Request</text>
            <text x="100" y="278" class="label" fill="white">Revision</text>

            <!-- Arrow from Reject back to Submit -->
            <path d="M 100 230 Q 100 180 225 140" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- Yes path (down) -->
            <line x1="300" y1="310" x2="300" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="320" y="335" style="font-size: 12px; fill: #333; font-weight: 500;">Yes</text>

            <!-- Process: Review Team -->
            <rect x="225" y="350" width="150" height="60" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="4"/>
            <text x="300" y="378" class="label" fill="white">Review by</text>
            <text x="300" y="398" class="label" fill="white">Approval Team</text>

            <!-- Arrow -->
            <line x1="300" y1="410" x2="300" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- Decision: Approved? -->
            <polygon points="300,450 380,500 300,550 220,500" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
            <text x="300" y="505" class="label" fill="white">Approved?</text>

            <!-- No path (right) -->
            <line x1="380" y1="500" x2="480" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="420" y="490" style="font-size: 12px; fill: #333; font-weight: 500;">No</text>

            <!-- Reject box -->
            <rect x="480" y="470" width="100" height="60" fill="#F44336" stroke="#C62828" stroke-width="2" rx="4"/>
            <text x="530" y="503" class="label" fill="white">Rejected</text>

            <!-- Arrow from Reject to End -->
            <path d="M 530 470 Q 530 420 450 390" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- Yes path (down) -->
            <line x1="300" y1="550" x2="300" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="320" y="575" style="font-size: 12px; fill: #333; font-weight: 500;">Yes</text>

            <!-- Process: Schedule Launch -->
            <rect x="225" y="590" width="150" height="60" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="4"/>
            <text x="300" y="618" class="label" fill="white">Schedule</text>
            <text x="300" y="638" class="label" fill="white">Project Launch</text>

            <!-- Arrow -->
            <line x1="300" y1="650" x2="300" y2="690" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- End -->
            <rect x="250" y="690" width="100" height="50" rx="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
            <text x="300" y="720" class="label" fill="white">Complete</text>

            <!-- Right rejection path to end -->
            <line x1="450" y1="370" x2="350" y2="370" stroke="#333" stroke-width="2"/>
            <line x1="350" y1="370" x2="350" y2="715" stroke="#333" stroke-width="2"/>
            <line x1="350" y1="715" x2="250" y2="715" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
        </svg>
    </div>
</body>
</html>
