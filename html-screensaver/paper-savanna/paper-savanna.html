<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Savanna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Familjen+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Full-bleed canvas diorama; a folded paper almanac card floats bottom-left and hides when idle */
:root {
  --paper: #f6efe0;
  --paper-fold: #e3d6bb;
  --ink: #2d2418;
  --ink-soft: #6b5a43;
  --sun: #e8902f;
  --moon: #7d8bb0;
  --night: #0c1230;
  --display: "Young Serif", Georgia, serif;
  --body: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
body.idle, body.idle canvas { cursor: none; }

#hud {
  position: fixed;
  left: max(20px, calc(env(safe-area-inset-left, 0px) + 16px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: min(340px, calc(100vw - 40px));
  background:
    linear-gradient(225deg, var(--paper-fold) 0 18px, transparent 18px),
    var(--paper);
  clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
  padding: 16px 18px 14px;
  display: grid;
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  transition: opacity .8s ease, transform .8s ease;
}
body.idle #hud { opacity: 0; transform: translateY(8px); pointer-events: none; }
.eyebrow {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-soft); font-weight: 600;
  display: flex; justify-content: space-between; gap: 8px;
}
.clock { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
#time { font-family: var(--display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
#phase { font-size: 15px; font-weight: 600; }
#wx { font-size: 13px; color: var(--ink-soft); margin-top: -4px; }

.strip { position: relative; height: 22px; }
.strip .lane { position: absolute; left: 0; right: 0; height: 6px; background: var(--paper-fold); }
.strip .lane.sun { top: 2px; } .strip .lane.moon { top: 12px; }
.strip .band { position: absolute; top: 0; bottom: 0; }
.strip .sun .band { background: var(--sun); }
.strip .moon .band { background: var(--moon); }
#now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: -4px; }

dl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 0; }
dl div { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; border-top: 1px solid var(--paper-fold); padding-top: 4px; }
dt { color: var(--ink-soft); }
dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-soft); }
button {
  font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); border: 0; padding: 6px 10px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated origami savanna: one day passes every 60 seconds"></canvas>

<section id="hud" aria-live="off">
  <div class="eyebrow"><span>Maasai Mara · 1.5°S</span><span id="day">Day 1</span></div>
  <div class="clock"><span id="time">05:00</span><span id="phase">Before dawn</span></div>
  <div id="wx">Clear skies</div>
  <div>
    <div class="strip" aria-hidden="true">
      <div class="lane sun" id="sunLane"></div>
      <div class="lane moon" id="moonLane"></div>
      <div id="now"></div>
    </div>
    <div class="ticks" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  </div>
  <dl>
    <div><dt>Sunrise</dt><dd id="sr">06:22</dd></div>
    <div><dt>Sunset</dt><dd id="ss">18:34</dd></div>
    <div><dt>Moonrise</dt><dd id="mr">--:--</dd></div>
    <div><dt>Moonset</dt><dd id="ms">--:--</dd></div>
  </dl>
  <div class="foot"><span id="moonName">Waxing gibbous</span><button id="fs" type="button">Full screen</button></div>
</section>

<script>
(() => {
const DAY_MS = 60000;            // one savanna day per minute
const SUNRISE = 6 + 22/60, SUNSET = 18 + 34/60;
const START_H = 4.6;             // open just before first light
const LUNAR = 29.53;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, S, DPR, skyGrid = [], noisePat;

const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mixC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const bell = (h, a, b, f) => sstep(a - f, a, h) * (1 - sstep(b, b + f, h));
const fmt = h => { h = ((h % 24) + 24) % 24; const m = Math.floor(h * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = H / 820;
  // faint folds across the sky sheet
  skyGrid = [];
  const cols = Math.ceil(W / 220) + 1, rows = 4, cw = W / (cols - 1), rh = H * 0.7 / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols - 1; c++) {
    const x = c * cw, y = r * rh, j = () => (Math.random() - .5) * 30;
    const a = [x, y], b = [x + cw, y + j()], d = [x + j(), y + rh], e = [x + cw, y + rh];
    skyGrid.push([[a, b, d], Math.random()], [[b, e, d], Math.random()]);
  }
  const n = document.createElement('canvas'); n.width = n.height = 180;
  const nc = n.getContext('2d'), id = nc.createImageData(180, 180);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random() < .5 ? 255 : 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = Math.random() * 14;
  }
  nc.putImageData(id, 0, 0);
  noisePat = ctx.createPattern(n, 'repeat');
}
addEventListener('resize', resize); resize();

// ---------- sky, light and weather ----------
const SKY = [
  [0,    '#0b1030', '#1a2350'],
  [4.6,  '#0e1638', '#24305e'],
  [5.6,  '#2b2f63', '#b5607e'],
  [6.3,  '#4c5c9c', '#f2a35e'],
  [7.4,  '#6fa3d8', '#f6d29a'],
  [9.5,  '#4b98df', '#c3e3f1'],
  [15.5, '#3f8fdc', '#bfe0ef'],
  [17.6, '#5a7fc4', '#f4c27c'],
  [18.5, '#4a3f7a', '#ee7a4c'],
  [19.3, '#22285a', '#6a3d6a'],
  [20.2, '#0f1538', '#1d2652'],
  [24,   '#0b1030', '#1a2350'],
].map(k => [k[0], hex(k[1]), hex(k[2])]);
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (h >= a[0] && h <= b[0]) { const t = sstep(0, 1, (h - a[0]) / (b[0] - a[0])); return [mixC(a[1], b[1], t), mixC(a[2], b[2], t)]; }
  }
  return [SKY[0][1], SKY[0][2]];
}

const WEATHER = [
  { name: 'Afternoon thunderstorm', f: h => ({ cover: .12 + .78 * bell(h, 12, 16.8, 2), storm: bell(h, 13.4, 16.4, 1), rain: bell(h, 14, 16.2, .6) }) },
  { name: 'Clear skies',            f: h => ({ cover: .12 + .1 * bell(h, 10, 16, 2), storm: 0, rain: 0 }) },
  { name: 'Scattered cumulus',      f: h => ({ cover: .12 + .45 * bell(h, 10, 17, 2.5), storm: 0, rain: 0 }) },
  { name: 'Grey with showers',      f: h => ({ cover: .12 + .62 * bell(h, 7, 17.5, 2), storm: .4 * bell(h, 8, 16.5, 1), rain: .7 * (bell(h, 9, 10.6, .5) + bell(h, 14.6, 16, .5)) }) },
];

function moonInfo(day) {
  const phase = (0.36 + day / LUNAR) % 1;           // advances a day of the lunar month per loop
  const rise = (SUNRISE + phase * 24.84) % 24;
  return { phase, rise, set: (rise + 12.4) % 24, illum: (1 - Math.cos(phase * Math.PI * 2)) / 2 };
}
function moonName(p) {
  if (p < .03 || p > .97) return 'New moon';
  if (p < .22) return 'Waxing crescent'; if (p < .28) return 'First quarter';
  if (p < .47) return 'Waxing gibbous';  if (p < .53) return 'Full moon';
  if (p < .72) return 'Waning gibbous';  if (p < .78) return 'Last quarter';
  return 'Waning crescent';
}

// ---------- paper drawing helpers ----------
let tint = [1, 1, 1], haze = [0, 0, 0], lightSide = 0, dayK = 1;
function paint(base, k, hz = 0) {
  const c = [base[0] * tint[0] * k, base[1] * tint[1] * k, base[2] * tint[2] * k];
  return rgb(mixC(c, haze, hz));
}
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

// ---------- terrain ----------
const LAYERS = [
  { id: 1, base: .63, amp: .21, seg: 240, speed: .05, band: .09, col: hex('#8a8fae'), hz: .5,  mount: true },
  { id: 2, base: .67, amp: .05, seg: 150, speed: .12, band: .03, col: hex('#c4a06a'), hz: .38, trees: .3, ts: .32 },
  { id: 3, base: .735, amp: .05, seg: 175, speed: .26, band: .035, col: hex('#d6aa5c'), hz: .22, trees: .28, ts: .58, animal: 'giraffe', ar: .16 },
  { id: 4, base: .83, amp: .05, seg: 210, speed: .52, band: .04, col: hex('#c48c3e'), hz: .08, trees: .2, ts: 1, animal: 'elephant', ar: .13 },
  { id: 5, base: .955, amp: .045, seg: 110, speed: 1, band: .03, col: hex('#a46c2e'), hz: 0, grass: true },
];
function ridge(L, i) {
  let v = hash(i, L.id);
  if (L.mount) v = .22 + .42 * v + (hash(i, L.id + 40) > .72 ? .36 : 0);
  return H * L.base - v * L.amp * H;
}

const C = {
  trunk: hex('#5a3a22'), leaf: hex('#5f7d3a'), giraffe: hex('#dc9e45'), girDark: hex('#a8702c'),
  ele: hex('#938c88'), snow: hex('#f4f2ee'), grass: hex('#d8b064'), grassDk: hex('#a77a36'), bird: hex('#3a3040'),
};

function drawTree(x, y, s, seed, hz) {
  const w = (22 + hash(seed, 3) * 14) * s, th = (26 + hash(seed, 4) * 12) * s, lean = (hash(seed, 5) - .5) * 8 * s;
  poly([[x - 2.2*s, y], [x + 2.2*s, y], [x + lean + 1.2*s, y - th], [x + lean - 1.4*s, y - th]], paint(C.trunk, .9, hz));
  poly([[x + lean, y - th], [x + lean - w * .55, y - th - 6*s], [x + lean - w * .5, y - th - 3*s]], paint(C.trunk, .7, hz));
  const cx = x + lean, cy = y - th - 6*s;
  const L = [cx - w, cy + 2*s], R = [cx + w, cy], TL = [cx - w * .6, cy - 11*s], TR = [cx + w * .7, cy - 12*s], M = [cx + (hash(seed, 6) - .5) * w * .4, cy - 4*s];
  const sideL = .82 - lightSide * .12, sideR = .82 + lightSide * .12;
  poly([L, TL, M], paint(C.leaf, sideL, hz));
  poly([TL, TR, M], paint(C.leaf, 1.02, hz));
  poly([TR, R, M], paint(C.leaf, sideR, hz));
  poly([L, M, R], paint(C.leaf, .62, hz));
}

function drawGiraffe(x, y, s, f, seed, now, hz) {
  const P = (dx, dy) => [x + f * dx * s, y - dy * s];
  const bob = Math.sin(now / 900 + seed * 3) * 3;
  const lt = paint(C.giraffe, 1, hz), dk = paint(C.girDark, .95, hz), lg = paint(C.girDark, .8, hz);
  for (const lx of [-11, -6, 11, 15]) poly([P(lx - 1.3, 0), P(lx + 1.3, 0), P(lx + 1.6, 36), P(lx - 1.6, 36)], lg);
  poly([P(-14, 34), P(16, 37), P(-12, 47)], dk);
  poly([P(16, 37), P(18, 51), P(-12, 47)], lt);
  poly([P(12, 47), P(18, 51), P(30 + bob * .3, 84 + bob)], dk);
  poly([P(12, 47), P(30 + bob * .3, 84 + bob), P(25 + bob * .3, 85 + bob)], lt);
  const hx = 27 + bob * .3, hy = 85 + bob;
  poly([P(hx - 3, hy - 1), P(hx + 12, hy - 5), P(hx + 1, hy + 5)], lt);
  poly([P(hx - 3, hy - 1), P(hx + 1, hy + 5), P(hx - 2, hy + 4)], dk);
  poly([P(hx - 1, hy + 4), P(hx, hy + 4), P(hx - 1, hy + 9)], dk);
  poly([P(-14, 44), P(-13, 42), P(-18, 28)], dk);
}

function drawElephant(x, y, s, f, seed, now, hz) {
  const P = (dx, dy) => [x + f * dx * s, y - dy * s];
  const sw = Math.sin(now / 700 + seed * 5) * 3;
  const lt = paint(C.ele, 1, hz), md = paint(C.ele, .84, hz), dk = paint(C.ele, .68, hz);
  for (const lx of [-20, -10, 8, 18]) poly([P(lx - 3.5, 0), P(lx + 3.5, 0), P(lx + 3.5, 18), P(lx - 3.5, 18)], lx > 0 ? md : dk);
  const b = [P(-24, 14), P(-27, 34), P(-12, 48), P(12, 49), P(24, 38), P(24, 14)];
  poly([b[0], b[1], b[2], b[5]], md);
  poly([b[2], b[3], b[4], b[5]], lt);
  poly([P(18, 44), P(34, 40), P(36, 24), P(22, 20)], lt);
  poly([P(32, 26), P(37, 27), P(40 + sw * .4, 4), P(36 + sw * .4, 2)], md);
  poly([P(15, 43), P(26, 42), P(20, 21)], dk);
  poly([P(31, 24), P(33, 23), P(42, 17)], paint(C.snow, .95, hz));
  poly([P(-26, 32), P(-25, 30), P(-30, 18)], dk);
}

function drawLayer(L, dist, now, li) {
  const off = dist * L.speed, seg = L.seg * S;
  const i0 = Math.floor(off / seg) - 1, i1 = i0 + Math.ceil(W / seg) + 3;
  const pts = [];
  for (let i = i0; i <= i1; i++) pts.push([i * seg - off, ridge(L, i), i]);
  // silhouette, lifted off the layer behind with a soft paper shadow
  ctx.save();
  ctx.shadowColor = 'rgba(25,12,0,.32)'; ctx.shadowBlur = 16 * S; ctx.shadowOffsetY = -2 * S;
  ctx.beginPath(); ctx.moveTo(pts[0][0], H + 10);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(pts[pts.length - 1][0], H + 10); ctx.closePath();
  ctx.fillStyle = paint(L.col, .8, L.hz); ctx.fill();
  ctx.restore();

  const band = L.band * H, mids = [];
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    mids.push([(a[0] + b[0]) / 2, Math.max(a[1], b[1]) + band]);
  }
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1], m = mids[k], j = (hash(a[2], L.id + 9) - .5) * .07;
    const slope = (b[1] - a[1]) / seg;
    const lit = .92 + clamp(slope * lightSide * .8, -.2, .2) * (.35 + .65 * dayK) + j;
    poly([a, b, m], paint(L.col, lit, L.hz));
    if (k > 0) poly([a, mids[k - 1], m], paint(L.col, .76 + j, L.hz));
    if (L.mount && hash(a[2], L.id + 40) > .72 && (ridge(L, a[2]) < H * L.base - .6 * L.amp * H)) {
      const pv = pts[k - 1] || a, l = [lerp(a[0], pv[0], .26), lerp(a[1], pv[1], .26)], r = [lerp(a[0], b[0], .24), lerp(a[1], b[1], .24)];
      const mid = [a[0] + (hash(a[2], 77) - .5) * 8 * S, a[1] + (Math.max(l[1], r[1]) - a[1]) * 1.25];
      poly([a, l, mid], paint(C.snow, .86 - lightSide * .08, L.hz * .6));
      poly([a, mid, r], paint(C.snow, .98 + lightSide * .04, L.hz * .6));
    }
  }

  const yAt = x => {
    const k = clamp(Math.floor((x + off) / seg) - i0, 0, pts.length - 2), a = pts[k], b = pts[k + 1];
    return lerp(a[1], b[1], clamp((x - a[0]) / (b[0] - a[0]), 0, 1));
  };
  for (let k = 0; k < pts.length - 1; k++) {
    const i = pts[k][2], x0 = pts[k][0];
    if (L.trees && hash(i, L.id + 20) < L.trees) {
      const x = x0 + hash(i, L.id + 21) * seg;
      drawTree(x, yAt(x) + 3 * S, L.ts * S * (.8 + hash(i, L.id + 22) * .5), i * 13 + L.id, L.hz);
    }
    if (L.animal && hash(i, L.id + 30) < L.ar) {
      const x = x0 + (.2 + hash(i, L.id + 31) * .6) * seg, f = hash(i, L.id + 32) < .5 ? 1 : -1, s = L.ts * S * .9;
      const herd = L.animal === 'elephant' ? 1 + Math.floor(hash(i, L.id + 33) * 3) : 1 + Math.floor(hash(i, L.id + 33) * 2);
      for (let n = 0; n < herd; n++) {
        const ax = x - f * n * (L.animal === 'elephant' ? 46 : 30) * s, sc = s * (1 - n * .14);
        (L.animal === 'elephant' ? drawElephant : drawGiraffe)(ax, yAt(ax) + 2 * S, sc, f, i + n, now, L.hz);
      }
    }
    if (L.grass) {
      for (let g = 0; g < 4; g++) {
        const x = x0 + hash(i, g + 50) * seg, y = yAt(x) + 4 * S, hgt = (12 + hash(i, g + 60) * 26) * S, lean = (hash(i, g + 70) - .5) * 14 * S;
        poly([[x - 3 * S, y], [x, y], [x + lean, y - hgt]], paint(C.grass, .95));
        poly([[x, y], [x + 3 * S, y], [x + lean, y - hgt]], paint(C.grassDk, .9));
        poly([[x + 2 * S, y], [x + 5 * S, y], [x + lean * 1.6 + 6 * S, y - hgt * .7]], paint(C.grass, .8));
      }
    }
  }
}

// ---------- sky objects ----------
function arc(p, alt) {
  return [lerp(W * .08, W * .92, p), H * .66 - Math.max(alt, -.3) * H * .54];
}
function sunState(h) {
  if (h >= SUNRISE && h <= SUNSET) { const p = (h - SUNRISE) / (SUNSET - SUNRISE); return { p, alt: Math.sin(Math.PI * p) }; }
  const night = 24 - (SUNSET - SUNRISE), q = ((h - SUNSET + 24) % 24) / night;
  return { p: q < .5 ? 1 + q * .3 : -(1 - q) * .3, alt: -Math.sin(Math.PI * q) };
}
function moonState(h, m) {
  const q = ((h - m.rise + 24) % 24) / 12.4;
  if (q <= 1) return { p: q, alt: Math.sin(Math.PI * q) };
  const r = (q - 1) / ((24 - 12.4) / 12.4);
  return { p: r < .5 ? 1 + r * .3 : -(1 - r) * .3, alt: -Math.sin(Math.PI * r) };
}

function drawSun(sun, now, wx) {
  if (sun.alt < -.12) return;
  const [x, y] = arc(sun.p, sun.alt), low = 1 - sstep(.05, .45, sun.alt);
  const r = (30 + low * 10) * S, col = mixC(hex('#ffd45a'), hex('#ff6a35'), low), dim = 1 - wx.cover * .55;
  const g = ctx.createRadialGradient(x, y, r * .5, x, y, r * 6);
  g.addColorStop(0, rgb(col, .45 * dim)); g.addColorStop(1, rgb(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r * 6, y - r * 6, r * 12, r * 12);
  ctx.globalAlpha = dim;
  const rot = now / 12000;
  for (let k = 0; k < 12; k++) {
    const a = rot + k * Math.PI / 6, w = .12, len = r * (1.55 + (k % 2) * .25);
    poly([[x + Math.cos(a - w) * r * 1.12, y + Math.sin(a - w) * r * 1.12], [x + Math.cos(a) * len, y + Math.sin(a) * len], [x + Math.cos(a + w) * r * 1.12, y + Math.sin(a + w) * r * 1.12]], rgb(mixC(col, [255, 255, 255], k % 2 ? 0 : .25), .85));
  }
  for (let k = 0; k < 10; k++) {
    const a0 = k * Math.PI / 5 - Math.PI / 2, a1 = a0 + Math.PI / 5;
    poly([[x, y], [x + Math.cos(a0) * r, y + Math.sin(a0) * r], [x + Math.cos(a1) * r, y + Math.sin(a1) * r]], rgb(mixC(col, k % 2 ? hex('#e8702a') : [255, 245, 210], .22)));
  }
  ctx.globalAlpha = 1;
}

function drawMoon(ms, m, night, wx) {
  if (ms.alt < -.12) return;
  const [x, y] = arc(ms.p, ms.alt), r = 22 * S, a = (.35 + .65 * night) * (1 - wx.cover * .6);
  ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, r, x, y, r * 5);
  g.addColorStop(0, `rgba(210,220,255,${.22 * night * m.illum})`); g.addColorStop(1, 'rgba(210,220,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  const N = 10;
  for (let k = 0; k < N; k++) {
    const a0 = k * Math.PI * 2 / N, a1 = a0 + Math.PI * 2 / N;
    poly([[x, y], [x + Math.cos(a0) * r, y + Math.sin(a0) * r], [x + Math.cos(a1) * r, y + Math.sin(a1) * r]], rgb(k % 2 ? [44, 52, 86] : [52, 60, 96], .55));
  }
  // lit part: limb + terminator, folded at the centre line
  const side = m.phase < .5 ? 1 : -1, k2 = Math.cos(m.phase * Math.PI * 2), steps = 7;
  const limb = [], term = [];
  for (let s = 0; s <= steps; s++) {
    const t = -Math.PI / 2 + Math.PI * s / steps;
    limb.push([x + side * r * Math.cos(t), y + r * Math.sin(t)]);
    term.push([x + side * r * Math.cos(t) * k2, y + r * Math.sin(t)]);
  }
  const top = limb.slice(0, steps / 2 + 1 | 0), bot = limb.slice(steps / 2 | 0);
  const tTop = term.slice(0, steps / 2 + 1 | 0), tBot = term.slice(steps / 2 | 0);
  poly([...top, ...tTop.reverse()], rgb([244, 240, 226]));
  poly([...bot, ...tBot.reverse()], rgb([214, 214, 210]));
  ctx.globalAlpha = 1;
}

const STARS = Array.from({ length: 140 }, (_, i) => [hash(i, 1), hash(i, 2) * .6, .6 + hash(i, 3) * 1.8, hash(i, 4) * 6]);
function drawStars(night, cover, now) {
  if (night < .02) return;
  for (const [sx, sy, sz, ph] of STARS) {
    const x = sx * W, y = sy * H, r = sz * S * 1.6, a = night * (1 - cover * .9) * (.55 + .45 * Math.sin(now / 600 + ph));
    const q = r * .28;
    poly([[x, y - r], [x + q, y - q], [x + r, y], [x + q, y + q], [x, y + r], [x - q, y + q], [x - r, y], [x - q, y - q]], `rgba(255,248,225,${a})`);
  }
}

function drawCloud(x, y, sz, seed, alpha, storm) {
  const n = 3 + Math.floor(hash(seed, 4) * 3), span = (n * .55 * sz) / 2 + sz * .2;
  const base = mixC([252, 249, 243], [86, 92, 108], storm);
  ctx.globalAlpha = alpha;
  ctx.save(); ctx.beginPath(); ctx.rect(x - span - sz, y - sz * 4, span * 2 + sz * 2, sz * 4); ctx.clip();
  for (let p = 0; p < n; p++) {
    const mid = 1 - Math.abs(p - (n - 1) / 2) / n;
    const r = sz * (.3 + .25 * hash(seed, p + 10) + .25 * mid) * (1 + storm * .7 * mid);
    const cx = x + (p - (n - 1) / 2) * sz * .55 + (hash(seed, p + 20) - .5) * sz * .2, cy = y - r * .45;
    const sides = 7, rot = hash(seed, p + 30) * 2;
    for (let k = 0; k < sides; k++) {
      const a0 = rot + k * Math.PI * 2 / sides, a1 = a0 + Math.PI * 2 / sides, am = (a0 + a1) / 2;
      const b = .9 - .14 * Math.sin(am) + .07 * lightSide * Math.cos(am);
      poly([[cx, cy], [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r]], paint(base, b));
    }
  }
  ctx.restore();
  poly([[x - span, y], [x + span, y], [x + span * .82, y + sz * .14], [x - span * .82, y + sz * .14]], paint(base, .7));
  ctx.globalAlpha = 1;
}
function drawClouds(dist, now, wx, row) {
  const sp = 250 * S, speed = row ? .1 : .04, off = dist * speed + now * (row ? .012 : .006) * S;
  const i0 = Math.floor(off / sp) - 2, i1 = i0 + Math.ceil(W / sp) + 4;
  for (let i = i0; i <= i1; i++) {
    const seed = i * 7 + row * 1000, thr = hash(seed, 91);
    const a = clamp((wx.cover - thr) * 6, 0, 1);
    if (a <= 0) continue;
    const sz = (row ? 80 : 55) * S * (.8 + hash(seed, 92) * .6);
    const y = H * (row ? .1 + hash(seed, 93) * .16 : .2 + hash(seed, 93) * .16);
    drawCloud(i * sp - off + hash(seed, 94) * sp * .5, y, sz, seed, a, wx.storm * (.6 + .4 * hash(seed, 95)));
  }
}

function drawBirds(h, now) {
  for (const [start, len, dir] of [[6.7, 1.7, 1], [17.2, 1.6, -1]]) {
    const p = (h - start) / len;
    if (p < 0 || p > 1) continue;
    const bx = dir > 0 ? lerp(-.15 * W, 1.15 * W, p) : lerp(1.15 * W, -.15 * W, p), by = H * (.3 + .05 * Math.sin(p * 4));
    for (let k = 0; k < 7; k++) {
      const row = Math.ceil(k / 2), side = k % 2 ? 1 : -1;
      const x = bx - dir * row * 26 * S, y = by + side * row * 14 * S, s = 6 * S, f = Math.sin(now / 140 + k * .9);
      poly([[x - dir * s * 1.6, y], [x, y - s * .25], [x + dir * s * 1.2, y], [x, y + s * .25]], paint(C.bird, 1));
      poly([[x - dir * s * .4, y], [x + dir * s * .4, y], [x - dir * s * .2, y - f * s * 1.8]], paint(C.bird, 1.5));
      poly([[x - dir * s * .2, y], [x + dir * s * .5, y], [x + dir * s * .3, y - f * s * 1.3]], paint(C.bird, 1.2));
    }
  }
}

function drawRain(rain, now) {
  if (rain < .02) return;
  const n = Math.floor(rain * 320);
  ctx.strokeStyle = rgb(mixC([200, 214, 236], tint.map(v => v * 200), .3), .45);
  ctx.lineWidth = 1.4 * S;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const sp = .9 + hash(k, 2) * .6, y = (hash(k, 3) * H + now * sp * .9 * S) % (H * 1.1) - H * .05;
    const x = (hash(k, 1) * (W + 300) - y * .28 + now * .05) % (W + 300) - 50, len = (14 + hash(k, 4) * 14) * S;
    ctx.moveTo(x, y); ctx.lineTo(x - len * .28, y + len);
  }
  ctx.stroke();
}

function lightning(storm, now) {
  const win = 520, key = Math.floor(now / win), into = now % win;
  if (storm < .3 || hash(key, 5) > storm * .32 || into > 260) return null;
  return { a: 1 - into / 260, x: (.15 + hash(key, 6) * .7) * W, key };
}
function drawBolt(b) {
  const pts = [[b.x, H * .2]];
  let x = b.x, y = H * .2;
  const end = H * .7, segs = 8;
  for (let s = 1; s <= segs; s++) { y = lerp(H * .2, end, s / segs); x += (hash(b.key, s + 10) - .5) * 60 * S; pts.push([x, y]); }
  ctx.globalAlpha = Math.min(1, b.a * 1.6);
  for (let s = 0; s < pts.length - 1; s++) {
    const p = pts[s], q = pts[s + 1], w = (6 - s * .5) * S;
    poly([p, q, [p[0] + w, p[1]]], '#fff7c4');
    poly([p, q, [q[0] - w * .8, q[1]]], '#f1d66b');
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
let hudDay = -1, lastLabel = '';
function lane(el, cls, a, b) {
  el.innerHTML = '';
  const seg = (s, e) => { const d = document.createElement('div'); d.className = 'band'; d.style.left = (s / 24 * 100) + '%'; d.style.width = ((e - s) / 24 * 100) + '%'; el.appendChild(d); };
  if (b > a) seg(a, b); else { seg(a, 24); seg(0, b); }
}
function phaseLabel(h, m, wx) {
  const near = (t, d = .35) => Math.abs(((h - t + 36) % 24) - 12) < d;
  if (near(SUNRISE)) return 'Sunrise';
  if (near(SUNSET)) return 'Sunset';
  if (near(m.rise)) return 'Moonrise';
  if (near(m.set)) return 'Moonset';
  if (wx.storm > .55) return 'Thunderstorm';
  if (wx.rain > .3) return 'Rain';
  if (h > SUNRISE - 1 && h < SUNRISE) return 'First light';
  if (h > SUNSET && h < SUNSET + 1) return 'Dusk';
  if (h > SUNSET - 1.1 && h < SUNSET) return 'Golden hour';
  if (h > 11.5 && h < 13) return 'Midday heat';
  if (h >= SUNRISE && h < 11.5) return 'Morning';
  if (h >= 13 && h < SUNSET) return 'Afternoon';
  return 'Night';
}

// ---------- main loop ----------
const t0 = performance.now() - START_H / 24 * DAY_MS;
let dist = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  dist += dt * 200 * S * (reduced ? .4 : 1);
  const el = now - t0, day = Math.floor(el / DAY_MS), h = (el % DAY_MS) / DAY_MS * 24;
  const W8 = WEATHER[day % WEATHER.length], wx = W8.f(h), m = moonInfo(day);
  const sun = sunState(h), ms = moonState(h, m);

  dayK = sstep(-.12, .3, sun.alt);
  const golden = Math.exp(-(((sun.alt - .04) / .16) ** 2)) * (1 - wx.cover * .5), night = 1 - sstep(-.25, .03, sun.alt);
  tint = mixC([.34, .4, .64], [1, 1, 1], dayK);
  tint = mixC(tint, [1.16, .84, .62], golden * .65);
  tint = tint.map(v => v * (1 - wx.storm * .3 - wx.cover * .08));
  const bolt = lightning(wx.storm, now), flash = bolt ? bolt.a * (reduced ? .25 : 1) : 0;
  if (flash) tint = tint.map(v => v + flash * .45);
  const lx = sun.alt > -.05 ? arc(sun.p, sun.alt)[0] : ms.alt > 0 ? arc(ms.p, ms.alt)[0] : W / 2;
  lightSide = clamp((lx - W / 2) / (W / 2), -1, 1);

  let [top, bot] = skyAt(h);
  const grey = wx.cover * .25 + wx.storm * .55 * (.3 + .7 * dayK);
  top = mixC(top, mixC(hex('#4f5866'), top, 1 - dayK), grey);
  bot = mixC(bot, mixC(hex('#8b9097'), bot, 1 - dayK), grey);
  if (flash) { top = mixC(top, [200, 205, 235], flash * .4); bot = mixC(bot, [220, 220, 240], flash * .4); }
  haze = bot;

  const g = ctx.createLinearGradient(0, 0, 0, H * .75);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [t, r] of skyGrid) poly(t, r > .5 ? `rgba(255,255,255,${(r - .5) * .07})` : `rgba(0,0,20,${(.5 - r) * .08})`);

  drawStars(night, wx.cover, now);
  drawSun(sun, now, wx);
  drawMoon(ms, m, night, wx);
  drawClouds(dist, now, wx, 0);
  drawLayer(LAYERS[0], dist, now, 0);
  drawClouds(dist, now, wx, 1);
  drawBirds(h, now);
  drawLayer(LAYERS[1], dist, now, 1);
  if (bolt) drawBolt(bolt);
  for (let i = 2; i < LAYERS.length; i++) drawLayer(LAYERS[i], dist, now, i);
  drawRain(wx.rain, now);
  if (flash) { ctx.fillStyle = `rgba(235,238,255,${flash * .18})`; ctx.fillRect(0, 0, W, H); }

  ctx.fillStyle = noisePat; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,5,0,.32)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  // HUD
  if (day !== hudDay) {
    hudDay = day;
    $('day').textContent = 'Day ' + (day + 1);
    $('mr').textContent = fmt(m.rise); $('ms').textContent = fmt(m.set);
    $('sr').textContent = fmt(SUNRISE); $('ss').textContent = fmt(SUNSET);
    $('moonName').textContent = moonName(m.phase) + ' · ' + Math.round(m.illum * 100) + '% lit';
    $('wx').textContent = W8.name;
    lane($('sunLane'), 'sun', SUNRISE, SUNSET);
    lane($('moonLane'), 'moon', m.rise, m.set);
  }
  $('time').textContent = fmt(h);
  const label = phaseLabel(h, m, wx);
  if (label !== lastLabel) { $('phase').textContent = label; lastLabel = label; }
  $('now').style.left = (h / 24 * 100) + '%';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- screensaver behaviour ----------
let idleT;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3500); };
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(e => addEventListener(e, wake, { passive: true }));
wake();
const toggleFs = () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  } catch (e) {}
};
$('fs').addEventListener('click', toggleFs);
cv.addEventListener('dblclick', toggleFs);
addEventListener('keydown', e => { if (e.key === 'f') toggleFs(); });
const lock = () => { try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {} };
lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock());
})();
</script>
</body>
