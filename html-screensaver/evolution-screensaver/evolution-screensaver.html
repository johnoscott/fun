<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Billion Years — a life screensaver</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070d; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    cursor: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 22px 16px 22px;
    color: rgba(232,238,248,0.86);
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.75);
    transition: opacity 480ms ease;
    -webkit-font-smoothing: antialiased;
  }
  #hud.off { opacity: 0; }
  #bar {
    position: relative; height: 2px; width: 100%;
    background: rgba(255,255,255,0.13); border-radius: 2px; margin-bottom: 11px;
  }
  #fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(255,255,255,0.68); border-radius: 2px;
  }
  #ticks { position: absolute; left: 0; right: 0; top: -3px; height: 8px; }
  #ticks i {
    position: absolute; top: 0; width: 1px; height: 8px;
    background: rgba(255,255,255,0.28);
  }
  #row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  #era { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
  #sub { font-size: 11px; letter-spacing: 0.05em; opacity: 0.6; }
  #clock { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; text-align: right; }
  #weather { font-size: 11px; letter-spacing: 0.08em; opacity: 0.5; }
  #hint {
    position: fixed; top: 18px; right: 22px; font-size: 10px; letter-spacing: 0.12em;
    color: rgba(232,238,248,0.35); pointer-events: none; text-transform: uppercase;
    transition: opacity 900ms ease;
  }
  #hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <div id="bar"><div id="fill"></div><div id="ticks"></div></div>
  <div id="row">
    <span id="era">Hadean Ocean</span>
    <span id="sub"></span>
    <span id="weather"></span>
    <span id="clock"></span>
  </div>
</div>
<div id="hint">click: hud &nbsp;·&nbsp; space: pause</div>
<script>
"use strict";
/* ------------------------------------------------------------------ *
 *  FOUR BILLION YEARS
 *  A 60-second seamless loop: cellular-automaton life blooms into
 *  progressively more complex creatures, seen from directly above,
 *  under a rotating day/night sky and a drifting weather system.
 * ------------------------------------------------------------------ */

const LOOP        = 60;    // seconds per full evolutionary cycle
const DAY_CYCLES  = 5;     // whole day/nights per loop (integer => seamless)
const TAU         = Math.PI * 2;

const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, U = 1;     // U = universal size unit

/* ================================================================== *
 *  NOISE
 * ================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(20260809);
const rand  = (a = 1, b = 0) => b + (a - b) * rnd();
const randi = (n) => (rnd() * n) | 0;
const pick  = (arr) => arr[(rnd() * arr.length) | 0];

// hash-based value noise
const NP = new Uint8Array(512);
function buildPerm(seed) {
  const r = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) NP[i] = p[i & 255];
}
buildPerm(7717);

const fade = (t) => t * t * (3 - 2 * t);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const X = xi & 255, Y = yi & 255;
  const aa = NP[NP[X] + Y], ba = NP[NP[X + 1] + Y];
  const ab = NP[NP[X] + Y + 1], bb = NP[NP[X + 1] + Y + 1];
  const u = fade(xf), v = fade(yf);
  const top = aa + (ba - aa) * u, bot = ab + (bb - ab) * u;
  return (top + (bot - top) * v) / 255;
}
function fbm(x, y, oct, gain) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += vnoise(x * f, y * f) * amp;
    norm += amp; amp *= (gain || 0.5); f *= 2.03;
  }
  return s / norm;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

/* ================================================================== *
 *  TIMELINE — keyframed world parameters.
 *  The final keyframe equals the first so the whole loop is seamless.
 * ================================================================== */
const ERAS = [
  { at: 0.000, name: 'Hadean Ocean',     sub: 'chemistry learns to copy itself', mya: 4000,
    sea: 0.640, green: 0.00, mat: 0.35, pop: 0.00, kinds: ['spark'] },
  { at: 0.075, name: 'First Cells',      sub: 'a membrane, an inside and an outside', mya: 3500,
    sea: 0.628, green: 0.00, mat: 0.85, pop: 0.35, kinds: ['spark', 'blob'] },
  { at: 0.170, name: 'Great Oxidation',  sub: 'cyanobacteria rust the world', mya: 2400,
    sea: 0.610, green: 0.05, mat: 1.00, pop: 0.55, kinds: ['blob'] },
  { at: 0.280, name: 'First Colonies',   sub: 'cells discover each other', mya: 1200,
    sea: 0.580, green: 0.10, mat: 0.85, pop: 0.75, kinds: ['blob', 'chain'] },
  { at: 0.380, name: 'Ediacaran Calm',   sub: 'soft bodies drift the shallows', mya: 600,
    sea: 0.545, green: 0.18, mat: 0.70, pop: 0.90, kinds: ['chain', 'colony'] },
  { at: 0.460, name: 'Cambrian Bloom',   sub: 'segments, shells, and the first eyes', mya: 520,
    sea: 0.520, green: 0.26, mat: 0.55, pop: 1.00, kinds: ['worm', 'trilobite'] },
  { at: 0.560, name: 'Age of Fishes',    sub: 'a spine, and a reason to swim fast', mya: 400,
    sea: 0.492, green: 0.42, mat: 0.45, pop: 1.00, kinds: ['fish', 'trilobite', 'worm'] },
  { at: 0.650, name: 'Coal Forests',     sub: 'life crawls out and grows wings', mya: 320,
    sea: 0.455, green: 0.80, mat: 0.36, pop: 1.00, kinds: ['amphib', 'bug', 'insect', 'fish'] },
  { at: 0.740, name: 'Age of Reptiles',  sub: 'scales inherit the dry land', mya: 230,
    sea: 0.424, green: 0.72, mat: 0.30, pop: 0.95, kinds: ['reptile', 'bug', 'insect', 'fish'] },
  { at: 0.830, name: 'Dinosaur Dominion',sub: 'the largest things ever to walk', mya: 110,
    sea: 0.398, green: 0.88, mat: 0.26, pop: 0.80, kinds: ['dino', 'reptile', 'bird'] },
  { at: 0.915, name: 'Mammals & Birds',  sub: 'warm blood, long memory', mya: 40,
    sea: 0.418, green: 0.92, mat: 0.24, pop: 0.95, kinds: ['mammal', 'bird', 'insect'] },
  { at: 0.965, name: 'The Long Winter',  sub: 'ice, then ocean, then quiet', mya: 2,
    sea: 0.520, green: 0.45, mat: 0.30, pop: 0.45, kinds: ['mammal', 'bird'] },
  { at: 1.000, name: 'Hadean Ocean',     sub: 'chemistry learns to copy itself', mya: 4000,
    sea: 0.640, green: 0.00, mat: 0.35, pop: 0.00, kinds: ['spark'] },
];

function eraIndexAt(t) {
  let i = 0;
  for (let k = 0; k < ERAS.length - 1; k++) if (t >= ERAS[k].at) i = k;
  return i;
}
function params(t) {
  const i = eraIndexAt(t);
  const a = ERAS[i], b = ERAS[i + 1] || ERAS[ERAS.length - 1];
  const span = Math.max(1e-6, b.at - a.at);
  const k = smoothstep(0, 1, clamp((t - a.at) / span, 0, 1));
  return {
    idx: i, k,
    era: a, next: b,
    sea:   lerp(a.sea,   b.sea,   k),
    green: lerp(a.green, b.green, k),
    mat:   lerp(a.mat,   b.mat,   k),
    pop:   lerp(a.pop,   b.pop,   k),
    mya:   lerp(a.mya,   b.mya,   k),
  };
}

/* ================================================================== *
 *  TERRAIN
 *  A static height/moisture field; the sea level and the amount of
 *  plant cover animate across the loop, so the map is re-baked only
 *  when one of those has drifted enough to matter.
 * ================================================================== */
let TW = 0, TH = 0, TSCALE = 3;
let height = null, moist = null, detail = null;
let terrainCv = null, terrainCtx = null, terrainImg = null;
let habitat = null;                     // per-automaton-cell: 1 water, 2 land, 0 dead
let bakedSea = -99, bakedGreen = -99;

function buildField() {
  TW = Math.max(8, Math.ceil(W / TSCALE));
  TH = Math.max(8, Math.ceil(H / TSCALE));
  height = new Float32Array(TW * TH);
  moist  = new Float32Array(TW * TH);
  detail = new Float32Array(TW * TH);

  const s = 2.6 / Math.max(TW, TH);
  for (let y = 0; y < TH; y++) {
    for (let x = 0; x < TW; x++) {
      const nx = x * s, ny = y * s;
      // domain warp gives coastlines that wander instead of blobbing
      const wx = fbm(nx * 1.7 + 11.3, ny * 1.7 + 4.1, 3, 0.5) - 0.5;
      const wy = fbm(nx * 1.7 - 8.7,  ny * 1.7 - 2.9, 3, 0.5) - 0.5;
      let h = fbm(nx + wx * 0.5, ny + wy * 0.5, 6, 0.48);
      // continental mask: keeps a big landmass and some islands
      const cont = fbm(nx * 0.42 + 31.7, ny * 0.42 + 19.4, 3, 0.55);
      h = h * 0.6 + cont * 0.4;
      // ridge detail on the highlands
      const ridge = 1 - Math.abs(fbm(nx * 2.2 + 5.5, ny * 2.2 + 9.2, 3, 0.5) * 2 - 1);
      h += ridge * 0.05 * smoothstep(0.5, 0.74, h);
      height[y * TW + x] = h;
      moist[y * TW + x]  = fbm(nx * 1.35 + 61.1, ny * 1.35 + 47.7, 4, 0.5);
      detail[y * TW + x] = vnoise(x * 0.62 + 3.3, y * 0.62 + 7.7);
    }
  }
  terrainCv = document.createElement('canvas');
  terrainCv.width = TW; terrainCv.height = TH;
  terrainCtx = terrainCv.getContext('2d');
  terrainImg = terrainCtx.createImageData(TW, TH);
  bakedSea = -99; bakedGreen = -99;
}

function hAt(px, py) {
  let x = (px / TSCALE) | 0, y = (py / TSCALE) | 0;
  if (x < 0) x = 0; else if (x >= TW) x = TW - 1;
  if (y < 0) y = 0; else if (y >= TH) y = TH - 1;
  return height[y * TW + x];
}

const COL = {
  abyss:   [7, 14, 30],
  deep:    [13, 36, 68],
  ocean:   [22, 68, 106],
  shelf:   [38, 106, 132],
  shallow: [70, 148, 158],
  sand:    [196, 180, 142],
  lowBare: [124, 106, 90],  lowGreen: [92, 130, 66],
  midBare: [104, 90, 78],   midGreen: [56, 100, 52],
  hiBare:  [116, 108, 102], hiGreen:  [78, 92, 64],
  rock:    [128, 124, 122],
  snow:    [226, 230, 238],
};
function ramp(c0, c1, t, out) {
  out[0] = c0[0] + (c1[0] - c0[0]) * t;
  out[1] = c0[1] + (c1[1] - c0[1]) * t;
  out[2] = c0[2] + (c1[2] - c0[2]) * t;
}

function bakeTerrain(sea, green) {
  const d = terrainImg.data;
  const c = [0, 0, 0];
  // fixed bake-light from the north-west so relief reads at any hour
  const LX = -0.72, LY = -0.69;
  for (let y = 0; y < TH; y++) {
    for (let x = 0; x < TW; x++) {
      const i = y * TW + x;
      const h = height[i], m = moist[i], dt = detail[i];
      const e = h - sea;                                 // elevation above sea level
      if (e < 0) {
        const dep = -e;
        if (dep > 0.17)      ramp(COL.deep, COL.abyss, smoothstep(0.17, 0.34, dep), c);
        else if (dep > 0.055) ramp(COL.ocean, COL.deep, smoothstep(0.055, 0.17, dep), c);
        else if (dep > 0.016) ramp(COL.shelf, COL.ocean, smoothstep(0.016, 0.055, dep), c);
        else                  ramp(COL.shallow, COL.shelf, smoothstep(0, 0.016, dep), c);
        // banded swell texture
        const sw = (dt - 0.5) * 12 * smoothstep(0.22, 0.0, dep);
        c[0] += sw; c[1] += sw * 1.15; c[2] += sw * 1.2;
        // surf line hugging the coast
        const foam = smoothstep(0.020, 0.001, dep) * (0.40 + dt * 0.45);
        c[0] += foam * 52; c[1] += foam * 66; c[2] += foam * 70;
      } else {
        const g = clamp(green * (0.45 + m * 0.85), 0, 1);
        if (e < 0.012) {
          ramp(COL.shallow, COL.sand, smoothstep(0, 0.012, e), c);
        } else if (e < 0.06) {
          ramp(COL.lowBare, COL.lowGreen, g, c);
          const t2 = smoothstep(0.012, 0.06, e);
          c[0] = lerp(COL.sand[0], c[0], t2);
          c[1] = lerp(COL.sand[1], c[1], t2);
          c[2] = lerp(COL.sand[2], c[2], t2);
        } else if (e < 0.15) {
          const bare = [0, 0, 0], grn = [0, 0, 0], t2 = smoothstep(0.06, 0.15, e);
          ramp(COL.lowBare, COL.midBare, t2, bare);
          ramp(COL.lowGreen, COL.midGreen, t2, grn);
          ramp(bare, grn, g, c);
          // canopy speckle
          if (g > 0.42 && dt > 0.60) { const f = (dt - 0.60) * 2.2 * g; c[0] -= 26 * f; c[1] -= 14 * f; c[2] -= 20 * f; }
        } else if (e < 0.235) {
          ramp(COL.hiBare, COL.hiGreen, g * 0.7, c);
          const t2 = smoothstep(0.15, 0.235, e);
          ramp(c, COL.rock, t2 * 0.75, c);
        } else {
          ramp(COL.rock, COL.snow, smoothstep(0.245, 0.30, e), c);
        }
        // young hot world: lava seeping through the bare crust
        const heat = (1 - clamp(green * 4, 0, 1)) * smoothstep(0.70, 0.88, m) * smoothstep(0.02, 0.10, e);
        if (heat > 0.001) {
          const f = heat * 0.8;
          c[0] += 132 * f; c[1] += 40 * f; c[2] += 12 * f;
        }
        // fine grain so bare crust is not a flat wash
        const grain = (dt - 0.5) * 10 * (1 - g * 0.5);
        c[0] += grain; c[1] += grain * 0.92; c[2] += grain * 0.84;
        // relief shading from the height gradient
        const xl = x > 0 ? i - 1 : i, xr = x < TW - 1 ? i + 1 : i;
        const yu = y > 0 ? i - TW : i, yd = y < TH - 1 ? i + TW : i;
        const gx = (height[xr] - height[xl]) * 6, gy = (height[yd] - height[yu]) * 6;
        const sh = clamp(1 + (gx * LX + gy * LY) * 1.05, 0.80, 1.22);
        c[0] *= sh; c[1] *= sh; c[2] *= sh;
      }
      const o = i * 4;
      d[o]     = c[0] < 0 ? 0 : c[0] > 255 ? 255 : c[0];
      d[o + 1] = c[1] < 0 ? 0 : c[1] > 255 ? 255 : c[1];
      d[o + 2] = c[2] < 0 ? 0 : c[2] > 255 ? 255 : c[2];
      d[o + 3] = 255;
    }
  }
  terrainCtx.putImageData(terrainImg, 0, 0);
  bakedSea = sea; bakedGreen = green;
  refreshHabitat(sea, green);
}

/* ================================================================== *
 *  THE MAT — a Conway automaton standing in for microbial life.
 *  Lives in the shallows as algae and on wet land as ground cover.
 *  Drawn at one pixel per cell and scaled up, so it reads as a soft
 *  organic bloom rather than a grid of squares.
 * ================================================================== */
let GW = 0, GH = 0, cur = null, nxt = null, age = null;
let matCv = null, matCtx = null, matImg = null;
let matAcc = 0;
const MAT_STEP = 0.085;

function buildMat() {
  GW = clamp(Math.round(W / 6), 60, 300);
  GH = Math.max(40, Math.round(GW * H / W));
  cur = new Uint8Array(GW * GH);
  nxt = new Uint8Array(GW * GH);
  age = new Uint8Array(GW * GH);
  habitat = new Uint8Array(GW * GH);
  matCv = document.createElement('canvas');
  matCv.width = GW; matCv.height = GH;
  matCtx = matCv.getContext('2d');
  matImg = matCtx.createImageData(GW, GH);
  for (let i = 0; i < cur.length; i++) cur[i] = rnd() < 0.22 ? 1 : 0;
}

function refreshHabitat(sea, green) {
  if (!habitat) return;
  for (let y = 0; y < GH; y++) {
    const py = (y + 0.5) * H / GH;
    for (let x = 0; x < GW; x++) {
      const px = (x + 0.5) * W / GW;
      const e = hAt(px, py) - sea;
      let hb = 0;
      if (e < 0 && e > -0.14) hb = 1;                          // sunlit shallows
      else if (e > 0.002 && e < 0.22 && green > 0.12) hb = 2;   // damp land
      habitat[y * GW + x] = hb;
    }
  }
}

function stepMat() {
  for (let y = 0; y < GH; y++) {
    const ym = ((y - 1 + GH) % GH) * GW, yp = ((y + 1) % GH) * GW, y0 = y * GW;
    for (let x = 0; x < GW; x++) {
      const i = y0 + x;
      if (!habitat[i]) { nxt[i] = 0; age[i] = 0; continue; }
      const xm = (x - 1 + GW) % GW, xp = (x + 1) % GW;
      const n = cur[ym + xm] + cur[ym + x] + cur[ym + xp] +
                cur[y0 + xm] +                cur[y0 + xp] +
                cur[yp + xm] + cur[yp + x] + cur[yp + xp];
      const a = cur[i];
      let live = a ? (n === 2 || n === 3) : (n === 3);
      // a trickle of spontaneous generation keeps the mat from dying out
      if (!live && rnd() < 0.0016) live = true;
      nxt[i] = live ? 1 : 0;
      age[i] = live ? Math.min(255, age[i] + 12) : 0;
    }
  }
  const t = cur; cur = nxt; nxt = t;

  const d = matImg.data;
  for (let i = 0; i < cur.length; i++) {
    const o = i * 4;
    if (!cur[i]) { d[o + 3] = 0; continue; }
    const a = age[i] / 255;
    if (habitat[i] === 1) {           // algae: teal turning green as it thickens
      d[o]     = 40 + a * 60;
      d[o + 1] = 190 + a * 30;
      d[o + 2] = 170 - a * 70;
    } else {                          // ground cover
      d[o]     = 96 + a * 40;
      d[o + 1] = 180 + a * 40;
      d[o + 2] = 70 + a * 20;
    }
    d[o + 3] = 130 + a * 105;
  }
  matCtx.putImageData(matImg, 0, 0);
}

/* ================================================================== *
 *  SKY, WEATHER
 * ================================================================== */
// Night keeps a moonlit floor — a screensaver you cannot see is not a screensaver.
const SUN_STOPS = [
  [-1.00, [72, 86, 130]],
  [-0.30, [86, 100, 146]],
  [-0.08, [136, 114, 138]],
  [ 0.05, [236, 162, 116]],
  [ 0.18, [255, 210, 168]],
  [ 0.42, [255, 250, 240]],
  [ 1.00, [255, 255, 255]],
];
function sunTint(e, out) {
  for (let i = 0; i < SUN_STOPS.length - 1; i++) {
    const a = SUN_STOPS[i], b = SUN_STOPS[i + 1];
    if (e <= b[0] || i === SUN_STOPS.length - 2) {
      const t = clamp((e - a[0]) / (b[0] - a[0]), 0, 1);
      out[0] = lerp(a[1][0], b[1][0], t);
      out[1] = lerp(a[1][1], b[1][1], t);
      out[2] = lerp(a[1][2], b[1][2], t);
      return out;
    }
  }
  return out;
}

const WEATHERS = ['clear', 'clear', 'fair', 'fair', 'overcast', 'rain', 'rain', 'storm', 'fog', 'snow'];
const weather = {
  kind: 'fair', next: 'fair', blend: 1,
  timer: 6, cloud: 0.3, wet: 0, fog: 0, snow: 0,
  windX: 0.4, windY: 0.12, flash: 0, flashTimer: 2.4,
};
function chooseWeather(p) {
  let k = pick(WEATHERS);
  if (k === 'snow' && p.green > 0.35 && p.sea < 0.5) k = 'rain';  // hothouse world: rain, not snow
  if (p.green < 0.06 && (k === 'fog' || k === 'snow')) k = 'overcast';
  return k;
}
function weatherTargets(k) {
  switch (k) {
    case 'clear':    return { cloud: 0.05, wet: 0,    fog: 0.00, snow: 0 };
    case 'fair':     return { cloud: 0.28, wet: 0,    fog: 0.02, snow: 0 };
    case 'overcast': return { cloud: 0.72, wet: 0,    fog: 0.10, snow: 0 };
    case 'rain':     return { cloud: 0.80, wet: 0.65, fog: 0.16, snow: 0 };
    case 'storm':    return { cloud: 0.95, wet: 1.00, fog: 0.20, snow: 0 };
    case 'fog':      return { cloud: 0.55, wet: 0.05, fog: 0.82, snow: 0 };
    case 'snow':     return { cloud: 0.78, wet: 0.10, fog: 0.28, snow: 1 };
  }
  return { cloud: 0.3, wet: 0, fog: 0, snow: 0 };
}
function updateWeather(dt, p) {
  weather.timer -= dt;
  if (weather.timer <= 0) { weather.kind = chooseWeather(p); weather.timer = rand(9, 4); }
  const T = weatherTargets(weather.kind);
  const r = 1 - Math.pow(0.06, dt);
  weather.cloud += (T.cloud - weather.cloud) * r;
  weather.wet   += (T.wet   - weather.wet)   * r;
  weather.fog   += (T.fog   - weather.fog)   * r;
  weather.snow  += (T.snow  - weather.snow)  * r;
  weather.windX += (Math.sin(clock * 0.19) * 0.9 + 0.25 - weather.windX) * dt * 0.5;
  weather.windY += (Math.cos(clock * 0.13) * 0.35 - weather.windY) * dt * 0.5;

  weather.flash *= Math.pow(0.012, dt);
  if (weather.kind === 'storm') {
    weather.flashTimer -= dt;
    if (weather.flashTimer <= 0) { weather.flash = rand(1, 0.5); weather.flashTimer = rand(3.4, 0.4); }
  }
}

// pre-tinted bioluminescence sprites, one per 30° of hue
const glowSprites = [];
(function buildGlow() {
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, `hsla(${i * 30},92%,70%,1)`);
    grd.addColorStop(0.45, `hsla(${i * 30},92%,64%,0.32)`);
    grd.addColorStop(1, `hsla(${i * 30},92%,58%,0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    glowSprites.push(c);
  }
})();

// drifting cloud shadows
const clouds = [];
function buildClouds() {
  clouds.length = 0;
  const n = 16;
  for (let i = 0; i < n; i++) {
    clouds.push({ x: rand(W * 1.4, -W * 0.2), y: rand(H * 1.4, -H * 0.2), r: rand(0.42, 0.14) * Math.min(W, H), s: rand(1.5, 0.6) });
  }
}

// rain / snow / shimmer particles
const drops = [];
const flakes = [];
const shimmer = [];
function buildParticles() {
  drops.length = 0; flakes.length = 0; shimmer.length = 0;
  for (let i = 0; i < 900; i++) drops.push({ x: rand(W), y: rand(H), v: rand(1.5, 0.85), l: rand(1.5, 0.7) });
  for (let i = 0; i < 420; i++) flakes.push({ x: rand(W), y: rand(H), v: rand(1.2, 0.5), p: rand(TAU), r: rand(1.9, 0.7) });
  for (let i = 0; i < 260; i++) shimmer.push({ x: rand(W), y: rand(H), p: rand(TAU), l: rand(1) });
}

/* ================================================================== *
 *  CREATURES
 *  One body plan, driven by a genome. Later eras hand out genomes with
 *  more joints, more limb pairs, wings, fins and eyes — so complexity
 *  visibly accumulates instead of being hand-drawn per era.
 * ================================================================== */
// `gap` is joint spacing as a fraction of body radius: small values weld the
// spine into one solid silhouette, large values leave visible segments.
const ARCH = {
  spark:    { size: [1.6, 3.0],  joints: 2, gap: 0.50, limbs: 0, tail: 0,   speed: [14, 34], habitat: 'water', glow: 1.0,  hue: [150, 200], sat: 70, lig: 62, eyes: 0, fins: 0, wings: 0, cilia: 0, seg: 0.0 },
  blob:     { size: [2.6, 5.0],  joints: 2, gap: 0.45, limbs: 0, tail: 0,   speed: [10, 24], habitat: 'water', glow: 0.8,  hue: [140, 195], sat: 55, lig: 58, eyes: 0, fins: 0, wings: 0, cilia: 1, seg: 0.1 },
  chain:    { size: [2.0, 3.6],  joints: 7, gap: 0.85, limbs: 0, tail: 0.4, speed: [14, 30], habitat: 'water', glow: 0.7,  hue: [120, 190], sat: 50, lig: 55, eyes: 0, fins: 0, wings: 0, cilia: 1, seg: 0.5 },
  colony:   { size: [3.2, 6.0],  joints: 4, gap: 0.62, limbs: 0, tail: 0,   speed: [8, 18],  habitat: 'water', glow: 0.6,  hue: [20, 320],  sat: 45, lig: 60, eyes: 0, fins: 1, wings: 0, cilia: 1, seg: 0.3 },
  worm:     { size: [1.9, 3.4],  joints: 11, gap: 0.62, limbs: 5, tail: 0.5, speed: [20, 40], habitat: 'water', glow: 0.35, hue: [10, 45],  sat: 45, lig: 48, eyes: 1, fins: 0, wings: 0, cilia: 0, seg: 0.9 },
  trilobite:{ size: [3.4, 6.0],  joints: 6, gap: 0.42, limbs: 5, tail: 0.15,speed: [14, 28], habitat: 'water', glow: 0.25, hue: [18, 40],  sat: 40, lig: 40, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 1.0 },
  fish:     { size: [3.0, 6.4],  joints: 7, gap: 0.46, limbs: 0, tail: 0.5, speed: [34, 70], habitat: 'water', glow: 0.3,  hue: [180, 215], sat: 34, lig: 46, eyes: 2, fins: 2, wings: 0, cilia: 0, seg: 0.6 },
  amphib:   { size: [4.4, 7.6],  joints: 6, gap: 0.48, limbs: 2, sprawl: 1.15, tail: 0.7, speed: [16, 34], habitat: 'shore', glow: 0.15, hue: [70, 120],  sat: 34, lig: 40, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 0.4 },
  bug:      { size: [2.4, 4.2],  joints: 7, gap: 0.52, limbs: 6, sprawl: 1.2, tail: 0.3, speed: [26, 52], habitat: 'land',  glow: 0.12, hue: [12, 48],   sat: 42, lig: 38, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 1.0 },
  insect:   { size: [2.2, 4.0],  joints: 3, gap: 0.55, limbs: 3, tail: 0.25,speed: [44, 92], habitat: 'air',   glow: 0.25, hue: [35, 200],  sat: 45, lig: 40, eyes: 2, fins: 0, wings: 2, cilia: 0, seg: 1.0 },
  reptile:  { size: [5.2, 9.0],  joints: 7, gap: 0.50, limbs: 2, sprawl: 1.05, tail: 1.3, speed: [22, 48], habitat: 'land',  glow: 0.10, hue: [55, 110],  sat: 28, lig: 39, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 0.7 },
  dino:     { size: [9.0, 17.0], joints: 8, gap: 0.52, limbs: 2, sprawl: 0.85, tail: 1.5, speed: [20, 46], habitat: 'land',  glow: 0.08, hue: [24, 95],   sat: 26, lig: 37, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 0.6 },
  mammal:   { size: [4.6, 8.6],  joints: 5, gap: 0.48, limbs: 2, sprawl: 0.55, tail: 0.5, speed: [30, 66], habitat: 'land',  glow: 0.06, hue: [18, 42],   sat: 34, lig: 39, eyes: 2, fins: 0, wings: 0, cilia: 0, seg: 0.2, fur: 1 },
  bird:     { size: [3.0, 5.2],  joints: 3, gap: 0.45, limbs: 0, tail: 0.5, speed: [70, 130],habitat: 'air',   glow: 0.10, hue: [16, 44],   sat: 22, lig: 30, eyes: 2, fins: 0, wings: 1, cilia: 0, seg: 0.1, flock: 1 },
};

const creatures = [];
let MAXPOP = 90;

function habitatScore(kind, e) {           // e = elevation relative to sea level
  switch (kind) {
    case 'water': return e < -0.004 ? clamp(1 - Math.max(0, -e - 0.12) * 6, 0.1, 1) : -1;
    case 'land':  return e > 0.006 ? clamp(1 - Math.max(0, e - 0.16) * 6, 0.1, 1) : -1;
    case 'shore': return Math.abs(e) < 0.075 ? 1 - Math.abs(e) * 8 : -1;
    default:      return 1;                // 'air'
  }
}

function spawn(kindName, p) {
  const A = ARCH[kindName];
  if (!A) return;
  // find a spot that suits the body plan
  let x = 0, y = 0, ok = false;
  for (let tries = 0; tries < 26; tries++) {
    x = rand(W); y = rand(H);
    if (habitatScore(A.habitat, hAt(x, y) - p.sea) > 0) { ok = true; break; }
  }
  if (!ok) return;

  const scale = rand(A.size[1], A.size[0]) * U;
  const c = {
    kind: kindName, A, x, y,
    ang: rand(TAU),
    turn: 0,
    speed: rand(A.speed[1], A.speed[0]) * U,
    base: 0,
    r: scale,
    gait: rand(TAU),
    wander: rand(TAU),
    hue: (A.hue[0] + (A.hue[1] - A.hue[0]) * rnd() + 360) % 360,
    sat: A.sat * rand(1.25, 0.75),
    lig: A.lig * rand(1.18, 0.85),
    fade: 0, dying: false,
    age: 0, life: rand(28, 9),
    limbPairs: A.limbs,
    joints: [],
    torso: A.joints,
    spacing: scale * A.gap,
    dash: 0, dashT: rand(4, 1),
  };
  c.base = c.speed;
  const total = Math.max(2, A.joints + (A.tail > 0 ? Math.round(A.tail * 4) : 0));
  for (let i = 0; i < total; i++) c.joints.push({ x: x - Math.cos(c.ang) * i * c.spacing, y: y - Math.sin(c.ang) * i * c.spacing });
  creatures.push(c);
}

function steer(c, dt, p) {
  const A = c.A;
  // habitat gradient: sample three headings and lean toward the best
  if (A.habitat !== 'air') {
    const look = c.r * 9 + 26 * U;
    let best = 0, bestS = -9;
    for (let k = -1; k <= 1; k++) {
      const a = c.ang + k * 0.7;
      const s = habitatScore(A.habitat, hAt(c.x + Math.cos(a) * look, c.y + Math.sin(a) * look) - p.sea)
              + (k === 0 ? 0.22 : 0);
      if (s > bestS) { bestS = s; best = k; }
    }
    if (bestS <= 0) {
      // cornered: turn hard and keep turning the same way
      c.turn += (best === 0 ? (c.wander > Math.PI ? 1 : -1) : best) * dt * 9;
    } else {
      c.turn += best * dt * 3.4;
    }
  }
  // wander
  c.wander = (c.wander + dt * rand(1.6, 0.4)) % TAU;
  c.turn += Math.sin(c.wander * 3.1) * dt * 1.6;

  // flocking, for birds
  if (A.flock) {
    let ax = 0, ay = 0, hx = 0, hy = 0, n = 0;
    for (let i = 0; i < creatures.length; i += 3) {
      const o = creatures[i];
      if (o === c || o.kind !== c.kind) continue;
      const dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
      if (d2 < 26000 * U * U && d2 > 1) {
        ax += dx; ay += dy; hx += Math.cos(o.ang); hy += Math.sin(o.ang); n++;
        if (d2 < 900 * U * U) { ax -= dx * 2.6; ay -= dy * 2.6; }
      }
    }
    if (n) {
      const want = Math.atan2(ay / n * 0.55 + hy, ax / n * 0.55 + hx);
      let df = want - c.ang;
      while (df > Math.PI) df -= TAU; while (df < -Math.PI) df += TAU;
      c.turn += df * dt * 2.4;
    }
  }

  // occasional bursts of speed
  c.dashT -= dt;
  if (c.dashT <= 0) { c.dash = rand(1.9, 0.9); c.dashT = rand(7, 2); }
  c.dash = Math.max(0, c.dash - dt * 1.1);

  c.turn *= Math.pow(0.02, dt);
  c.ang += c.turn * dt * 3.2;

  const spd = c.base * (1 + c.dash * 0.9) * (1 - weather.wet * 0.12);
  c.gait += dt * (4.2 + spd / (c.r * 2.2));
  const surge = A.habitat === 'water' || A.habitat === 'air' ? 1 + Math.sin(c.gait) * 0.16 : 1 + Math.sin(c.gait * 2) * 0.10;
  c.speed = spd * surge;

  c.x += Math.cos(c.ang) * c.speed * dt;
  c.y += Math.sin(c.ang) * c.speed * dt;

  // wrap softly at the edges
  const m = c.r * 6;
  if (c.x < -m) c.x += W + m * 2; else if (c.x > W + m) c.x -= W + m * 2;
  if (c.y < -m) c.y += H + m * 2; else if (c.y > H + m) c.y -= H + m * 2;

  // follow-the-leader spine: each joint trails the one in front
  const js = c.joints;
  js[0].x = c.x; js[0].y = c.y;
  const sp = c.spacing;
  for (let i = 1; i < js.length; i++) {
    const dx = js[i].x - js[i - 1].x, dy = js[i].y - js[i - 1].y;
    const d = Math.hypot(dx, dy) || 1e-4;
    const k = sp / d;
    js[i].x = js[i - 1].x + dx * k;
    js[i].y = js[i - 1].y + dy * k;
  }
}

function updateCreatures(dt, p) {
  const target = Math.round(MAXPOP * p.pop * quality);
  const kinds = p.era.kinds;

  // retire anything whose era has passed
  let alive = 0;
  for (const c of creatures) {
    c.age += dt;
    if (!c.dying) {
      if (kinds.indexOf(c.kind) < 0 && rnd() < dt * 2.5) c.dying = true;
      else if (c.age > c.life) c.dying = true;
      else alive++;
    }
  }
  if (alive < target) {
    const n = Math.min(3, target - alive);
    for (let i = 0; i < n; i++) spawn(pick(kinds), p);
  } else if (alive > target) {
    let over = alive - target;
    for (const c of creatures) { if (over <= 0) break; if (!c.dying) { c.dying = true; over--; } }
  }

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    c.fade += ((c.dying ? 0 : 1) - c.fade) * (1 - Math.pow(0.02, dt));
    if (c.dying && c.fade < 0.02) { creatures.splice(i, 1); continue; }
    steer(c, dt, p);
  }
}

/* ---- creature rendering ------------------------------------------ */
function drawShadow(c, sx, sy, soft) {
  const js = c.joints;
  ctx.beginPath();
  for (let i = 0; i < js.length; i++) {
    const r = c.r * bodyProfile(i / Math.max(1, js.length - 1), c) * soft;
    if (r <= 0.2) continue;
    ctx.moveTo(js[i].x + sx + r, js[i].y + sy);
    ctx.arc(js[i].x + sx, js[i].y + sy, r, 0, TAU);
  }
  ctx.fill();
}

// silhouette width along the body, 0 = nose, 1 = tail tip
function bodyProfile(u, c) {
  const A = c.A;
  const head = Math.sin(Math.min(1, u * 4.4) * Math.PI * 0.5);
  const taper = A.tail > 0 ? Math.pow(1 - u, 0.75) : 1 - u * 0.35;
  let w = (0.34 + 0.66 * head) * taper;
  if (c.kind === 'trilobite') w = Math.sin((0.18 + u * 0.72) * Math.PI) * 1.25;
  if (c.kind === 'dino' || c.kind === 'reptile') w = (0.3 + 0.7 * head) * Math.pow(1 - u, 1.15) + 0.06;
  if (c.kind === 'mammal') w = Math.sin((0.14 + u * 0.7) * Math.PI) * 1.05;
  return Math.max(0.04, w);
}

function drawCreature(c, night, sunEl, shX, shY) {
  const A = c.A, js = c.joints, n = js.length;
  const f = c.fade;
  if (f < 0.02 || n < 2) return;
  const R = c.r * (0.35 + 0.65 * f);

  const ang = Math.atan2(js[0].y - js[1].y, js[0].x - js[1].x);
  const fx = Math.cos(ang), fy = Math.sin(ang);
  const px = -fy, py = fx;

  // --- shadow -------------------------------------------------------
  const airborne = A.habitat === 'air';
  const shadowAlpha = clamp(0.30 * (0.25 + Math.max(0, sunEl)) * (1 - weather.cloud * 0.6), 0, 0.4) * f;
  if (shadowAlpha > 0.01) {
    const lift = airborne ? 7 * U : 1;
    ctx.fillStyle = `rgba(4,10,16,${shadowAlpha * (airborne ? 0.75 : 1)})`;
    drawShadow(c, shX * lift + (airborne ? 9 * U : 0), shY * lift + (airborne ? 9 * U : 0), airborne ? 0.95 : 1.05);
  } else if (A.habitat === 'water') {
    ctx.fillStyle = `rgba(2,10,20,${0.16 * f})`;
    drawShadow(c, 1.5 * U, 2.2 * U, 1.1);
  }

  const hue = c.hue, sat = c.sat, lig = c.lig;

  // --- limbs (drawn under the body) ---------------------------------
  if (c.limbPairs > 0) {
    const isBug = c.kind === 'insect' || c.kind === 'trilobite' || c.kind === 'worm';
    const feet = [];
    const lo = 1, hi = Math.max(2, Math.min(c.torso - 1, n - 2));
    ctx.strokeStyle = `hsla(${hue},${sat * 0.8}%,${lig * 0.72}%,${0.92 * f})`;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let lw = 0;
    for (let L = 0; L < c.limbPairs; L++) {
      const at = c.limbPairs === 1 ? (lo + hi) / 2 : lo + L * (hi - lo) / (c.limbPairs - 1);
      const i0 = clamp(Math.round(at), 0, n - 2);
      const j0 = js[i0], j1 = js[i0 + 1];
      const dax = j0.x - j1.x, day = j0.y - j1.y;
      const dl = Math.hypot(dax, day) || 1;
      const ux = dax / dl, uy = day / dl, vx = -uy, vy = ux;
      const w = R * bodyProfile(i0 / (n - 1), c);
      const reach  = w * (isBug ? 2.5 : 1.9) * (A.sprawl || 1);
      const stride = w * (isBug ? 2.0 : 2.4);
      lw = Math.max(lw, Math.max(0.7, w * (isBug ? 0.22 : 0.40)));
      for (let s = -1; s <= 1; s += 2) {
        // diagonal gait: opposite sides, and successive pairs, alternate
        const phase = c.gait + L * Math.PI + (s > 0 ? 0 : Math.PI);
        const sw = Math.sin(phase);
        const lift = 0.82 + 0.18 * Math.cos(phase);      // leg extends on the power stroke
        const hipx = j0.x + vx * w * s * 0.75, hipy = j0.y + vy * w * s * 0.75;
        const kneex = hipx + vx * reach * 0.60 * s + ux * sw * stride * 0.22;
        const kneey = hipy + vy * reach * 0.60 * s + uy * sw * stride * 0.22;
        const footx = hipx + vx * reach * lift * s + ux * sw * stride * 0.55;
        const footy = hipy + vy * reach * lift * s + uy * sw * stride * 0.55;
        ctx.moveTo(hipx, hipy);
        ctx.quadraticCurveTo(kneex, kneey, footx, footy);
        if (!isBug) feet.push(footx, footy, w * 0.32);
      }
    }
    ctx.lineWidth = lw;
    ctx.stroke();
    if (feet.length) {
      ctx.fillStyle = `hsla(${hue},${sat * 0.7}%,${lig * 0.6}%,${0.9 * f})`;
      ctx.beginPath();
      for (let i = 0; i < feet.length; i += 3) {
        ctx.moveTo(feet[i] + feet[i + 2], feet[i + 1]);
        ctx.arc(feet[i], feet[i + 1], feet[i + 2], 0, TAU);
      }
      ctx.fill();
    }
  }

  // --- wings (under the body, so the torso always reads on top) -----
  if (A.wings === 2) {                       // insect: four translucent panels
    const flap = Math.abs(Math.sin(c.gait * 3.2));
    const span = R * 3.8, chord = R * 0.85;
    ctx.fillStyle = `rgba(228,242,255,${0.22 * f})`;
    for (let r0 = 0; r0 < 2; r0++) {
      const j = js[Math.min(1 + r0, n - 1)];
      for (let s = -1; s <= 1; s += 2) {
        const ext = 0.4 + 0.6 * flap;
        const a = Math.atan2(py * s, px * s);
        ctx.beginPath();
        ctx.ellipse(j.x + Math.cos(a) * span * 0.5 * ext, j.y + Math.sin(a) * span * 0.5 * ext,
                    span * 0.5 * ext, chord, a, 0, TAU);
        ctx.fill();
      }
    }
  } else if (A.wings === 1) {                // bird: swept, curved planform
    const flap = Math.sin(c.gait * 1.5);
    const ext = 0.66 + 0.34 * Math.abs(flap);
    const span = R * 5.0 * ext;
    const j = js[0];
    const shx = j.x - fx * R * 0.35, shy = j.y - fy * R * 0.35;
    ctx.fillStyle = `hsla(${hue},${sat * 0.9}%,${lig * (0.62 + 0.30 * Math.max(0, flap))}%,${0.96 * f})`;
    for (let s = -1; s <= 1; s += 2) {
      const tipx = shx + px * span * s - fx * span * 0.20;
      const tipy = shy + py * span * s - fy * span * 0.20;
      ctx.beginPath();
      ctx.moveTo(shx + fx * R * 0.9, shy + fy * R * 0.9);
      ctx.quadraticCurveTo(shx + px * span * 0.55 * s + fx * R * 0.9,
                           shy + py * span * 0.55 * s + fy * R * 0.9, tipx, tipy);
      ctx.quadraticCurveTo(shx + px * span * 0.42 * s - fx * R * 1.6,
                           shy + py * span * 0.42 * s - fy * R * 1.6,
                           shx - fx * R * 1.5, shy - fy * R * 1.5);
      ctx.closePath();
      ctx.fill();
    }
    // pale back and a small head, so the bird reads as a body between wings
    ctx.fillStyle = `hsla(${hue},${sat}%,${Math.min(70, lig * 1.7)}%,${0.9 * f})`;
    ctx.beginPath();
    ctx.ellipse(j.x - fx * R * 0.6, j.y - fy * R * 0.6, R * 1.5, R * 0.62, ang, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(j.x + fx * R * 0.9, j.y + fy * R * 0.9, R * 0.5, 0, TAU);
    ctx.fill();
  }

  // --- fins ---------------------------------------------------------
  if (A.fins) {
    ctx.fillStyle = `hsla(${hue},${sat}%,${lig * 1.15}%,${0.42 * f})`;
    const i0 = Math.min(2, n - 1), j0 = js[i0];
    const w = R * bodyProfile(i0 / (n - 1), c);
    const flap = Math.sin(c.gait * 1.5) * 0.3;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(j0.x, j0.y);
      ctx.quadraticCurveTo(
        j0.x + px * w * 3.0 * s - fx * R * 0.4, j0.y + py * w * 3.0 * s - fy * R * 0.4,
        j0.x + px * w * 1.3 * s - fx * R * (2.0 + flap), j0.y + py * w * 1.3 * s - fy * R * (2.0 + flap));
      ctx.closePath();
      ctx.fill();
    }
  }

  // --- body ---------------------------------------------------------
  // an oversized dark silhouette first: it becomes the outline once the
  // body is laid on top, which keeps creatures legible in fog, rain or dusk
  const outline = A.fur ? 1.22 : 1.16;
  if (R > 1.6) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const r = R * bodyProfile(i / (n - 1), c) * outline;
    if (r < 0.3) continue;
    ctx.moveTo(js[i].x + r, js[i].y);
    ctx.arc(js[i].x, js[i].y, r, 0, TAU);
  }
  ctx.fillStyle = A.fur
    ? `hsla(${hue},${sat * 0.6}%,${lig * 0.55}%,${0.46 * f})`
    : `rgba(10,15,20,${0.42 * f})`;
  ctx.fill();
  }

  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const r = R * bodyProfile(i / (n - 1), c);
    if (r < 0.25) continue;
    ctx.moveTo(js[i].x + r, js[i].y);
    ctx.arc(js[i].x, js[i].y, r, 0, TAU);
  }
  ctx.fillStyle = `hsla(${hue},${sat}%,${lig}%,${0.94 * f})`;
  ctx.fill();

  // dorsal highlight — reads as a spine from above
  if (R > 2.2) {
    ctx.strokeStyle = `hsla(${hue},${sat * 0.9}%,${Math.min(88, lig * 1.65)}%,${0.20 * f})`;
    ctx.lineWidth = Math.max(0.5, R * 0.22);
    ctx.beginPath();
    ctx.moveTo(js[0].x, js[0].y);
    for (let i = 1; i < n - 1; i++) {
      ctx.quadraticCurveTo(js[i].x, js[i].y, (js[i].x + js[i + 1].x) / 2, (js[i].y + js[i + 1].y) / 2);
    }
    ctx.stroke();
  }

  // segment banding
  if (A.seg > 0.3 && R > 1.8) {
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig * 0.55}%,${0.4 * A.seg * f})`;
    ctx.lineWidth = Math.max(0.4, R * 0.12);
    ctx.beginPath();
    for (let i = 1; i < n - 1; i++) {
      const r = R * bodyProfile(i / (n - 1), c);
      const dx = js[i].x - js[i + 1].x, dy = js[i].y - js[i + 1].y;
      const d = Math.hypot(dx, dy) || 1;
      ctx.moveTo(js[i].x - dy / d * r, js[i].y + dx / d * r);
      ctx.lineTo(js[i].x + dy / d * r, js[i].y - dx / d * r);
    }
    ctx.stroke();
  }

  // --- tail fin -----------------------------------------------------
  if (A.tail > 0.6 && A.habitat === 'water') {
    const a = js[n - 1], b = js[n - 2];
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d, vx = -uy, vy = ux;
    const s = R * 2.4;
    ctx.fillStyle = `hsla(${hue},${sat}%,${lig * 1.1}%,${0.55 * f})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + ux * s + vx * s * 0.8, a.y + uy * s + vy * s * 0.8);
    ctx.lineTo(a.x + ux * s * 0.45, a.y + uy * s * 0.45);
    ctx.lineTo(a.x + ux * s - vx * s * 0.8, a.y + uy * s - vy * s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  // --- cilia (early life) -------------------------------------------
  if (A.cilia && R > 1.6) {
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig * 1.4}%,${0.30 * f})`;
    ctx.lineWidth = Math.max(0.4, R * 0.10);
    ctx.beginPath();
    const j = js[0];
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * TAU + c.gait * 0.5;
      const w = R * bodyProfile(0, c);
      const q = 1 + Math.sin(c.gait * 2 + k) * 0.3;
      ctx.moveTo(j.x + Math.cos(a) * w, j.y + Math.sin(a) * w);
      ctx.lineTo(j.x + Math.cos(a) * w * (1.55 * q), j.y + Math.sin(a) * w * (1.55 * q));
    }
    ctx.stroke();
  }

  // --- eyes ---------------------------------------------------------
  if (A.eyes === 2 && R > 1.9) {
    const j = js[0];
    const w = R * bodyProfile(0.06, c) * 0.62;
    ctx.fillStyle = `rgba(12,14,18,${0.85 * f})`;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(j.x + px * w * s + fx * R * 0.25, j.y + py * w * s + fy * R * 0.25, Math.max(0.5, R * 0.19), 0, TAU);
      ctx.fill();
    }
    if (night > 0.35 && R > 2.6) {
      ctx.fillStyle = `rgba(255,238,190,${0.5 * night * f})`;
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.arc(j.x + px * w * s + fx * R * 0.25, j.y + py * w * s + fy * R * 0.25, Math.max(0.3, R * 0.09), 0, TAU);
        ctx.fill();
      }
    }
  }
}

/* ================================================================== *
 *  MAIN LOOP
 * ================================================================== */
let clock = 0;          // wall-clock seconds since start (drives weather)
let loopT = 0;          // 0..1 position in the evolutionary cycle
let paused = false;
let last = performance.now();
// adaptive load: thin the population out on machines that cannot keep up
let smoothDt = 1 / 60, quality = 1;
let vignette = null;
const tint = [0, 0, 0];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H) / 900;
  MAXPOP = clamp(Math.round(Math.sqrt(W * H) / 10), 50, 145);

  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.42)');

  rnd = mulberry32(20260809);
  buildField();
  buildMat();
  buildClouds();
  buildParticles();
  creatures.length = 0;
}

function frame(now) {
  requestAnimationFrame(frame);   // scheduled first: a hiccup can never stall the loop
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  if (paused) dt = 0;

  clock += dt;
  loopT = (loopT + dt / LOOP) % 1;

  if (dt > 0) {
    smoothDt += (dt - smoothDt) * 0.05;
    if (smoothDt > 0.026) quality = Math.max(0.35, quality - dt * 0.3);
    else if (smoothDt < 0.019) quality = Math.min(1, quality + dt * 0.08);
  }

  const p = params(loopT);

  // --- sky ----------------------------------------------------------
  const sunA = loopT * DAY_CYCLES * TAU + Math.PI * 0.4;
  const sunEl = Math.sin(sunA);
  const az = sunA * 0.65 + 1.2;
  const shLen = clamp(2.6 / (0.30 + Math.max(0, sunEl) * 3.2), 0.6, 7) * U * 1.4;
  const shX = -Math.cos(az) * shLen, shY = -Math.sin(az) * shLen;
  const night = smoothstep(0.10, -0.28, sunEl);

  updateWeather(dt, p);

  // --- world state --------------------------------------------------
  if (Math.abs(p.sea - bakedSea) > 0.0035 || Math.abs(p.green - bakedGreen) > 0.022) {
    bakeTerrain(p.sea, p.green);
  }
  matAcc += dt;
  if (matAcc >= MAT_STEP) { matAcc = 0; stepMat(); }

  updateCreatures(dt, p);

  /* ---------------- draw ---------------- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;

  // terrain
  ctx.drawImage(terrainCv, 0, 0, W, H);

  // microbial mat
  const matA = clamp(p.mat, 0, 1) * 0.85;
  if (matA > 0.01) {
    ctx.globalAlpha = matA;
    ctx.drawImage(matCv, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // water shimmer (only where there is water)
  if (sunEl > -0.1) {
    const sa = clamp(sunEl, 0, 1) * (1 - weather.cloud * 0.8);
    if (sa > 0.02) {
      ctx.strokeStyle = `rgba(226,244,255,${0.16 * sa})`;
      ctx.lineWidth = 1.1 * U * 1.6;
      ctx.beginPath();
      for (const s of shimmer) {
        s.p += dt * (0.6 + s.l);
        s.x += Math.cos(s.p * 0.4) * dt * 6;
        if (s.x > W) s.x -= W; else if (s.x < 0) s.x += W;
        if (hAt(s.x, s.y) - p.sea > -0.01) { s.x = rand(W); s.y = rand(H); continue; }
        const w = (6 + s.l * 16) * U * (0.5 + 0.5 * Math.sin(s.p));
        ctx.moveTo(s.x - w, s.y);
        ctx.lineTo(s.x + w, s.y);
      }
      ctx.stroke();
    }
  }

  // creatures
  for (const c of creatures) drawCreature(c, night, sunEl, shX, shY);

  // cloud shadows
  if (weather.cloud > 0.02) {
    ctx.globalCompositeOperation = 'multiply';
    for (const cl of clouds) {
      cl.x += weather.windX * cl.s * 26 * dt * U * 3;
      cl.y += weather.windY * cl.s * 26 * dt * U * 3;
      if (cl.x - cl.r > W) cl.x = -cl.r; else if (cl.x + cl.r < 0) cl.x = W + cl.r;
      if (cl.y - cl.r > H) cl.y = -cl.r; else if (cl.y + cl.r < 0) cl.y = H + cl.r;
      const a = weather.cloud * 0.34 * (0.5 + 0.5 * Math.sin(clock * 0.3 + cl.s * 9));
      const g = ctx.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
      const v = Math.round(255 - a * 150);
      g.addColorStop(0, `rgb(${v},${v},${Math.min(255, v + 8)})`);
      g.addColorStop(1, 'rgb(255,255,255)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // daylight tint
  sunTint(sunEl, tint);
  const dim = 1 - weather.cloud * 0.15 - weather.fog * 0.06;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${Math.round(tint[0] * dim)},${Math.round(tint[1] * dim)},${Math.round(tint[2] * dim)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // bioluminescence at night — strongest in the early oceans
  if (night > 0.06) {
    ctx.globalCompositeOperation = 'lighter';
    for (const c of creatures) {
      const g = c.A.glow * night * c.fade;
      if (g < 0.05) continue;
      const j = c.joints[0];
      const r = c.r * 5.5;
      ctx.globalAlpha = Math.min(1, 0.42 * g);
      ctx.drawImage(glowSprites[((c.hue / 30) | 0) % 12], j.x - r, j.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    // the mat glows too
    if (p.mat > 0.3) {
      ctx.globalAlpha = night * p.mat * 0.22;
      ctx.drawImage(matCv, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // rain
  if (weather.wet > 0.02) {
    const a = weather.wet;
    ctx.strokeStyle = `rgba(186,208,236,${0.30 * a})`;
    ctx.lineWidth = Math.max(0.6, 1.0 * U * 1.4);
    ctx.beginPath();
    const vx = weather.windX * 160 * U, vy = 520 * U;
    for (const d of drops) {
      d.y += (vy * d.v) * dt;
      d.x += (vx * d.v) * dt;
      if (d.y > H) { d.y -= H; d.x = rand(W); }
      if (d.x > W) d.x -= W; else if (d.x < 0) d.x += W;
      const L = 16 * U * d.l * d.v;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - vx / vy * L, d.y - L);
    }
    ctx.stroke();
  }

  // snow
  if (weather.snow > 0.02) {
    const a = weather.snow;
    ctx.fillStyle = `rgba(244,250,255,${0.72 * a})`;
    for (const fl of flakes) {
      fl.p += dt * 1.7;
      fl.y += 46 * U * fl.v * dt;
      fl.x += (Math.sin(fl.p) * 22 + weather.windX * 60) * U * dt;
      if (fl.y > H) { fl.y -= H; fl.x = rand(W); }
      if (fl.x > W) fl.x -= W; else if (fl.x < 0) fl.x += W;
      ctx.beginPath(); ctx.arc(fl.x, fl.y, fl.r * U * 1.6, 0, TAU); ctx.fill();
    }
  }

  // fog / haze
  if (weather.fog > 0.02) {
    const a = weather.fog;
    const g = ctx.createLinearGradient(0, 0, W * 0.35, H);
    g.addColorStop(0, `rgba(198,210,224,${0.30 * a})`);
    g.addColorStop(0.5, `rgba(206,216,228,${0.44 * a})`);
    g.addColorStop(1, `rgba(190,204,220,${0.28 * a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // lightning
  if (weather.flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(190,206,255,${0.40 * weather.flash})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // vignette
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  updateHUD(p);
}

/* ================================================================== *
 *  HUD
 * ================================================================== */
const elEra = document.getElementById('era');
const elSub = document.getElementById('sub');
const elClock = document.getElementById('clock');
const elWx = document.getElementById('weather');
const elFill = document.getElementById('fill');
const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
let lastEra = -1, hudAcc = 0;

const fmt = new Intl.NumberFormat('en-US');
function updateHUD(p) {
  elFill.style.width = (loopT * 100).toFixed(2) + '%';
  hudAcc += 1;
  if (hudAcc % 6) return;
  if (p.idx !== lastEra) {
    lastEra = p.idx;
    elEra.textContent = p.era.name;
    elSub.textContent = '— ' + p.era.sub;
  }
  const my = Math.max(0, Math.round(p.mya));
  elClock.textContent = my >= 1 ? fmt.format(my) + ' million years ago' : 'the present';
  elWx.textContent = '· ' + weather.kind;
}

(function ticks() {
  const box = document.getElementById('ticks');
  for (const e of ERAS) {
    if (e.at <= 0 || e.at >= 1) continue;
    const i = document.createElement('i');
    i.style.left = (e.at * 100) + '%';
    box.appendChild(i);
  }
})();

/* ================================================================== *
 *  INPUT
 * ================================================================== */
window.addEventListener('resize', () => { resize(); });
document.addEventListener('click', () => { hud.classList.toggle('off'); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.key === 'h' || e.key === 'H') hud.classList.toggle('off');
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });
setTimeout(() => hint.classList.add('off'), 5200);

resize();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
