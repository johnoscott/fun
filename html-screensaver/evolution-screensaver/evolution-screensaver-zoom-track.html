<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Billion Years — a life screensaver</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070d; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    cursor: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 22px 16px 22px;
    color: rgba(232,238,248,0.86);
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.75);
    transition: opacity 480ms ease;
    -webkit-font-smoothing: antialiased;
  }
  #hud.off { opacity: 0; }
  #bar {
    position: relative; height: 2px; width: 100%;
    background: rgba(255,255,255,0.13); border-radius: 2px; margin-bottom: 11px;
  }
  #fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(255,255,255,0.68); border-radius: 2px;
  }
  #ticks { position: absolute; left: 0; right: 0; top: -3px; height: 8px; }
  #ticks i {
    position: absolute; top: 0; width: 1px; height: 8px;
    background: rgba(255,255,255,0.28);
  }
  #row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  #era { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
  #sub { font-size: 11px; letter-spacing: 0.05em; opacity: 0.6; }
  #clock { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; text-align: right; }
  #weather { font-size: 11px; letter-spacing: 0.08em; opacity: 0.5; }
  #hint {
    position: fixed; top: 18px; right: 22px; font-size: 10px; letter-spacing: 0.12em;
    color: rgba(232,238,248,0.35); pointer-events: none; text-transform: uppercase;
    transition: opacity 900ms ease;
  }
  #hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <div id="bar"><div id="fill"></div><div id="ticks"></div></div>
  <div id="row">
    <span id="era">Hadean Ocean</span>
    <span id="sub"></span>
    <span id="weather"></span>
    <span id="clock"></span>
  </div>
</div>
<div id="hint">click: hud &nbsp;·&nbsp; space: pause &nbsp;·&nbsp; t: track now</div>
<script>
"use strict";
/* ------------------------------------------------------------------ *
 *  FOUR BILLION YEARS
 *  A six-minute seamless loop: cellular-automaton life blooms into
 *  progressively more complex creatures, seen from directly above,
 *  under a rotating day/night sky and a drifting weather system.
 *  Periodically the camera picks one individual out of the crowd,
 *  descends to it, and follows it until it dies or the survey moves on.
 * ------------------------------------------------------------------ */

const LOOP        = 360;   // seconds per full evolutionary cycle
const DAY_CYCLES  = 12;    // whole day/nights per loop (integer => seamless)
const TAU         = Math.PI * 2;

const cv  = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, U = 1;   // W,H are both the viewport AND the world; U = size unit

/* ================================================================== *
 *  NOISE
 * ================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(20260809);
const rand  = (a = 1, b = 0) => b + (a - b) * rnd();
const pick  = (arr) => arr[(rnd() * arr.length) | 0];

const NP = new Uint8Array(512);
function buildPerm(seed) {
  const r = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) NP[i] = p[i & 255];
}
buildPerm(7717);

const fade = (t) => t * t * (3 - 2 * t);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const X = xi & 255, Y = yi & 255;
  const aa = NP[NP[X] + Y], ba = NP[NP[X + 1] + Y];
  const ab = NP[NP[X] + Y + 1], bb = NP[NP[X + 1] + Y + 1];
  const u = fade(xf), v = fade(yf);
  const top = aa + (ba - aa) * u, bot = ab + (bb - ab) * u;
  return (top + (bot - top) * v) / 255;
}
function fbm(x, y, oct, gain) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += vnoise(x * f, y * f) * amp;
    norm += amp; amp *= (gain || 0.5); f *= 2.03;
  }
  return s / norm;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut  = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* the world is a torus of size W x H — this finds the nearest image */
function nearestOff(x, cx, span) { return -Math.round((x - cx) / span) * span; }

/* ================================================================== *
 *  TIMELINE — keyframed world parameters.
 *  The final keyframe equals the first so the whole loop is seamless.
 * ================================================================== */
const ERAS = [
  { at: 0.000, name: 'Hadean Ocean',     sub: 'chemistry learns to copy itself', mya: 4000,
    sea: 0.640, green: 0.00, mat: 0.35, pop: 0.00, kinds: ['spark'] },
  { at: 0.075, name: 'First Cells',      sub: 'a membrane, an inside and an outside', mya: 3500,
    sea: 0.628, green: 0.00, mat: 0.85, pop: 0.35, kinds: ['spark', 'blob'] },
  { at: 0.170, name: 'Great Oxidation',  sub: 'cyanobacteria rust the world', mya: 2400,
    sea: 0.610, green: 0.05, mat: 1.00, pop: 0.55, kinds: ['blob'] },
  { at: 0.280, name: 'First Colonies',   sub: 'cells discover each other', mya: 1200,
    sea: 0.580, green: 0.10, mat: 0.85, pop: 0.75, kinds: ['blob', 'chain'] },
  { at: 0.380, name: 'Ediacaran Calm',   sub: 'soft bodies drift the shallows', mya: 600,
    sea: 0.545, green: 0.18, mat: 0.70, pop: 0.90, kinds: ['chain', 'colony'] },
  { at: 0.460, name: 'Cambrian Bloom',   sub: 'segments, shells, and the first eyes', mya: 520,
    sea: 0.520, green: 0.26, mat: 0.55, pop: 1.00, kinds: ['worm', 'trilobite'] },
  { at: 0.560, name: 'Age of Fishes',    sub: 'a spine, and a reason to swim fast', mya: 400,
    sea: 0.492, green: 0.42, mat: 0.45, pop: 1.00, kinds: ['fish', 'trilobite', 'worm'] },
  { at: 0.650, name: 'Coal Forests',     sub: 'life crawls out and grows wings', mya: 320,
    sea: 0.455, green: 0.80, mat: 0.36, pop: 1.00, kinds: ['amphib', 'insect', 'fish'] },
  { at: 0.740, name: 'Age of Reptiles',  sub: 'scales inherit the dry land', mya: 230,
    sea: 0.424, green: 0.72, mat: 0.30, pop: 0.95, kinds: ['reptile', 'insect', 'fish'] },
  { at: 0.830, name: 'Dinosaur Dominion',sub: 'the largest things ever to walk', mya: 110,
    sea: 0.398, green: 0.88, mat: 0.26, pop: 0.80, kinds: ['dino', 'reptile', 'bird'] },
  { at: 0.915, name: 'Mammals & Birds',  sub: 'warm blood, long memory', mya: 40,
    sea: 0.418, green: 0.92, mat: 0.24, pop: 0.95, kinds: ['mammal', 'bird', 'insect'] },
  { at: 0.965, name: 'The Long Winter',  sub: 'ice, then ocean, then quiet', mya: 2,
    sea: 0.520, green: 0.45, mat: 0.30, pop: 0.45, kinds: ['mammal', 'bird'] },
  { at: 1.000, name: 'Hadean Ocean',     sub: 'chemistry learns to copy itself', mya: 4000,
    sea: 0.640, green: 0.00, mat: 0.35, pop: 0.00, kinds: ['spark'] },
];

function eraIndexAt(t) {
  let i = 0;
  for (let k = 0; k < ERAS.length - 1; k++) if (t >= ERAS[k].at) i = k;
  return i;
}
function params(t) {
  const i = eraIndexAt(t);
  const a = ERAS[i], b = ERAS[i + 1] || ERAS[ERAS.length - 1];
  const span = Math.max(1e-6, b.at - a.at);
  const k = smoothstep(0, 1, clamp((t - a.at) / span, 0, 1));
  return {
    idx: i, k, era: a, next: b,
    sea:   lerp(a.sea,   b.sea,   k),
    green: lerp(a.green, b.green, k),
    mat:   lerp(a.mat,   b.mat,   k),
    pop:   lerp(a.pop,   b.pop,   k),
    mya:   lerp(a.mya,   b.mya,   k),
  };
}

/* ================================================================== *
 *  TERRAIN
 * ================================================================== */
let TW = 0, TH = 0;
const TSCALE = 3;
let height = null, moist = null, detail = null;
let terrainCv = null, terrainCtx = null, terrainImg = null;
let habitat = null;
let bakedSea = -99, bakedGreen = -99;

function buildField() {
  TW = Math.max(8, Math.ceil(W / TSCALE));
  TH = Math.max(8, Math.ceil(H / TSCALE));
  height = new Float32Array(TW * TH);
  moist  = new Float32Array(TW * TH);
  detail = new Float32Array(TW * TH);

  const s = 2.6 / Math.max(TW, TH);
  for (let y = 0; y < TH; y++) {
    for (let x = 0; x < TW; x++) {
      const nx = x * s, ny = y * s;
      const wx = fbm(nx * 1.7 + 11.3, ny * 1.7 + 4.1, 3, 0.5) - 0.5;
      const wy = fbm(nx * 1.7 - 8.7,  ny * 1.7 - 2.9, 3, 0.5) - 0.5;
      let h = fbm(nx + wx * 0.85, ny + wy * 0.85, 6, 0.52);
      const cont = fbm(nx * 0.42 + 31.7, ny * 0.42 + 19.4, 3, 0.55);
      h = h * 0.62 + cont * 0.38;
      const ridge = 1 - Math.abs(fbm(nx * 3.1 + 5.5, ny * 3.1 + 9.2, 4, 0.5) * 2 - 1);
      h += ridge * 0.09 * smoothstep(0.5, 0.72, h);
      height[y * TW + x] = h;
      moist[y * TW + x]  = fbm(nx * 1.35 + 61.1, ny * 1.35 + 47.7, 4, 0.5);
      detail[y * TW + x] = vnoise(x * 0.62 + 3.3, y * 0.62 + 7.7);
    }
  }
  terrainCv = document.createElement('canvas');
  terrainCv.width = TW; terrainCv.height = TH;
  terrainCtx = terrainCv.getContext('2d');
  terrainImg = terrainCtx.createImageData(TW, TH);
  bakedSea = -99; bakedGreen = -99;
}

// bilinear, and toroidal, so close-up habitat tests don't step
function hAt(px, py) {
  const fx = px / TSCALE, fy = py / TSCALE;
  let x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx - x0, ty = fy - y0;
  x0 = ((x0 % TW) + TW) % TW; y0 = ((y0 % TH) + TH) % TH;
  const x1 = (x0 + 1) % TW, y1 = (y0 + 1) % TH;
  const a = height[y0 * TW + x0], b = height[y0 * TW + x1];
  const c = height[y1 * TW + x0], d = height[y1 * TW + x1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
}

const COL = {
  abyss:   [7, 14, 30],
  deep:    [13, 36, 68],
  ocean:   [22, 68, 106],
  shelf:   [38, 106, 132],
  shallow: [70, 148, 158],
  sand:    [196, 180, 142],
  lowBare: [124, 106, 90],  lowGreen: [92, 130, 66],
  midBare: [104, 90, 78],   midGreen: [56, 100, 52],
  hiBare:  [116, 108, 102], hiGreen:  [78, 92, 64],
  rock:    [128, 124, 122],
  snow:    [226, 230, 238],
};
function ramp(c0, c1, t, out) {
  out[0] = c0[0] + (c1[0] - c0[0]) * t;
  out[1] = c0[1] + (c1[1] - c0[1]) * t;
  out[2] = c0[2] + (c1[2] - c0[2]) * t;
}

function bakeTerrain(sea, green) {
  const d = terrainImg.data;
  const c = [0, 0, 0];
  const LX = -0.72, LY = -0.69;   // fixed bake-light so relief reads at any hour
  for (let y = 0; y < TH; y++) {
    for (let x = 0; x < TW; x++) {
      const i = y * TW + x;
      const h = height[i], m = moist[i], dt = detail[i];
      const e = h - sea;
      if (e < 0) {
        const dep = -e;
        if (dep > 0.17)       ramp(COL.deep, COL.abyss, smoothstep(0.17, 0.34, dep), c);
        else if (dep > 0.055) ramp(COL.ocean, COL.deep, smoothstep(0.055, 0.17, dep), c);
        else if (dep > 0.016) ramp(COL.shelf, COL.ocean, smoothstep(0.016, 0.055, dep), c);
        else                  ramp(COL.shallow, COL.shelf, smoothstep(0, 0.016, dep), c);
        const sw = (dt - 0.5) * 12 * smoothstep(0.22, 0.0, dep);
        c[0] += sw; c[1] += sw * 1.15; c[2] += sw * 1.2;
        const foam = smoothstep(0.012, 0.0, dep) * (0.45 + dt * 0.55);
        c[0] += foam * 78; c[1] += foam * 92; c[2] += foam * 96;
      } else {
        const g = clamp(green * (0.45 + m * 0.85), 0, 1);
        if (e < 0.012) {
          ramp(COL.shallow, COL.sand, smoothstep(0, 0.012, e), c);
        } else if (e < 0.06) {
          ramp(COL.lowBare, COL.lowGreen, g, c);
          const t2 = smoothstep(0.012, 0.06, e);
          c[0] = lerp(COL.sand[0], c[0], t2);
          c[1] = lerp(COL.sand[1], c[1], t2);
          c[2] = lerp(COL.sand[2], c[2], t2);
        } else if (e < 0.15) {
          const bare = [0, 0, 0], grn = [0, 0, 0], t2 = smoothstep(0.06, 0.15, e);
          ramp(COL.lowBare, COL.midBare, t2, bare);
          ramp(COL.lowGreen, COL.midGreen, t2, grn);
          ramp(bare, grn, g, c);
          if (g > 0.42 && dt > 0.60) { const f = (dt - 0.60) * 2.2 * g; c[0] -= 26 * f; c[1] -= 14 * f; c[2] -= 20 * f; }
        } else if (e < 0.235) {
          ramp(COL.hiBare, COL.hiGreen, g * 0.7, c);
          ramp(c, COL.rock, smoothstep(0.15, 0.235, e) * 0.75, c);
        } else {
          ramp(COL.rock, COL.snow, smoothstep(0.245, 0.30, e), c);
        }
        // young hot world: lava seeping through the bare crust
        const heat = (1 - clamp(green * 2.4, 0, 1)) * smoothstep(0.62, 0.80, m) * smoothstep(0.02, 0.09, e);
        if (heat > 0.001) {
          const f = heat * (0.35 + dt * 0.9);
          c[0] += 150 * f; c[1] += 42 * f; c[2] += 10 * f;
        }
        const xl = x > 0 ? i - 1 : i, xr = x < TW - 1 ? i + 1 : i;
        const yu = y > 0 ? i - TW : i, yd = y < TH - 1 ? i + TW : i;
        const gx = (height[xr] - height[xl]) * 22, gy = (height[yd] - height[yu]) * 22;
        const sh = clamp(1 + (gx * LX + gy * LY) * 1.9, 0.55, 1.55);
        c[0] *= sh; c[1] *= sh; c[2] *= sh;
      }
      const o = i * 4;
      d[o]     = c[0] < 0 ? 0 : c[0] > 255 ? 255 : c[0];
      d[o + 1] = c[1] < 0 ? 0 : c[1] > 255 ? 255 : c[1];
      d[o + 2] = c[2] < 0 ? 0 : c[2] > 255 ? 255 : c[2];
      d[o + 3] = 255;
    }
  }
  terrainCtx.putImageData(terrainImg, 0, 0);
  bakedSea = sea; bakedGreen = green;
  refreshHabitat(sea, green);
}

/* ================================================================== *
 *  THE MAT — a Conway automaton standing in for microbial life
 * ================================================================== */
let GW = 0, GH = 0, cur = null, nxt = null, age = null;
let matCv = null, matCtx = null, matImg = null;
let matAcc = 0;
const MAT_STEP = 0.085;

function buildMat() {
  GW = clamp(Math.round(W / 6), 60, 300);
  GH = Math.max(40, Math.round(GW * H / W));
  cur = new Uint8Array(GW * GH);
  nxt = new Uint8Array(GW * GH);
  age = new Uint8Array(GW * GH);
  habitat = new Uint8Array(GW * GH);
  matCv = document.createElement('canvas');
  matCv.width = GW; matCv.height = GH;
  matCtx = matCv.getContext('2d');
  matImg = matCtx.createImageData(GW, GH);
  for (let i = 0; i < cur.length; i++) cur[i] = rnd() < 0.22 ? 1 : 0;
}

function refreshHabitat(sea, green) {
  if (!habitat) return;
  for (let y = 0; y < GH; y++) {
    const py = (y + 0.5) * H / GH;
    for (let x = 0; x < GW; x++) {
      const px = (x + 0.5) * W / GW;
      const e = hAt(px, py) - sea;
      let hb = 0;
      if (e < 0 && e > -0.14) hb = 1;                        // sunlit shallows
      else if (e > 0.002 && e < 0.22 && green > 0.12) hb = 2; // damp land
      habitat[y * GW + x] = hb;
    }
  }
}

function stepMat() {
  for (let y = 0; y < GH; y++) {
    const ym = ((y - 1 + GH) % GH) * GW, yp = ((y + 1) % GH) * GW, y0 = y * GW;
    for (let x = 0; x < GW; x++) {
      const i = y0 + x;
      if (!habitat[i]) { nxt[i] = 0; age[i] = 0; continue; }
      const xm = (x - 1 + GW) % GW, xp = (x + 1) % GW;
      const n = cur[ym + xm] + cur[ym + x] + cur[ym + xp] +
                cur[y0 + xm] +               cur[y0 + xp] +
                cur[yp + xm] + cur[yp + x] + cur[yp + xp];
      let live = cur[i] ? (n === 2 || n === 3) : (n === 3);
      if (!live && rnd() < 0.0016) live = true;   // a trickle of spontaneous generation
      nxt[i] = live ? 1 : 0;
      age[i] = live ? Math.min(255, age[i] + 12) : 0;
    }
  }
  const t = cur; cur = nxt; nxt = t;

  const d = matImg.data;
  for (let i = 0; i < cur.length; i++) {
    const o = i * 4;
    if (!cur[i]) { d[o + 3] = 0; continue; }
    const a = age[i] / 255;
    if (habitat[i] === 1) {
      d[o] = 40 + a * 60; d[o + 1] = 190 + a * 30; d[o + 2] = 170 - a * 70;
    } else {
      d[o] = 96 + a * 40; d[o + 1] = 180 + a * 40; d[o + 2] = 70 + a * 20;
    }
    d[o + 3] = 130 + a * 105;
  }
  matCtx.putImageData(matImg, 0, 0);
}

/* ================================================================== *
 *  SKY, WEATHER
 * ================================================================== */
const SUN_STOPS = [
  [-1.00, [22, 30, 62]],
  [-0.30, [40, 48, 92]],
  [-0.08, [104, 84, 108]],
  [ 0.05, [232, 152, 104]],
  [ 0.18, [255, 206, 158]],
  [ 0.42, [255, 248, 236]],
  [ 1.00, [255, 255, 255]],
];
function sunTint(e, out) {
  for (let i = 0; i < SUN_STOPS.length - 1; i++) {
    const a = SUN_STOPS[i], b = SUN_STOPS[i + 1];
    if (e <= b[0] || i === SUN_STOPS.length - 2) {
      const t = clamp((e - a[0]) / (b[0] - a[0]), 0, 1);
      out[0] = lerp(a[1][0], b[1][0], t);
      out[1] = lerp(a[1][1], b[1][1], t);
      out[2] = lerp(a[1][2], b[1][2], t);
      return out;
    }
  }
  return out;
}

const WEATHERS = ['clear', 'clear', 'fair', 'fair', 'overcast', 'rain', 'rain', 'storm', 'fog', 'snow'];
const weather = {
  kind: 'fair', timer: 6, cloud: 0.3, wet: 0, fog: 0, snow: 0,
  windX: 0.4, windY: 0.12, flash: 0, flashTimer: 2.4,
};
function chooseWeather(p) {
  let k = pick(WEATHERS);
  if (k === 'snow' && p.green > 0.35 && p.sea < 0.5) k = 'rain';   // hothouse world: rain, not snow
  if (p.green < 0.06 && (k === 'fog' || k === 'snow')) k = 'overcast';
  return k;
}
function weatherTargets(k) {
  switch (k) {
    case 'clear':    return { cloud: 0.05, wet: 0,    fog: 0.00, snow: 0 };
    case 'fair':     return { cloud: 0.28, wet: 0,    fog: 0.02, snow: 0 };
    case 'overcast': return { cloud: 0.72, wet: 0,    fog: 0.10, snow: 0 };
    case 'rain':     return { cloud: 0.80, wet: 0.65, fog: 0.16, snow: 0 };
    case 'storm':    return { cloud: 0.95, wet: 1.00, fog: 0.20, snow: 0 };
    case 'fog':      return { cloud: 0.55, wet: 0.05, fog: 0.82, snow: 0 };
    case 'snow':     return { cloud: 0.78, wet: 0.10, fog: 0.28, snow: 1 };
  }
  return { cloud: 0.3, wet: 0, fog: 0, snow: 0 };
}
function updateWeather(dt, p) {
  weather.timer -= dt;
  if (weather.timer <= 0) { weather.kind = chooseWeather(p); weather.timer = rand(18, 8); }
  const T = weatherTargets(weather.kind);
  const r = 1 - Math.pow(0.06, dt);
  weather.cloud += (T.cloud - weather.cloud) * r;
  weather.wet   += (T.wet   - weather.wet)   * r;
  weather.fog   += (T.fog   - weather.fog)   * r;
  weather.snow  += (T.snow  - weather.snow)  * r;
  weather.windX += (Math.sin(clock * 0.19) * 0.9 + 0.25 - weather.windX) * dt * 0.5;
  weather.windY += (Math.cos(clock * 0.13) * 0.35 - weather.windY) * dt * 0.5;

  weather.flash *= Math.pow(0.012, dt);
  if (weather.kind === 'storm') {
    weather.flashTimer -= dt;
    if (weather.flashTimer <= 0) { weather.flash = rand(1, 0.5); weather.flashTimer = rand(3.4, 0.4); }
  }
}

const clouds = [];
function buildClouds() {
  clouds.length = 0;
  for (let i = 0; i < 16; i++) {
    clouds.push({ x: rand(W), y: rand(H), r: rand(0.42, 0.14) * Math.min(W, H), s: rand(1.5, 0.6) });
  }
}

const drops = [], flakes = [], shimmer = [], motes = [];
function buildParticles() {
  drops.length = 0; flakes.length = 0; shimmer.length = 0; motes.length = 0;
  for (let i = 0; i < 900; i++) drops.push({ x: rand(W), y: rand(H), v: rand(1.5, 0.85), l: rand(1.5, 0.7) });
  for (let i = 0; i < 420; i++) flakes.push({ x: rand(W), y: rand(H), v: rand(1.2, 0.5), p: rand(TAU), r: rand(1.9, 0.7) });
  for (let i = 0; i < 260; i++) shimmer.push({ x: rand(W), y: rand(H), p: rand(TAU), l: rand(1) });
  // suspended particulate — only visible up close, and it sells the change of scale
  for (let i = 0; i < 240; i++) motes.push({ x: rand(W), y: rand(H), r: rand(1.6, 0.35), p: rand(TAU), v: rand(1, 0.2) });
}

const NAME_STEMS = {

  blob:     ['Archaeo', 'Crypto', 'Cyano', 'Grypa'],
  chain:    ['Bangio', 'Nemato', 'Filo', 'Oscilla'],
  colony:   ['Charnia', 'Dickinso', 'Ediacar', 'Rangeo'],
  worm:     ['Halluci', 'Anomalo', 'Aysheai', 'Opabin'],
  trilobite:['Olene', 'Elrathi', 'Redlichi', 'Paradox'],
  fish:     ['Dunkleo', 'Cephalas', 'Bothrio', 'Eusthen'],
  amphib:   ['Ichthyo', 'Acantho', 'Eryo', 'Tiktaal'],
  insect:   ['Megan', 'Arthropleu', 'Palaeodicty', 'Mazothair'],
  reptile:  ['Dimetro', 'Hylono', 'Petrolaco', 'Prionosuch'],
  dino:     ['Tyranno', 'Bronto', 'Cerato', 'Stego', 'Allo'],
  mammal:   ['Eo', 'Palaeo', 'Meso', 'Sino', 'Ambulo'],
  bird:     ['Ichthy', 'Confucius', 'Hespero', 'Archae'],
};
const NAME_TAILS = {
  spark:    ['cystis', 'sphaera', 'monas'],
  blob:     ['sphaera', 'coccus', 'monas', 'phyton'],
  chain:    ['morpha', 'filum', 'thrix'],
  colony:   ['ia', 'morpha', 'formis'],
  worm:     ['genia', 'caris', 'pes'],
  trilobite:['ia', 'ops', 'llus'],
  fish:     ['steus', 'pis', 'don'],
  amphib:   ['stega', 'saurus', 'derma'],
  insect:   ['eura', 'ra', 'opterum'],
  reptile:  ['don', 'saurus', 'mus'],
  dino:     ['saurus', 'raptor', 'don', 'ceras'],
  mammal:   ['therium', 'hippus', 'conodon', 'don'],
  bird:     ['ornis', 'ptera', 'avis'],
};
const EPITHETS = ['magna', 'gracilis', 'borealis', 'abyssalis', 'vetusta', 'minor', 'robusta',
                  'pallida', 'nocturna', 'ferox', 'placida', 'aurorae', 'litoralis', 'profunda'];

const creatures = [];
let MAXPOP = 90;
let serial = 1000;

function habitatScore(kind, e) {   // e = elevation relative to sea level
  switch (kind) {
    case 'water': return e < -0.004 ? clamp(1 - Math.max(0, -e - 0.12) * 6, 0.1, 1) : -1;
    case 'land':  return e > 0.006 ? clamp(1 - Math.max(0, e - 0.16) * 6, 0.1, 1) : -1;
    case 'shore': return Math.abs(e) < 0.05 ? 1 - Math.abs(e) * 12 : -1;
    default:      return 1;        // 'air'
  }
}
const HABIT_WORD = { water: 'pelagic', land: 'terrestrial', shore: 'amphibious', air: 'aerial' };

function fmtLen(m) {
  if (m < 1e-3) return (m * 1e6).toFixed(m * 1e6 < 10 ? 1 : 0) + ' µm';
  if (m < 1)    return (m * 100).toFixed(m * 100 < 10 ? 1 : 0) + ' cm';
  return m.toFixed(m < 10 ? 2 : 1) + ' m';
}

function spawn(kindName, p) {
  const A = ARCH[kindName];
  if (!A) return;
  let x = 0, y = 0, ok = false;
  for (let tries = 0; tries < 26; tries++) {
    x = rand(W); y = rand(H);
    if (habitatScore(A.habitat, hAt(x, y) - p.sea) > 0) { ok = true; break; }
  }
  if (!ok) return;

  const sizeF = rnd();                                  // where it sits in its size range
  const scale = lerp(A.size[0], A.size[1], sizeF) * U;
  const c = {
    kind: kindName, A, x, y,
    ang: rand(TAU), turn: 0,
    speed: rand(A.speed[1], A.speed[0]) * U,
    base: 0, r: scale,
    gait: rand(TAU), wander: rand(TAU),
    hue: (A.hue[0] + (A.hue[1] - A.hue[0]) * rnd() + 360) % 360,
    sat: A.sat * rand(1.25, 0.75),
    lig: A.lig * rand(1.18, 0.85),
    fade: 0, dying: false,
    age: 0, life: rand(34, 12),
    limbPairs: A.limbs,
    joints: [], spacing: scale * 0.82,
    dash: 0, dashT: rand(4, 1),
    // dossier, fixed at birth
    id: ++serial,
    name: pick(NAME_STEMS[kindName]) + pick(NAME_TAILS[kindName]),
    epithet: pick(EPITHETS),
    metres: lerp(A.metres[0], A.metres[1], sizeF * sizeF),
    diet: kindName === 'dino' ? pick(['herbivore', 'browser', 'apex carnivore']) : A.diet,
  };
  c.base = c.speed;
  const n = A.joints + (A.tail > 0 ? Math.round(A.tail * 5) : 0);
  for (let i = 0; i < n; i++) c.joints.push({ x, y });
  creatures.push(c);
}

function bodyLength(c) {
  return c.spacing * Math.max(0, c.joints.length - 1) + c.r * 2;
}

function steer(c, dt, p) {
  const A = c.A;
  // habitat gradient: sample three headings and lean toward the best
  if (A.habitat !== 'air') {
    const look = c.r * 9 + 26 * U;
    let best = 0, bestS = -9;
    for (let k = -1; k <= 1; k++) {
      const a = c.ang + k * 0.7;
      const s = habitatScore(A.habitat, hAt(c.x + Math.cos(a) * look, c.y + Math.sin(a) * look) - p.sea)
              + (k === 0 ? 0.22 : 0);
      if (s > bestS) { bestS = s; best = k; }
    }
    // cornered: turn hard and keep turning the same way
    if (bestS <= 0) c.turn += (best === 0 ? (c.wander > Math.PI ? 1 : -1) : best) * dt * 9;
    else            c.turn += best * dt * 3.4;
  }
  c.wander = (c.wander + dt * rand(1.6, 0.4)) % TAU;
  c.turn += Math.sin(c.wander * 3.1) * dt * 1.6;

  if (A.flock) {
    let ax = 0, ay = 0, hx = 0, hy = 0, n = 0;
    for (let i = 0; i < creatures.length; i += 3) {
      const o = creatures[i];
      if (o === c || o.kind !== c.kind) continue;
      const dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
      if (d2 < 26000 * U * U && d2 > 1) {
        ax += dx; ay += dy; hx += Math.cos(o.ang); hy += Math.sin(o.ang); n++;
        if (d2 < 900 * U * U) { ax -= dx * 2.6; ay -= dy * 2.6; }
      }
    }
    if (n) {
      const want = Math.atan2(ay / n * 0.55 + hy, ax / n * 0.55 + hx);
      let df = want - c.ang;
      while (df > Math.PI) df -= TAU; while (df < -Math.PI) df += TAU;
      c.turn += df * dt * 2.4;
    }
  }

  c.dashT -= dt;
  if (c.dashT <= 0) { c.dash = rand(1.9, 0.9); c.dashT = rand(7, 2); }
  c.dash = Math.max(0, c.dash - dt * 1.1);

  c.turn *= Math.pow(0.02, dt);
  c.ang += c.turn * dt * 3.2;

  const spd = c.base * (1 + c.dash * 0.9) * (1 - weather.wet * 0.12);
  c.gait += dt * (4.2 + spd / (c.r * 2.2));
  const surge = (A.habitat === 'water' || A.habitat === 'air')
    ? 1 + Math.sin(c.gait) * 0.16
    : 1 + Math.sin(c.gait * 2) * 0.10;
  c.speed = spd * surge;

  c.x = ((c.x + Math.cos(c.ang) * c.speed * dt) % W + W) % W;
  c.y = ((c.y + Math.sin(c.ang) * c.speed * dt) % H + H) % H;

  // follow-the-leader spine, measured across the seam so it never snaps
  const js = c.joints;
  js[0].x = c.x; js[0].y = c.y;
  const sp = c.spacing * (1 - A.seg * 0.18);
  for (let i = 1; i < js.length; i++) {
    let dx = js[i].x - js[i - 1].x, dy = js[i].y - js[i - 1].y;
    if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
    if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
    const d = Math.hypot(dx, dy) || 1e-4;
    const k = sp / d;
    js[i].x = js[i - 1].x + dx * k;
    js[i].y = js[i - 1].y + dy * k;
  }
}

function creatureState(c) {
  if (c.dying) return 'expiring';
  if (c.dash > 0.55) return c.A.habitat === 'air' ? 'stooping' : 'burst swim';
  if (Math.abs(c.turn) > 1.2) return 'turning';
  if (c.A.diet === 'photosynthetic') return 'drifting';
  if (c.A.habitat === 'land') return 'foraging';
  return 'cruising';
}

function updateCreatures(dt, p) {
  const target = Math.round(MAXPOP * p.pop);
  const kinds = p.era.kinds;

  let alive = 0;
  for (const c of creatures) {
    c.age += dt;
    if (!c.dying) {
      if (kinds.indexOf(c.kind) < 0 && rnd() < dt * 0.5) c.dying = true;
      else if (c.age > c.life) c.dying = true;
      else alive++;
    }
  }
  if (alive < target) {
    const n = Math.min(3, target - alive);
    for (let i = 0; i < n; i++) spawn(pick(kinds), p);
  } else if (alive > target + 4) {
    for (const c of creatures) { if (!c.dying && c !== cam.subject) { c.dying = true; break; } }
  }

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    c.fade += ((c.dying ? 0 : 1) - c.fade) * (1 - Math.pow(0.02, dt));
    if (c.dying && c.fade < 0.02) { creatures.splice(i, 1); continue; }
    steer(c, dt, p);
  }
}

/* ---- creature rendering ------------------------------------------ */
// silhouette width along the body, 0 = nose, 1 = tail tip
function bodyProfile(u, c) {
  const A = c.A;
  const head = Math.sin(Math.min(1, u * 4.4) * Math.PI * 0.5);
  const taper = A.tail > 0 ? Math.pow(1 - u, 0.75) : 1 - u * 0.35;
  let w = (0.34 + 0.66 * head) * taper;
  if (c.kind === 'trilobite') w = Math.sin((0.18 + u * 0.72) * Math.PI) * 1.25;
  if (c.kind === 'dino' || c.kind === 'reptile') w = (0.3 + 0.7 * head) * Math.pow(1 - u, 1.15) + 0.06;
  if (c.kind === 'mammal') w = Math.sin((0.14 + u * 0.7) * Math.PI) * 1.05;
  return Math.max(0.04, w);
}

function drawShadow(c, R, sx, sy, soft) {
  const js = c.joints, n = js.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const r = R * bodyProfile(i / Math.max(1, n - 1), c) * soft;
    if (r <= 0.2) continue;
    ctx.moveTo(js[i].x + sx + r, js[i].y + sy);
    ctx.arc(js[i].x + sx, js[i].y + sy, r, 0, TAU);
  }
  ctx.fill();
}

function drawCreature(c, night, sunEl, shX, shY) {
  const A = c.A, js = c.joints, n = js.length;
  const f = c.fade;
  if (f < 0.02) return;
  const R = c.r * (0.35 + 0.65 * f);

  const ang = n > 1 ? Math.atan2(js[0].y - js[1].y, js[0].x - js[1].x) : c.ang;
  const fx = Math.cos(ang), fy = Math.sin(ang);
  const px = -fy, py = fx;

  // --- shadow -------------------------------------------------------
  const airborne = A.habitat === 'air';
  const shadowAlpha = clamp(0.30 * (0.25 + Math.max(0, sunEl)) * (1 - weather.cloud * 0.6), 0, 0.4) * f;
  if (shadowAlpha > 0.01) {
    const lift = airborne ? 7 * U : 1;
    ctx.fillStyle = `rgba(4,10,16,${shadowAlpha * (airborne ? 0.75 : 1)})`;
    drawShadow(c, R, shX * lift + (airborne ? 9 * U : 0), shY * lift + (airborne ? 9 * U : 0), airborne ? 0.95 : 1.05);
  } else if (A.habitat === 'water') {
    ctx.fillStyle = `rgba(2,10,20,${0.16 * f})`;
    drawShadow(c, R, 1.5 * U, 2.2 * U, 1.1);
  }

  const hue = c.hue, sat = c.sat, lig = c.lig;

  // --- limbs (under the body) ---------------------------------------
  if (c.limbPairs > 0) {
    const stride = R * (c.kind === 'insect' ? 2.6 : 2.0);
    const reach  = R * (c.kind === 'trilobite' ? 1.5 : c.kind === 'insect' ? 2.4 : 1.7);
    ctx.strokeStyle = `hsla(${hue},${sat * 0.8}%,${lig * 0.7}%,${0.9 * f})`;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.4, R * (c.kind === 'insect' ? 0.16 : 0.26));
    ctx.beginPath();
    for (let L = 0; L < c.limbPairs; L++) {
      const at = c.limbPairs === 1 ? 1 : 0.6 + L * (n - 2.5) / Math.max(1, c.limbPairs);
      const i0 = clamp(Math.floor(at), 0, n - 2);
      const j0 = js[i0], j1 = js[i0 + 1];
      const dax = j0.x - j1.x, day = j0.y - j1.y;
      const dl = Math.hypot(dax, day) || 1;
      const ux = dax / dl, uy = day / dl, vx = -uy, vy = ux;
      const w = R * bodyProfile(i0 / Math.max(1, n - 1), c);
      for (let s = -1; s <= 1; s += 2) {
        const sw = Math.sin(c.gait + L * 1.05 + (s > 0 ? 0 : Math.PI));
        const hipx = j0.x + vx * w * s * 0.8, hipy = j0.y + vy * w * s * 0.8;
        ctx.moveTo(hipx, hipy);
        ctx.quadraticCurveTo(
          hipx + vx * reach * 0.62 * s + ux * sw * stride * 0.30,
          hipy + vy * reach * 0.62 * s + uy * sw * stride * 0.30,
          hipx + vx * reach * s + ux * sw * stride * 0.62,
          hipy + vy * reach * s + uy * sw * stride * 0.62);
      }
    }
    ctx.stroke();
  }

  // --- fins ---------------------------------------------------------
  if (A.fins) {
    ctx.fillStyle = `hsla(${hue},${sat}%,${lig * 1.15}%,${0.42 * f})`;
    const i0 = Math.min(2, n - 1), j0 = js[i0];
    const w = R * bodyProfile(i0 / Math.max(1, n - 1), c);
    const flap = Math.sin(c.gait * 1.5) * 0.3;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(j0.x, j0.y);
      ctx.quadraticCurveTo(
        j0.x + px * w * 3.0 * s - fx * R * 0.4, j0.y + py * w * 3.0 * s - fy * R * 0.4,
        j0.x + px * w * 1.3 * s - fx * R * (2.0 + flap), j0.y + py * w * 1.3 * s - fy * R * (2.0 + flap));
      ctx.closePath();
      ctx.fill();
    }
  }

  // --- body ---------------------------------------------------------
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const r = R * bodyProfile(i / Math.max(1, n - 1), c);
    if (r < 0.15) continue;
    ctx.moveTo(js[i].x + r, js[i].y);
    ctx.arc(js[i].x, js[i].y, r, 0, TAU);
  }
  if (A.fur) {                       // a soft halo standing in for fur
    ctx.fillStyle = `hsla(${hue},${sat * 0.7}%,${lig * 0.75}%,${0.55 * f})`;
    ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const r = R * bodyProfile(i / Math.max(1, n - 1), c) * 0.8;
      if (r < 0.15) continue;
      ctx.moveTo(js[i].x + r, js[i].y);
      ctx.arc(js[i].x, js[i].y, r, 0, TAU);
    }
  }
  ctx.fillStyle = `hsla(${hue},${sat}%,${lig}%,${0.92 * f})`;
  ctx.fill();

  const onScreenR = R * cam.z;

  // dorsal highlight — reads as a spine from above
  if (onScreenR > 1.6 && n > 2) {
    ctx.strokeStyle = `hsla(${hue},${sat * 0.9}%,${Math.min(88, lig * 1.75)}%,${0.30 * f})`;
    ctx.lineWidth = Math.max(0.3, R * 0.30);
    ctx.beginPath();
    ctx.moveTo(js[0].x, js[0].y);
    for (let i = 1; i < n - 1; i++) {
      ctx.quadraticCurveTo(js[i].x, js[i].y, (js[i].x + js[i + 1].x) / 2, (js[i].y + js[i + 1].y) / 2);
    }
    ctx.stroke();
  }

  // segment banding
  if (A.seg > 0.3 && onScreenR > 1.8) {
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig * 0.55}%,${0.4 * A.seg * f})`;
    ctx.lineWidth = Math.max(0.25, R * 0.12);
    ctx.beginPath();
    for (let i = 1; i < n - 1; i++) {
      const r = R * bodyProfile(i / (n - 1), c);
      const dx = js[i].x - js[i + 1].x, dy = js[i].y - js[i + 1].y;
      const d = Math.hypot(dx, dy) || 1;
      ctx.moveTo(js[i].x - dy / d * r, js[i].y + dx / d * r);
      ctx.lineTo(js[i].x + dy / d * r, js[i].y - dx / d * r);
    }
    ctx.stroke();
  }

  // --- tail fin -----------------------------------------------------
  if (A.tail > 0.6 && A.habitat === 'water' && n > 1) {
    const a = js[n - 1], b = js[n - 2];
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d, vx = -uy, vy = ux;
    const s = R * 2.4;
    ctx.fillStyle = `hsla(${hue},${sat}%,${lig * 1.1}%,${0.55 * f})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + ux * s + vx * s * 0.8, a.y + uy * s + vy * s * 0.8);
    ctx.lineTo(a.x + ux * s * 0.45, a.y + uy * s * 0.45);
    ctx.lineTo(a.x + ux * s - vx * s * 0.8, a.y + uy * s - vy * s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  // --- wings --------------------------------------------------------
  if (A.wings) {
    const flap = Math.abs(Math.sin(c.gait * (A.wings === 2 ? 3.2 : 1.5)));
    const span = R * (A.wings === 2 ? 3.4 : 4.6);
    const chord = R * (A.wings === 2 ? 0.9 : 1.5);
    ctx.fillStyle = A.wings === 2
      ? `rgba(226,240,255,${0.20 * f})`
      : `hsla(${hue},${sat * 0.7}%,${lig * 1.2}%,${0.85 * f})`;
    const rows = A.wings === 2 ? 2 : 1;
    for (let r0 = 0; r0 < rows; r0++) {
      const j = js[Math.min(1 + r0, n - 1)];
      for (let s = -1; s <= 1; s += 2) {
        const ext = 0.35 + 0.65 * (A.wings === 2 ? flap : 0.35 + flap * 0.65);
        ctx.beginPath();
        ctx.ellipse(
          j.x + px * span * 0.5 * s * ext + fx * chord * 0.1,
          j.y + py * span * 0.5 * s * ext + fy * chord * 0.1,
          span * 0.5 * ext, chord, Math.atan2(py * s, px * s), 0, TAU);
        ctx.fill();
      }
    }
  }

  // --- cilia (early life) -------------------------------------------
  if (A.cilia && onScreenR > 1.6) {
    ctx.strokeStyle = `hsla(${hue},${sat}%,${lig * 1.4}%,${0.30 * f})`;
    ctx.lineWidth = Math.max(0.25, R * 0.10);
    ctx.beginPath();
    const j = js[0], w = R * bodyProfile(0, c);
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * TAU + c.gait * 0.5;
      const q = 1 + Math.sin(c.gait * 2 + k) * 0.3;
      ctx.moveTo(j.x + Math.cos(a) * w, j.y + Math.sin(a) * w);
      ctx.lineTo(j.x + Math.cos(a) * w * 1.55 * q, j.y + Math.sin(a) * w * 1.55 * q);
    }
    ctx.stroke();
  }

  // --- eyes ---------------------------------------------------------
  if (A.eyes === 2 && onScreenR > 1.9) {
    const j = js[0], w = R * bodyProfile(0.06, c) * 0.62;
    ctx.fillStyle = `rgba(12,14,18,${0.85 * f})`;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(j.x + px * w * s + fx * R * 0.25, j.y + py * w * s + fy * R * 0.25, Math.max(0.35, R * 0.19), 0, TAU);
      ctx.fill();
    }
    if (night > 0.35 && onScreenR > 2.6) {
      ctx.fillStyle = `rgba(255,238,190,${0.5 * night * f})`;
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.arc(j.x + px * w * s + fx * R * 0.25, j.y + py * w * s + fy * R * 0.25, Math.max(0.25, R * 0.09), 0, TAU);
        ctx.fill();
      }
    }
  }
}

/* ================================================================== *
 *  CAMERA — wide survey, then descend on one individual and follow it
 * ================================================================== */
const cam = {
  x: 0, y: 0, z: 1,
  state: 'wide',        // wide | in | track | out
  t: 0,                 // seconds spent in the current state
  hold: 22,             // seconds this state lasts
  subject: null,
  targetZ: 1,
  fromX: 0, fromY: 0, fromZ: 1,
  banner: 0,            // dossier opacity, 0..1
  observed: 0,          // seconds this individual has been followed
  deathT: -1,           // seconds since it started dying, or -1
};

function viewRect() {
  const hw = W / (2 * cam.z), hh = H / (2 * cam.z);
  return { x0: cam.x - hw, y0: cam.y - hh, x1: cam.x + hw, y1: cam.y + hh };
}
// which wrapped copies of the world does the view touch?
function tiles() {
  const v = viewRect(), out = [];
  const i0 = Math.floor(v.x0 / W), i1 = Math.floor((v.x1 - 0.001) / W);
  const j0 = Math.floor(v.y0 / H), j1 = Math.floor((v.y1 - 0.001) / H);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) out.push(i * W, j * H);
  return out;
}

function zoomFor(c) {
  const want = Math.min(W, H) * 0.26;
  return clamp(want / Math.max(1e-3, bodyLength(c)), 1.7, 13);
}

function chooseSubject() {
  // prefer settled, healthy individuals, weighted a little toward the larger ones
  let best = null, bestScore = -1;
  for (const c of creatures) {
    if (c.dying || c.fade < 0.85) continue;
    if (c.age > c.life - 6) continue;
    const s = rnd() * (0.5 + bodyLength(c) / (60 * U));
    if (s > bestScore) { bestScore = s; best = c; }
  }
  return best;
}

function beginTracking(c) {
  cam.subject = c;
  cam.state = 'in';
  cam.t = 0; cam.hold = 3.4;
  cam.targetZ = zoomFor(c);
  cam.fromX = cam.x; cam.fromY = cam.y; cam.fromZ = cam.z;
  cam.observed = 0; cam.deathT = -1;
  // a protagonist gets a stay of execution — though not always a long enough one
  c.life = c.age + rand(58, 22);
}
function endTracking() {
  cam.state = 'out';
  cam.t = 0; cam.hold = 3.0;
  cam.fromX = cam.x; cam.fromY = cam.y; cam.fromZ = cam.z;
}

function updateCamera(dt) {
  cam.t += dt;
  const cx = W / 2, cy = H / 2;

  switch (cam.state) {
    case 'wide': {
      cam.x += (cx - cam.x) * (1 - Math.pow(0.05, dt));
      cam.y += (cy - cam.y) * (1 - Math.pow(0.05, dt));
      cam.z += (1 - cam.z) * (1 - Math.pow(0.05, dt));
      cam.banner += (0 - cam.banner) * (1 - Math.pow(0.02, dt));
      if (cam.t >= cam.hold) {
        const s = chooseSubject();
        if (s) beginTracking(s);
        else cam.hold = cam.t + 4;      // nothing worth following yet; look again shortly
      }
      break;
    }
    case 'in': {
      const s = cam.subject;
      if (!s || s.fade < 0.05) { endTracking(); break; }
      const u = easeInOut(clamp(cam.t / cam.hold, 0, 1));
      cam.x = lerp(cam.fromX, s.x + nearestOff(s.x, cam.fromX, W), u);
      cam.y = lerp(cam.fromY, s.y + nearestOff(s.y, cam.fromY, H), u);
      cam.z = lerp(cam.fromZ, cam.targetZ, u);
      cam.banner = smoothstep(0.45, 0.95, u);
      if (cam.t >= cam.hold) { cam.state = 'track'; cam.t = 0; cam.hold = rand(52, 26); }
      break;
    }
    case 'track': {
      const s = cam.subject;
      if (!s) { endTracking(); break; }
      cam.observed += dt;
      // spring onto the subject — it holds the centre of frame
      const k = 1 - Math.pow(0.0006, dt);
      cam.x += (s.x + nearestOff(s.x, cam.x, W) - cam.x) * k;
      cam.y += (s.y + nearestOff(s.y, cam.y, H) - cam.y) * k;
      cam.z += (cam.targetZ - cam.z) * (1 - Math.pow(0.2, dt));
      cam.banner += (1 - cam.banner) * (1 - Math.pow(0.02, dt));

      if (s.dying || s.fade < 0.6) {
        cam.deathT = cam.deathT < 0 ? 0 : cam.deathT + dt;
        if (cam.deathT > 2.6) endTracking();
      } else if (cam.t >= cam.hold) {
        endTracking();
      }
      break;
    }
    case 'out': {
      const u = easeInOut(clamp(cam.t / cam.hold, 0, 1));
      cam.x = lerp(cam.fromX, cx + nearestOff(cx, cam.fromX, W), u);
      cam.y = lerp(cam.fromY, cy + nearestOff(cy, cam.fromY, H), u);
      cam.z = lerp(cam.fromZ, 1, u);
      cam.banner = 1 - smoothstep(0, 0.35, u);
      if (cam.t >= cam.hold) {
        cam.subject = null; cam.deathT = -1;
        cam.state = 'wide'; cam.t = 0; cam.hold = rand(34, 16);
      }
      break;
    }
  }
  cam.x = ((cam.x % W) + W) % W;
  cam.y = ((cam.y % H) + H) % H;
}

/* ---- the tracking overlay ---------------------------------------- */
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function setSpacing(px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }

const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

function drawBanner(p) {
  const a = cam.banner, s = cam.subject;
  if (a < 0.02 || !s) return;
  const fs = clamp(Math.min(W, H) / 900, 0.8, 1.45);
  const cx = W / 2, cy = H / 2;
  const dead = s.dying;

  // the subject holds the centre of frame; ring it
  const ringR = clamp(bodyLength(s) * cam.z * 0.62, 26 * fs, Math.min(W, H) * 0.30);
  ctx.save();
  const pulse = 0.7 + 0.3 * Math.sin(clock * 2.2);
  ctx.strokeStyle = dead ? `rgba(255,150,140,${a * 0.75 * pulse})` : `rgba(226,240,255,${a * 0.55 * pulse})`;
  ctx.lineWidth = 1.1 * fs;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, TAU);
  ctx.stroke();

  const rot = clock * 0.25;                        // slowly rotating corner ticks
  ctx.lineWidth = 1.6 * fs;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, ringR * 1.16, rot + i * Math.PI / 2 - 0.16, rot + i * Math.PI / 2 + 0.16);
    ctx.stroke();
  }

  // ---- the dossier card ----
  const cardW = 352 * fs, cardH = 118 * fs;
  const cardX = Math.round(cx - cardW / 2);
  const cardY = Math.round(Math.max(16 * fs, cy - ringR * 1.16 - 34 * fs - cardH));

  ctx.strokeStyle = `rgba(226,240,255,${0.34 * a})`;
  ctx.lineWidth = 1 * fs;
  ctx.beginPath();
  ctx.moveTo(cx, cardY + cardH);
  ctx.lineTo(cx, cy - ringR * 1.16 - 8 * fs);
  ctx.stroke();

  roundRectPath(cardX, cardY, cardW, cardH, 4 * fs);
  ctx.fillStyle = `rgba(6,10,16,${0.62 * a})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(226,240,255,${0.22 * a})`;
  ctx.stroke();

  const padX = cardX + 14 * fs;
  let y = cardY + 22 * fs;

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  setSpacing(1.2 * fs);
  ctx.font = `italic 600 ${14 * fs}px ${MONO}`;
  ctx.fillStyle = `rgba(240,246,255,${0.95 * a})`;
  ctx.fillText(s.name + ' ' + s.epithet, padX, y);

  ctx.textAlign = 'right';
  setSpacing(1.6 * fs);
  ctx.font = `${9 * fs}px ${MONO}`;
  ctx.fillStyle = dead ? `rgba(255,150,140,${0.95 * a})` : `rgba(150,230,190,${0.90 * a})`;
  ctx.fillText(dead ? 'DECEASED' : 'TRACKING', cardX + cardW - 14 * fs, y);
  ctx.textAlign = 'left';

  y += 9 * fs;
  ctx.strokeStyle = `rgba(226,240,255,${0.18 * a})`;
  ctx.beginPath();
  ctx.moveTo(padX, y); ctx.lineTo(cardX + cardW - 14 * fs, y);
  ctx.stroke();

  const mm = Math.floor(cam.observed / 60), ss = Math.floor(cam.observed % 60);
  const rows = [
    ['CLASS',    s.A.common],
    ['LENGTH',   fmtLen(s.metres)],
    ['HABIT',    HABIT_WORD[s.A.habitat]],
    ['DIET',     s.diet],
    ['EPOCH',    p.era.name],
    ['STATE',    dead ? 'vital signs lost' : creatureState(s)],
    ['SPECIMEN', '#' + s.id],
    ['OBSERVED', String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0')],
  ];
  const colW = (cardW - 28 * fs) / 2;
  y += 16 * fs;
  setSpacing(0.6 * fs);
  for (let i = 0; i < rows.length; i++) {
    const rx = padX + (i % 2) * colW;
    const ry = y + ((i / 2) | 0) * 16 * fs;
    ctx.font = `${8.5 * fs}px ${MONO}`;
    ctx.fillStyle = `rgba(200,214,232,${0.45 * a})`;
    ctx.fillText(rows[i][0], rx, ry);
    ctx.font = `${10.5 * fs}px ${MONO}`;
    ctx.fillStyle = `rgba(234,242,252,${0.90 * a})`;
    ctx.fillText(rows[i][1], rx + 62 * fs, ry);
  }
  setSpacing(0);
  ctx.restore();
}

/* ================================================================== *
 *  MAIN LOOP
 * ================================================================== */
let clock = 0;      // wall-clock seconds since start (drives weather and the camera)
let loopT = 0;      // 0..1 position in the evolutionary cycle
let paused = false;
let last = performance.now();
const tint = [0, 0, 0];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  U = Math.min(W, H) / 900;
  MAXPOP = clamp(Math.round(Math.sqrt(W * H) / 11), 45, 140);

  rnd = mulberry32(20260809);
  buildField();
  buildMat();
  buildClouds();
  buildParticles();
  creatures.length = 0;
  cam.x = W / 2; cam.y = H / 2; cam.z = 1;
  cam.state = 'wide'; cam.t = 0; cam.hold = 20;
  cam.subject = null; cam.banner = 0; cam.deathT = -1;
}

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  if (paused) dt = 0;

  clock += dt;
  loopT = (loopT + dt / LOOP) % 1;

  const p = params(loopT);

  // --- sky ----------------------------------------------------------
  const sunA = loopT * DAY_CYCLES * TAU - Math.PI * 0.35;
  const sunEl = Math.sin(sunA);
  const az = sunA * 0.65 + 1.2;
  const shLen = clamp(2.6 / (0.30 + Math.max(0, sunEl) * 3.2), 0.6, 7) * U * 1.4;
  const shX = -Math.cos(az) * shLen, shY = -Math.sin(az) * shLen;
  const night = smoothstep(0.10, -0.28, sunEl);

  // --- world state --------------------------------------------------
  updateWeather(dt, p);
  if (Math.abs(p.sea - bakedSea) > 0.0035 || Math.abs(p.green - bakedGreen) > 0.022) {
    bakeTerrain(p.sea, p.green);
  }
  matAcc += dt;
  if (matAcc >= MAT_STEP) { matAcc = 0; stepMat(); }

  updateCreatures(dt, p);
  updateCamera(dt);

  const z = cam.z;
  const v = viewRect();
  const T = tiles();

  /* ---------------- world pass ---------------- */
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z), DPR * (H / 2 - cam.y * z));
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;

  for (let i = 0; i < T.length; i += 2) ctx.drawImage(terrainCv, T[i], T[i + 1], W, H);

  // the mat resolves into individual organisms as the camera closes in, so fade it
  const matFade = clamp(1 - (z - 2.2) / 5, 0.12, 1);
  const matA = clamp(p.mat, 0, 1) * 0.85 * matFade;
  if (matA > 0.01) {
    ctx.globalAlpha = matA;
    for (let i = 0; i < T.length; i += 2) ctx.drawImage(matCv, T[i], T[i + 1], W, H);
    ctx.globalAlpha = 1;
  }

  // sun glitter on open water
  if (sunEl > -0.1) {
    const sa = clamp(sunEl, 0, 1) * (1 - weather.cloud * 0.8);
    if (sa > 0.02) {
      ctx.strokeStyle = `rgba(226,244,255,${0.16 * sa})`;
      ctx.lineWidth = 1.8 * U;
      ctx.beginPath();
      for (const sh of shimmer) {
        sh.p += dt * (0.6 + sh.l);
        sh.x = (sh.x + Math.cos(sh.p * 0.4) * dt * 6 + W) % W;
        if (hAt(sh.x, sh.y) - p.sea > -0.01) { sh.x = rand(W); sh.y = rand(H); continue; }
        const ox = nearestOff(sh.x, cam.x, W), oy = nearestOff(sh.y, cam.y, H);
        const w = (6 + sh.l * 16) * U * (0.5 + 0.5 * Math.sin(sh.p));
        ctx.moveTo(sh.x + ox - w, sh.y + oy);
        ctx.lineTo(sh.x + ox + w, sh.y + oy);
      }
      ctx.stroke();
    }
  }

  // suspended particulate — close range only, and it sells the change of scale
  if (z > 1.5) {
    const ma = smoothstep(1.5, 3.2, z) * 0.55;
    const overWater = hAt(cam.x, cam.y) - p.sea < 0;
    ctx.fillStyle = overWater ? `rgba(206,232,238,${ma * 0.6})` : `rgba(244,236,214,${ma * 0.5})`;
    const mw = v.x1 - v.x0, mh = v.y1 - v.y0;
    for (const m of motes) {
      m.p += dt * m.v;
      m.x += Math.cos(m.p * 0.7) * 5 * U * dt + weather.windX * 4 * U * dt;
      m.y += Math.sin(m.p * 0.5) * 5 * U * dt + 2 * U * dt;
      if (m.x < v.x0 - mw * 0.1 || m.x > v.x1 + mw * 0.1 ||
          m.y < v.y0 - mh * 0.1 || m.y > v.y1 + mh * 0.1) {
        m.x = v.x0 + rnd() * mw; m.y = v.y0 + rnd() * mh;
      }
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 1.5 / z, 0, TAU);
      ctx.fill();
    }
  }

  // creatures, each drawn at whichever wrapped copy is nearest the camera
  const margin = 90 * U + 40 / z;
  for (const c of creatures) {
    const ox = nearestOff(c.x, cam.x, W), oy = nearestOff(c.y, cam.y, H);
    const sx = c.x + ox, sy = c.y + oy;
    if (sx < v.x0 - margin || sx > v.x1 + margin || sy < v.y0 - margin || sy > v.y1 + margin) continue;
    if (ox || oy) {
      ctx.save(); ctx.translate(ox, oy);
      drawCreature(c, night, sunEl, shX, shY);
      ctx.restore();
    } else {
      drawCreature(c, night, sunEl, shX, shY);
    }
  }

  // cloud shadows
  if (weather.cloud > 0.02) {
    ctx.globalCompositeOperation = 'multiply';
    for (const cl of clouds) {
      cl.x = (cl.x + weather.windX * cl.s * 78 * dt * U + W) % W;
      cl.y = (cl.y + weather.windY * cl.s * 78 * dt * U + H) % H;
      const px = cl.x + nearestOff(cl.x, cam.x, W), py = cl.y + nearestOff(cl.y, cam.y, H);
      if (px + cl.r < v.x0 || px - cl.r > v.x1 || py + cl.r < v.y0 || py - cl.r > v.y1) continue;
      const a = weather.cloud * 0.46 * (0.5 + 0.5 * Math.sin(clock * 0.3 + cl.s * 9));
      const g = ctx.createRadialGradient(px, py, 0, px, py, cl.r);
      const val = Math.round(255 - a * 150);
      g.addColorStop(0, `rgb(${val},${val},${Math.min(255, val + 8)})`);
      g.addColorStop(1, 'rgb(255,255,255)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, cl.r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------------- screen pass ---------------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // daylight tint
  sunTint(sunEl, tint);
  const dim = 1 - weather.cloud * 0.22 - weather.fog * 0.08;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${Math.round(tint[0] * dim)},${Math.round(tint[1] * dim)},${Math.round(tint[2] * dim)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // bioluminescence — strongest in the early oceans
  if (night > 0.06) {
    ctx.globalCompositeOperation = 'lighter';
    for (const c of creatures) {
      const g = c.A.glow * night * c.fade;
      if (g < 0.05) continue;
      const j = c.joints[0];
      const wx = j.x + nearestOff(j.x, cam.x, W), wy = j.y + nearestOff(j.y, cam.y, H);
      const px = (wx - cam.x) * z + W / 2, py = (wy - cam.y) * z + H / 2;
      const r = c.r * 5.5 * z;
      if (px + r < 0 || px - r > W || py + r < 0 || py - r > H) continue;
      const grd = ctx.createRadialGradient(px, py, 0, px, py, r);
      grd.addColorStop(0, `hsla(${c.hue},90%,68%,${0.34 * g})`);
      grd.addColorStop(1, `hsla(${c.hue},90%,60%,0)`);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
    }
    if (p.mat > 0.3 && matA > 0.01) {                     // the mat glows too
      ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z), DPR * (H / 2 - cam.y * z));
      ctx.globalAlpha = night * p.mat * 0.22 * matFade;
      for (let i = 0; i < T.length; i += 2) ctx.drawImage(matCv, T[i], T[i + 1], W, H);
      ctx.globalAlpha = 1;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // rain and snow fall on the lens, so they grow with the zoom
  const zs = lerp(1, 2.4, smoothstep(1, 8, z));
  if (weather.wet > 0.02) {
    const a = weather.wet;
    ctx.strokeStyle = `rgba(186,208,236,${0.30 * a})`;
    ctx.lineWidth = Math.max(0.6, 1.4 * U * zs);
    ctx.beginPath();
    const vx = weather.windX * 160 * U * zs, vy = 520 * U * zs;
    for (const d of drops) {
      d.y += vy * d.v * dt;
      d.x = ((d.x + vx * d.v * dt) % W + W) % W;
      if (d.y > H) { d.y -= H; d.x = rand(W); }
      const L = 16 * U * d.l * d.v * zs;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - vx / vy * L, d.y - L);
    }
    ctx.stroke();
  }

  if (weather.snow > 0.02) {
    const a = weather.snow;
    ctx.fillStyle = `rgba(244,250,255,${0.72 * a})`;
    for (const fl of flakes) {
      fl.p += dt * 1.7;
      fl.y += 46 * U * fl.v * dt * zs;
      fl.x = ((fl.x + (Math.sin(fl.p) * 22 + weather.windX * 60) * U * dt * zs) % W + W) % W;
      if (fl.y > H) { fl.y -= H; fl.x = rand(W); }
      ctx.beginPath(); ctx.arc(fl.x, fl.y, fl.r * U * 1.6 * zs, 0, TAU); ctx.fill();
    }
  }

  if (weather.fog > 0.02) {
    const a = weather.fog;
    const g = ctx.createLinearGradient(0, 0, W * 0.35, H);
    g.addColorStop(0, `rgba(198,210,224,${0.30 * a})`);
    g.addColorStop(0.5, `rgba(206,216,228,${0.44 * a})`);
    g.addColorStop(1, `rgba(190,204,220,${0.28 * a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (weather.flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(190,206,255,${0.40 * weather.flash})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // the vignette closes in a little when the camera is down among them
  const close = smoothstep(1.5, 9, z);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * (0.35 - close * 0.10),
                                      W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(0,0,0,${0.42 + close * 0.20})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  drawBanner(p);
  updateHUD(p);
  requestAnimationFrame(frame);
}

/* ================================================================== *
 *  HUD
 * ================================================================== */
const elEra = document.getElementById('era');
const elSub = document.getElementById('sub');
const elClock = document.getElementById('clock');
const elWx = document.getElementById('weather');
const elFill = document.getElementById('fill');
const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
let lastEra = -1, hudAcc = 0;

const fmt = new Intl.NumberFormat('en-US');
function updateHUD(p) {
  elFill.style.width = (loopT * 100).toFixed(2) + '%';
  if (++hudAcc % 6) return;
  if (p.idx !== lastEra) {
    lastEra = p.idx;
    elEra.textContent = p.era.name;
    elSub.textContent = '— ' + p.era.sub;
  }
  const my = Math.max(0, Math.round(p.mya));
  elClock.textContent = my >= 1 ? fmt.format(my) + ' million years ago' : 'the present';
  elWx.textContent = '· ' + weather.kind;
}

(function ticks() {
  const box = document.getElementById('ticks');
  for (const e of ERAS) {
    if (e.at <= 0 || e.at >= 1) continue;
    const i = document.createElement('i');
    i.style.left = (e.at * 100) + '%';
    box.appendChild(i);
  }
})();

/* ================================================================== *
 *  INPUT
 * ================================================================== */
window.addEventListener('resize', resize);
document.addEventListener('click', () => hud.classList.toggle('off'));
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.key === 'h' || e.key === 'H') hud.classList.toggle('off');
  if (e.key === 't' || e.key === 'T') {
    if (cam.state === 'wide') { const s = chooseSubject(); if (s) beginTracking(s); }
    else if (cam.state === 'track' || cam.state === 'in') endTracking();
  }
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });
setTimeout(() => hint.classList.add('off'), 6500);

resize();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
</html>
