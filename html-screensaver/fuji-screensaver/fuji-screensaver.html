<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>富士の24時 - Mt. Fuji 24-Hour Screensaver</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden; background: #000;
    height: 100%; width: 100%;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .info {
    position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7);
    font-size: 15px; pointer-events: none; text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    z-index: 10; letter-spacing: 0.5px;
  }
  .info #time {
    font-size: 28px;
    font-weight: 300;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="info">
  <div id="time">06:00</div>
  <div id="weather">🌅 Morning Mist • 16°C</div>
</div>

<script>
// =============== MT. FUJI 24-HOUR CINEMATIC SCREENSAVER ===============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: true });
let w, h, time = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function lerpColor(a, b, t) {
  const c1 = hexToRgb(a), c2 = hexToRgb(b);
  return `rgb(${Math.round(c1.r + (c2.r-c1.r)*t)},${Math.round(c1.g+(c2.g-c1.g)*t)},${Math.round(c1.b+(c2.b-c1.b)*t)})`;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function drawMountain(x, baseY, height, color, snowOpacity = 1) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - 320, baseY);
  ctx.quadraticCurveTo(x - 160, baseY - height * 0.45, x - 40, baseY - height * 0.78);
  ctx.quadraticCurveTo(x + 30, baseY - height * 0.92, x + 110, baseY - height * 0.71);
  ctx.quadraticCurveTo(x + 220, baseY - height * 0.52, x + 340, baseY);
  ctx.closePath();
  ctx.fill();

  // Snow cap with soft edge
  ctx.globalAlpha = snowOpacity;
  ctx.fillStyle = '#f8fbff';
  ctx.beginPath();
  ctx.moveTo(x - 95, baseY - height * 0.79);
  ctx.quadraticCurveTo(x - 25, baseY - height * 0.94, x + 48, baseY - height * 0.81);
  ctx.quadraticCurveTo(x + 105, baseY - height * 0.79, x + 145, baseY - height * 0.68);
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function drawSunMoon(t) {
  const angle = (t * Math.PI * 2) - Math.PI * 0.65;
  const radius = Math.min(w, h) * 0.13;
  const cx = w * 0.68;
  const cy = h * 0.28;
  const x = cx + Math.cos(angle) * radius * 1.9;
  const y = cy + Math.sin(angle) * radius * 0.85;

  const isDay = t > 0.12 && t < 0.78;

  ctx.save();
  if (isDay) {
    // Sun with strong bloom
    ctx.shadowBlur = 90;
    ctx.shadowColor = '#ffeb3b';
    ctx.fillStyle = '#fff7d6';
    ctx.beginPath();
    ctx.arc(x, y, 52, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 160;
    ctx.shadowColor = '#ff9800';
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(x, y, 68, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Moon
    ctx.shadowBlur = 55;
    ctx.shadowColor = '#e0e7ff';
    ctx.fillStyle = '#f4f6ff';
    ctx.beginPath();
    ctx.arc(x, y, 42, 0, Math.PI * 2);
    ctx.fill();

    // Craters
    ctx.fillStyle = 'rgba(200,210,240,0.25)';
    ctx.beginPath(); ctx.arc(x-12, y-8, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+18, y+11, 6, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawClouds(t, opacity, layer) {
  ctx.globalAlpha = opacity;
  const speed = layer === 1 ? 0.028 : 0.015;
  const baseY = layer === 1 ? h * 0.19 : h * 0.11;
  const sizeMod = layer === 1 ? 1 : 1.4;

  for (let i = -1; i < 7; i++) {
    const x = (w * 0.15 + ((t * w * speed) + i * (w * 0.38)) % (w * 2.1)) - w * 0.2;
    const y = baseY + Math.sin(t * 1.2 + i) * 12;

    ctx.fillStyle = layer === 1 ? '#e6edf7' : '#f0f5ff';

    ctx.beginPath();
    ctx.ellipse(x + 90, y + 28, 92 * sizeMod, 38 * sizeMod, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 165, y + 19, 78 * sizeMod, 48 * sizeMod, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 245, y + 31, 85 * sizeMod, 36 * sizeMod, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;
}

function getWeather(t) {
  const hour = Math.floor((t * 24) % 24);
  if (hour < 5 || hour > 20) return { temp: '11°C', cond: 'Clear Night', icon: '🌙' };
  if (hour >= 5 && hour < 8) return { temp: '14°C', cond: 'Morning Mist', icon: '🌫️' };
  if (hour >= 8 && hour < 16) return { temp: '21°C', cond: 'Clear Skies', icon: '⛅' };
  if (hour >= 16 && hour < 19) return { temp: '17°C', cond: 'Golden Sunset', icon: '🌅' };
  return { temp: '13°C', cond: 'Calm Evening', icon: '🌙' };
}

function animate() {
  time += 0.0022;                    // ~60 second full day cycle
  const dayProgress = (time % 1 + 1) % 1;

  const hour24 = Math.floor(dayProgress * 24);
  const minutes = Math.floor((dayProgress * 24 % 1) * 60);
  const timeStr = `${String(hour24).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;

  // Dynamic sky
  ctx.fillStyle = lerpColor(
    '#0a0f2b',
    dayProgress < 0.5 ? '#7eb0e0' : '#ff8a5c',
    Math.min(1, Math.max(0, dayProgress * 2.2 - 0.3))
  );
  ctx.fillRect(0, 0, w, h);

  // Very distant mountains
  ctx.globalAlpha = 0.25;
  drawMountain(w * 0.18, h * 0.92, h * 0.48, '#1e2a3a', 0.3);
  drawMountain(w * 0.82, h * 0.89, h * 0.52, '#1e2a3a', 0.3);
  ctx.globalAlpha = 1;

  // Main Mt Fuji with dramatic lighting
  const fujiHue = (dayProgress > 0.62 && dayProgress < 0.82) ? '#9c7a4f' : '#1f2c3f';
  const snowOpacity = (dayProgress > 0.15 && dayProgress < 0.82) ? 0.95 : 0.6;
  drawMountain(w * 0.5, h * 0.88, h * 1.05, fujiHue, snowOpacity);

  // Sun / Moon
  drawSunMoon(dayProgress);

  // Layered clouds
  const cloudOpacity = dayProgress > 0.08 && dayProgress < 0.85 ? 0.85 : 0.35;
  drawClouds(time * 0.6, cloudOpacity * 0.6, 2);   // distant clouds
  drawClouds(time * 1.1, cloudOpacity, 1);         // closer clouds

  // Lake with reflection
  const lakeY = h * 0.78;
  const lakeGrad = ctx.createLinearGradient(0, lakeY, 0, h);
  lakeGrad.addColorStop(0, 'rgba(15, 28, 58, 0.75)');
  lakeGrad.addColorStop(1, 'rgba(8, 12, 32, 0.98)');
  ctx.fillStyle = lakeGrad;
  ctx.fillRect(0, lakeY, w, h - lakeY);

  // Reflection of Fuji
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.scale(1, -0.42);
  ctx.translate(0, -h * 2.05);
  drawMountain(w * 0.5, h * 0.88, h * 1.05, '#0f1c2e', snowOpacity * 0.5);
  ctx.restore();

  // Gentle surface ripples
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const y = lakeY + 18 + i * 11;
    ctx.beginPath();
    ctx.moveTo(w * 0.1, y);
    ctx.quadraticCurveTo(w * 0.4, y + (Math.sin(time * 3 + i) * 4), w * 0.9, y);
    ctx.stroke();
  }

  // Update UI
  const weather = getWeather(dayProgress);
  document.getElementById('time').textContent = timeStr;
  document.getElementById('weather').innerHTML = `${weather.icon} &nbsp; ${weather.cond} &nbsp;•&nbsp; ${weather.temp}`;

  requestAnimationFrame(animate);
}

animate();

// Click anywhere to toggle full-screen
canvas.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
</script>
</body>
</html>
