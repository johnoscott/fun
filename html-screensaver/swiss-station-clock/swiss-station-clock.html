<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahnhofsuhr — 24 Stunden in 60 Sekunden</title>
<style>
  :root{
    --sbb-red:#EB0000;
    --ink:#161616;
    --dial:#F7F7F4;
    --sign-blue:#0A4DA1;
    --night:0;          /* 0 day … 1 night, set from JS */
    --lamp:0;           /* lamp warmth, set from JS */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#0b1026;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #sky{z-index:0}
  #fx{z-index:6;pointer-events:none}

  .scene{position:absolute;inset:0;overflow:hidden}

  /* ── passing train (middle ground, beyond the platform edge) ── */
  .train{
    position:absolute;z-index:1;
    bottom:17.5vh;height:7.5vh;width:220vw;left:0;
    transform:translateX(110vw);
    will-change:transform;
  }
  .train .body{
    position:absolute;inset:0;
    background:linear-gradient(#3a3f46,#23262b 60%,#181a1e);
    border-radius:1.2vh;
    box-shadow:0 .5vh 2vh rgba(0,0,0,.45);
  }
  .train .stripe{position:absolute;left:0;right:0;top:12%;height:10%;background:var(--sbb-red);opacity:.9}
  .train .windows{
    position:absolute;left:2%;right:2%;top:30%;height:34%;
    background:repeating-linear-gradient(90deg,
      rgba(255,214,140,calc(.25 + var(--night)*.75)) 0 3.2vh,
      transparent 3.2vh 4.6vh);
    border-radius:.4vh;
  }

  /* ── night tint sits over the mid-ground, under the canopy & clock ── */
  .tint{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:#050814;
    opacity:calc(var(--night)*.38);
  }

  /* ── canopy ── */
  .canopy{position:absolute;z-index:3;top:0;left:0;right:0;height:11vh}
  .canopy .roof{
    position:absolute;inset:0;
    background:linear-gradient(#2b2e33,#1d1f23);
    filter:brightness(calc(1 - var(--night)*.45));
  }
  .canopy .fascia{
    position:absolute;left:0;right:0;bottom:0;height:1.1vh;
    background:#101114;
  }
  .lamp{
    position:absolute;z-index:4;top:11vh;width:9vh;height:1.6vh;
    background:#17181b;border-radius:0 0 .8vh .8vh;
  }
  .lamp::before{ /* stem */
    content:"";position:absolute;left:50%;top:-1.4vh;width:.5vh;height:1.4vh;
    transform:translateX(-50%);background:#17181b;
  }
  .lamp::after{ /* glow */
    content:"";position:absolute;left:50%;top:100%;
    width:34vh;height:46vh;transform:translate(-50%,-8%);
    background:radial-gradient(ellipse 50% 55% at 50% 0%,
      rgba(255,205,120,.55), rgba(255,190,100,.12) 55%, transparent 75%);
    opacity:var(--lamp);
    pointer-events:none;
  }
  .lamp.l1{left:12vw}.lamp.l2{right:12vw}

  /* ── the clock, hanging from the canopy ── */
  .clockmount{
    position:absolute;z-index:5;left:50%;top:11vh;
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
  }
  .stem{width:1.2vh;height:6vh;background:#141519;border-radius:0 0 .3vh .3vh}
  .clockwrap{position:relative}
  .halo{ /* dial illumination after dark — SBB platform clocks glow */
    position:absolute;inset:-18%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,244,214,.85) 42%,rgba(255,244,214,.18) 62%,transparent 72%);
    opacity:calc(var(--night)*.9);
    pointer-events:none;
  }
  #clock{
    position:relative;display:block;
    width:min(46vh,72vw);height:min(46vh,72vw);
    filter:drop-shadow(0 1.2vh 3vh rgba(0,0,0,.5));
  }

  /* ── platform ── */
  .platform{
    position:absolute;z-index:3;left:0;right:0;bottom:0;height:16vh;
    background:linear-gradient(#585c60,#43464a 30%,#333538);
    filter:brightness(calc(1 - var(--night)*.55));
  }
  .platform .edge{position:absolute;top:0;left:0;right:0;height:1vh;background:#6e7276}
  .platform .safety{position:absolute;top:2.4vh;left:0;right:0;height:.9vh;background:#e9e7e2;opacity:.9}
  .platform .tactile{
    position:absolute;top:4.6vh;left:0;right:0;height:1.4vh;
    background:repeating-linear-gradient(90deg,#565a5e 0 1.4vh,#43464a 1.4vh 2.8vh);
  }

  /* ── station sign ── */
  .sign{
    position:absolute;z-index:5;top:16vh;left:5vw;
    background:var(--sign-blue);color:#fff;
    padding:1.2vh 2.6vh 1.4vh;border-radius:.6vh;
    box-shadow:0 .6vh 2vh rgba(0,0,0,.4);
    filter:brightness(calc(1 - var(--night)*.35 + var(--lamp)*.15));
  }
  .sign .name{font-size:3.4vh;font-weight:700;letter-spacing:.02em;line-height:1}
  .sign .sub{font-size:1.3vh;font-weight:400;opacity:.85;margin-top:.5vh;letter-spacing:.08em}

  /* ── HUD: simulated time, weather, temperature + 24h scrubber ── */
  .hud{
    position:absolute;z-index:7;right:4vw;bottom:19vh;
    text-align:right;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.65);
  }
  .hud .time{font-size:5.4vh;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1}
  .hud .wx{font-size:1.7vh;font-weight:700;letter-spacing:.24em;margin-top:.8vh}
  .hud .wx .temp{font-weight:400;letter-spacing:.05em;margin-left:1.2vh;font-variant-numeric:tabular-nums}

  .strip{
    position:absolute;z-index:7;left:5vw;right:5vw;bottom:5.2vh;
    color:rgba(255,255,255,.75);
  }
  .strip .caption{
    display:flex;justify-content:space-between;
    font-size:1.25vh;letter-spacing:.22em;font-weight:400;margin-bottom:1vh;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  #scrub{
    -webkit-appearance:none;appearance:none;
    width:100%;height:2.4vh;background:transparent;cursor:pointer;display:block;
  }
  #scrub::-webkit-slider-runnable-track{
    height:.35vh;border-radius:.2vh;
    background:linear-gradient(90deg,var(--sbb-red) var(--prog,0%),rgba(255,255,255,.28) var(--prog,0%));
  }
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:1.6vh;height:1.6vh;border-radius:50%;
    background:var(--sbb-red);border:2px solid #fff;
    margin-top:-.66vh;
  }
  #scrub:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:.4vh}

  #playpause{
    position:absolute;z-index:7;left:5vw;bottom:9.2vh;
    background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:.5vh;font:700 1.4vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    letter-spacing:.14em;padding:1vh 1.6vh;cursor:pointer;
  }
  #playpause:hover{background:rgba(0,0,0,.55)}
  #playpause:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .flash{ /* lightning */
    position:absolute;inset:0;z-index:6;background:#eaf2ff;
    opacity:0;pointer-events:none;
  }

  @media (max-width:640px){
    .hud{right:50%;transform:translateX(50%);bottom:20vh;text-align:center}
    .sign{top:13vh;left:3vw}
    .lamp.l1{left:4vw}.lamp.l2{right:4vw}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="scene">
  <div class="train" id="train" hidden>
    <div class="body"></div><div class="stripe"></div><div class="windows"></div>
  </div>
  <div class="tint"></div>

  <div class="canopy"><div class="roof"></div><div class="fascia"></div></div>
  <div class="lamp l1"></div><div class="lamp l2"></div>

  <div class="clockmount">
    <div class="stem"></div>
    <div class="clockwrap">
      <div class="halo"></div>
      <svg id="clock" viewBox="-110 -110 220 220" role="img"
           aria-label="Swiss railway clock showing simulated time"></svg>
    </div>
  </div>

  <div class="platform">
    <div class="edge"></div><div class="safety"></div><div class="tactile"></div>
  </div>

  <div class="sign"><div class="name">ZUG</div><div class="sub">GLEIS&nbsp;2 &nbsp;·&nbsp; RICHTUNG&nbsp;ZÜRICH&nbsp;HB</div></div>

  <div class="hud">
    <div class="time" id="digital">00:00</div>
    <div class="wx"><span id="wxword">KLAR</span><span class="temp" id="temp">9°</span></div>
  </div>

  <div class="strip">
    <div class="caption"><span>24 STUNDEN IN 60 SEKUNDEN</span><span>MONDAINE&nbsp;·&nbsp;STOP-TO-GO</span></div>
    <input id="scrub" type="range" min="0" max="60" step="0.05" value="0" aria-label="Scrub through the 24-hour day">
  </div>
  <button id="playpause" aria-label="Pause simulation">PAUSE&nbsp;⏸</button>
</div>

<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>

<script>
'use strict';
/* ================= time engine: 24 h in 60 s ================= */
const CYCLE = 60;                       // real seconds per simulated day
let cycleSec = 22;                      // start mid-morning so first frame is friendly
let driftSec = 0;                       // ambient motion clock — only advances while running
let running = true;
let last = performance.now();

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) { running = false; cycleSec = 25.4; } // static ~10:09, the classic dial pose

/* ================= helpers ================= */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(c1,c2,t){return `rgb(${c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')})`;}
function mixh(h1,h2,t){return mix(hex(h1),hex(h2),t);}

/* ================= the SBB clock (Hilfiker geometry, SVG) ================= */
const SVG='http://www.w3.org/2000/svg';
const clock=document.getElementById('clock');
function el(n,attrs,parent){const e=document.createElementNS(SVG,n);
  for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||clock).appendChild(e);return e;}

el('circle',{r:106,fill:'#101114'});                       // case rim
el('circle',{r:100,fill:'#F7F7F4'});                       // dial
for(let i=0;i<60;i++){                                     // batons — no numerals
  const hour=i%5===0;
  el('rect',{
    x:hour?-3.5:-1.3, y:-97,
    width:hour?7:2.6, height:hour?28:9.5,
    fill:'#161616', transform:`rotate(${i*6})`
  });
}
const gH=el('g',{}), gM=el('g',{}), gS=el('g',{});
el('polygon',{points:'-6.2,14 -4.6,-64 4.6,-64 6.2,14',fill:'#161616'},gH);   // hour
el('polygon',{points:'-5,16 -3.2,-94 3.2,-94 5,16',fill:'#161616'},gM);       // minute
el('rect',{x:-1.6,y:-70,width:3.2,height:92,fill:'#EB0000'},gS);              // second shaft
el('circle',{cy:-70,r:9.5,fill:'#EB0000'},gS);                                // the red pea
el('circle',{r:4.2,fill:'#161616'});                                          // hub

/* ================= weather model (a Swiss day, scripted) =================
   fog at dawn · clear late morning · clouds build after lunch ·
   a thunderstorm mid-afternoon · clearing to a golden evening · starry night */
function factors(h){
  const fog   = smooth(4.4,5.6,h)*(1-smooth(7.6,9.2,h));
  const cloud = clamp(smooth(12,14,h)*.9*(1-smooth(17,19.2,h)) + .08, 0, 1)
              + fog*.25;
  const rain  = smooth(14.4,15.4,h)*(1-smooth(16.8,17.9,h));
  const storm = smooth(15.2,15.6,h)*(1-smooth(16.6,17.2,h));
  const dark  = 1-(smooth(5.4,7.2,h)*(1-smooth(19.9,21.6,h)));   // 1 = night
  return {fog,cloud:clamp(cloud,0,1),rain,storm,dark};
}
function temperature(h,f){
  const base = 16.5 + 7.5*Math.cos(2*Math.PI*(h-15)/24);          // min 03:00, max 15:00
  return Math.round(base - f.rain*3.5 - f.fog*1.5);
}
function weatherWord(h,f){
  if(f.storm>.4) return 'GEWITTER';
  if(f.rain>.35) return 'REGEN';
  if(f.fog>.45)  return 'NEBEL';
  if(f.cloud>.55)return 'BEWÖLKT';
  if(f.dark>.6)  return 'KLAR';
  return 'HEITER';
}

/* sky gradient keyframes: [hour, zenith, horizon] */
const SKY=[
  [0.0,'#0B1026','#1A2340'],[4.6,'#0B1026','#1A2340'],
  [5.7,'#2B2A4A','#7A4B56'],[6.6,'#5B6FA8','#F2A65E'],
  [8.0,'#7FA8D9','#DBE6EE'],[12.0,'#4F8FD6','#CFE3F2'],
  [16.5,'#4F8FD6','#C9DCEC'],[19.4,'#5F7EC0','#F0B26A'],
  [20.8,'#3A3F7A','#E2694A'],[21.7,'#141A38','#2C3560'],
  [24.0,'#0B1026','#1A2340'],
];
function skyColors(h){
  let i=0; while(i<SKY.length-2 && SKY[i+1][0]<=h) i++;
  const t=clamp((h-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]),0,1);
  return [mix(hex(SKY[i][1]),hex(SKY[i+1][1]),t), mix(hex(SKY[i][2]),hex(SKY[i+1][2]),t)];
}

/* ================= canvases ================= */
const sky=document.getElementById('sky'), fx=document.getElementById('fx');
const sctx=sky.getContext('2d'), fctx=fx.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  for(const c of [sky,fx]){c.width=W*DPR;c.height=H*DPR;}
  sctx.setTransform(DPR,0,0,DPR,0,0);fctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

/* static geometry, generated once */
function ridge(seed,n,base,amp){
  const pts=[];let y=base;
  for(let i=0;i<=n;i++){
    const s=Math.sin(i*seed*12.9898)*43758.5453;
    y=clamp(y+(s-Math.floor(s)-.5)*amp, base-amp*2.2, base+amp*1.2);
    pts.push([i/n,y]);
  }
  return pts;
}
const RIDGE_FAR = ridge(1.7,26,.52,.045);
const RIDGE_NEAR= ridge(3.1,20,.62,.06);
const STARS=Array.from({length:150},()=>[Math.random(),Math.random()*.55,.4+Math.random()*.8]);
const CLOUDS=Array.from({length:6},(_,i)=>({
  x:Math.random(), y:.10+Math.random()*.22, s:.10+Math.random()*.10,
  v:.006+Math.random()*.01, puffs:Array.from({length:5},()=>[
    (Math.random()-.5)*2.2,(Math.random()-.5)*.5,.55+Math.random()*.55])
}));
const DROPS=Array.from({length:240},()=>({x:Math.random(),y:Math.random(),v:.9+Math.random()*.6}));

function drawRidge(ctx,pts,color,yScale){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(const [x,y] of pts)ctx.lineTo(x*W,y*H*yScale);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

function drawSky(h,f){
  const [top,hor]=skyColors(h);
  const grey=f.cloud*.5+f.rain*.25;
  const g=sctx.createLinearGradient(0,0,0,H*.86);
  g.addColorStop(0,mix(hex(rgb2hex(top)),[110,116,124],grey));
  g.addColorStop(1,mix(hex(rgb2hex(hor)),[150,155,160],grey*.8));
  sctx.fillStyle=g;sctx.fillRect(0,0,W,H);

  /* stars */
  const starA=f.dark*(1-f.cloud)*(1-f.fog);
  if(starA>.02){sctx.fillStyle=`rgba(255,255,255,${.9*starA})`;
    for(const [x,y,r] of STARS){sctx.beginPath();sctx.arc(x*W,y*H,r,0,7);sctx.fill();}}

  /* sun */
  const rise=6.25,set=20.75;
  if(h>rise-1&&h<set+1){
    const p=(h-rise)/(set-rise);
    const elev=Math.sin(Math.PI*clamp(p,0,1));
    const sx=lerp(.08,.92,p)*W, sy=H*.8-elev*H*.62;
    const low=1-smooth(.06,.22,elev);
    const sunC=mixh('#FFF3C4','#FF8A3D',low);
    const glow=sctx.createRadialGradient(sx,sy,0,sx,sy,H*.28);
    glow.addColorStop(0,sunC.replace('rgb','rgba').replace(')',`,${.5*(1-f.cloud*.8)*(1-f.fog*.7)})`));
    glow.addColorStop(1,'rgba(255,200,80,0)');
    sctx.fillStyle=glow;sctx.fillRect(sx-H*.3,sy-H*.3,H*.6,H*.6);
    sctx.globalAlpha=(1-f.cloud*.85)*(1-f.fog*.8);
    sctx.fillStyle=sunC;sctx.beginPath();sctx.arc(sx,sy,H*.032,0,7);sctx.fill();
    sctx.globalAlpha=1;
  }
  /* moon */
  if(f.dark>.35){
    const mh=(h+12)%24, p=clamp((mh-6.25)/(20.75-6.25),0,1);
    const mx=lerp(.1,.9,p)*W, my=H*.7-Math.sin(Math.PI*p)*H*.5;
    sctx.globalAlpha=f.dark*(1-f.cloud);
    sctx.fillStyle='#E8ECF2';sctx.beginPath();sctx.arc(mx,my,H*.022,0,7);sctx.fill();
    sctx.fillStyle=`rgba(20,26,56,.85)`;sctx.beginPath();sctx.arc(mx-H*.008,my-H*.006,H*.019,0,7);sctx.fill();
    sctx.globalAlpha=1;
  }

  /* mountains — blend day/night so dusk never pops */
  const dk=f.dark;
  drawRidge(sctx,RIDGE_FAR, mix(hex('#8FA6C4'),hex('#1A2340'),dk), 1);
  drawRidge(sctx,RIDGE_NEAR,mix(hex('#5F7590'),hex('#101728'),dk), 1);

  /* clouds */
  if(f.cloud>.03){
    const day=f.rain>.1?[120,126,134]:[245,247,250];
    const cc=day.map((v,i)=>Math.round(lerp(v,[40,46,60][i],dk)));
    for(const c of CLOUDS){
      const cx=((c.x+driftSec*c.v)%1.3-.15)*W;
      sctx.fillStyle=`rgba(${cc},${.75*f.cloud})`;
      for(const [px,py,pr] of c.puffs){
        sctx.beginPath();
        sctx.ellipse(cx+px*c.s*W,c.y*H+py*c.s*H,c.s*W*pr,c.s*H*pr*.45,0,0,7);
        sctx.fill();
      }
    }
  }

  /* dawn fog: soft banks lying over the tracks */
  if(f.fog>.02){
    for(let i=0;i<3;i++){
      const fy=H*(.55+i*.12), drift=Math.sin(driftSec*.4+i*2)*W*.02;
      const fg=sctx.createLinearGradient(0,fy-H*.09,0,fy+H*.07);
      fg.addColorStop(0,'rgba(205,210,216,0)');
      fg.addColorStop(.5,`rgba(205,210,216,${.5*f.fog})`);
      fg.addColorStop(1,'rgba(205,210,216,0)');
      sctx.fillStyle=fg;sctx.fillRect(drift-W*.05,fy-H*.09,W*1.1,H*.16);
    }
    sctx.fillStyle=`rgba(200,206,212,${.22*f.fog})`;sctx.fillRect(0,0,W,H);
  }
}
function rgb2hex(rgb){const m=rgb.match(/\d+/g);
  return '#'+m.map(v=>(+v).toString(16).padStart(2,'0')).join('');}

function drawFx(f,dt){
  fctx.clearRect(0,0,W,H);
  if(f.rain>.02){
    fctx.strokeStyle=`rgba(200,214,230,${.5*f.rain})`;fctx.lineWidth=1;
    fctx.beginPath();
    for(const d of DROPS){
      d.y+=d.v*dt*2.2; d.x+=d.v*dt*.28;
      if(d.y>1){d.y-=1.05;d.x=Math.random();}
      const x=d.x*W,y=d.y*H;
      fctx.moveTo(x,y);fctx.lineTo(x-W*.006,y+H*.03);
    }
    fctx.stroke();
  }
}

/* ================= lightning ================= */
const flash=document.getElementById('flash');
let flashA=0,nextBolt=0;
function lightning(f,dt,now){
  if(f.storm>.3&&now>nextBolt){flashA=.85;nextBolt=now+.7+Math.random()*2.2;}
  flashA=Math.max(0,flashA-dt*3.2);
  flash.style.opacity=flashA*(f.storm>.05?1:0);
}

/* ================= trains ================= */
const TRAINS=[7.05,9.4,12.78,15.52,18.25,22.1];   // sim-hour departures
const train=document.getElementById('train');
let trainAnim=null,trainDir=1;
function maybeTrain(prevH,h){
  for(const t of TRAINS){
    const crossed = prevH<h ? (t>prevH&&t<=h) : (t>prevH||t<=h);
    if(crossed&&!trainAnim){
      trainDir*=-1;
      train.hidden=false;
      trainAnim=train.animate(
        [{transform:`translateX(${trainDir>0?110:-220}vw)`},
         {transform:`translateX(${trainDir>0?-220:110}vw)`}],
        {duration:1500,easing:'linear'});
      trainAnim.onfinish=()=>{train.hidden=true;trainAnim=null;};
    }
  }
}

/* ================= HUD & controls ================= */
const digital=document.getElementById('digital'),
      wxword=document.getElementById('wxword'),
      tempEl=document.getElementById('temp'),
      scrub=document.getElementById('scrub'),
      btn=document.getElementById('playpause');
let scrubbing=false;

scrub.addEventListener('pointerdown',()=>scrubbing=true);
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{cycleSec=+scrub.value;});
btn.addEventListener('click',toggle);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle();}});
function toggle(){
  running=!running;
  btn.textContent=running?'PAUSE ⏸':'PLAY ▶';
  btn.setAttribute('aria-label',running?'Pause simulation':'Play simulation');
}
if(reduced){btn.textContent='PLAY ▶';btn.setAttribute('aria-label','Play simulation');}

/* ================= main loop ================= */
let prevSimH=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.1);last=now;
  if(running&&!scrubbing){cycleSec=(cycleSec+dt)%CYCLE;driftSec+=dt;}

  const simH=cycleSec/CYCLE*24;
  const f=factors(simH);

  /* — hands — */
  const hh=(simH%12)/12*360;
  const simMin=Math.floor(simH*60)%60;                    // Minutensprung: it steps
  const mm=simMin/60*360;
  const ss=Math.min(cycleSec%CYCLE/58,1)*360;             // stop-to-go: 58 s sweep, 2 s rest at 12
  gH.setAttribute('transform',`rotate(${hh})`);
  gM.setAttribute('transform',`rotate(${mm})`);
  gS.setAttribute('transform',`rotate(${ss})`);

  /* — scene — */
  drawSky(simH,f);
  drawFx(f,running&&!scrubbing?dt:0);
  lightning(f,dt,driftSec);
  if(running&&!scrubbing)maybeTrain(prevSimH,simH);
  prevSimH=simH;

  document.documentElement.style.setProperty('--night',f.dark.toFixed(3));
  document.documentElement.style.setProperty('--lamp',(f.dark*(1-f.fog*.4)).toFixed(3));

  /* — HUD — */
  const H24=String(Math.floor(simH)).padStart(2,'0'),
        M60=String(simMin).padStart(2,'0');
  digital.textContent=`${H24}:${M60}`;
  wxword.textContent=weatherWord(simH,f);
  tempEl.textContent=`${temperature(simH,f)}°`;
  if(!scrubbing)scrub.value=cycleSec;
  scrub.style.setProperty('--prog',`${cycleSec/CYCLE*100}%`);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
