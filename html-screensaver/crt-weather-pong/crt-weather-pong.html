<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT Weather Pong — A 24-Hour Day Every 60 Seconds</title>
<style>
  :root{
    --ink:#060706;
    --bezel:#0d0e0d;
    --phos:#e6ece2;
    --phos-dim:#9aa397;
    --bloom:rgba(214,255,222,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--phos-dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    min-height:100dvh;
    display:grid;
    grid-template-rows:1fr auto;
    justify-items:center;
    align-items:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    display:grid;
    gap:1.1rem;
    justify-items:center;
    align-content:center;
    padding:2vmin;
    grid-row:1 / -1;
  }

  #tube{
    position:relative;
    width:min(94vw, calc(84dvh * 4 / 3));
    aspect-ratio:4 / 3;
    background:#000;
    border-radius:4% / 5%;
    overflow:hidden;
    cursor:pointer;
    box-shadow:
      0 0 0 2px #191b19,
      0 0 0 14px var(--bezel),
      0 0 0 15px #000,
      0 34px 90px -20px rgba(0,0,0,.95),
      0 0 120px -30px var(--bloom);
  }
  #tube:focus-visible{outline:2px solid var(--phos);outline-offset:20px}

  #scr{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
  }

  /* --- tube overlays --- */
  .lay{position:absolute;inset:0;pointer-events:none}

  .scan{
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0 2px,
      rgba(0,0,0,.42) 2px 4px
    );
    mix-blend-mode:multiply;
    opacity:.85;
  }

  .roll{
    background:linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(230,236,226,.035) 45%,
      rgba(230,236,226,.06) 50%,
      rgba(230,236,226,.035) 55%,
      rgba(255,255,255,0) 100%
    );
    height:34%;
    inset:auto 0 auto 0;
    animation:roll 7.5s linear infinite;
  }
  @keyframes roll{from{transform:translateY(-40%)}to{transform:translateY(330%)}}

  .glass{
    background:
      radial-gradient(120% 90% at 30% 8%, rgba(230,236,226,.055), rgba(230,236,226,0) 55%),
      radial-gradient(90% 70% at 80% 100%, rgba(230,236,226,.03), rgba(230,236,226,0) 60%);
  }

  .vig{
    background:radial-gradient(112% 106% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 86%, rgba(0,0,0,.95) 100%);
    box-shadow:inset 0 0 90px 20px rgba(0,0,0,.8);
    animation:flick 3.9s steps(24) infinite;
  }
  @keyframes flick{
    0%,100%{opacity:1}
    17%{opacity:.965}
    18%{opacity:1}
    61%{opacity:.98}
    62%{opacity:1}
  }

  #hint{
    margin:0;
    font-size:.68rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:#4d534a;
    transition:opacity .9s ease;
  }
  #hint.fade{opacity:0}

  :fullscreen #stage{padding:0;gap:0}
  :fullscreen #tube{
    width:min(100vw, calc(100dvh * 4 / 3));
    border-radius:0;
    box-shadow:none;
  }
  :fullscreen #hint{display:none}

  @media (prefers-reduced-motion:reduce){
    .roll{animation:none;opacity:.5}
    .vig{animation:none}
    #hint{transition:none}
  }
</style>

<main id="stage">
  <div id="tube" tabindex="0" role="img"
       aria-label="A black and white simulated arcade screen: a Pong rally played inside a full day of weather, with the clock as the score. Twenty-four hours pass every sixty seconds.">
    <canvas id="scr" width="480" height="360"></canvas>
    <div class="lay glass"></div>
    <div class="lay roll"></div>
    <div class="lay scan"></div>
    <div class="lay vig"></div>
  </div>
  <p id="hint">click for full screen &nbsp;·&nbsp; space pauses</p>
</main>

<script>
(() => {
  "use strict";

  const cv = document.getElementById("scr");
  const g  = cv.getContext("2d", { alpha: false });
  const W = cv.width, H = cv.height;

  const PHOS = "230,236,226";
  const ink  = (a) => `rgba(${PHOS},${a})`;

  // Playfield geometry
  const TOP_WALL = 14, BOT_WALL = 322, WALL = 3;
  const PLAY_TOP = TOP_WALL + WALL;
  const PLAY_BOT = BOT_WALL;
  const HORIZON  = BOT_WALL;

  const CYCLE = 60;             // seconds per simulated day
  let simTime = (4.6 / 24) * CYCLE;  // open just before dawn
  let paused = false;

  // ───────────────────────── seeded noise ─────────────────────────
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ───────────────────────── 5×7 bitmap font ─────────────────────────
  const F = {
    "0":["01110","10001","10011","10101","11001","10001","01110"],
    "1":["00100","01100","00100","00100","00100","00100","01110"],
    "2":["01110","10001","00001","00010","00100","01000","11111"],
    "3":["11111","00010","00100","00010","00001","10001","01110"],
    "4":["00010","00110","01010","10010","11111","00010","00010"],
    "5":["11111","10000","11110","00001","00001","10001","01110"],
    "6":["00110","01000","10000","11110","10001","10001","01110"],
    "7":["11111","00001","00010","00100","01000","01000","01000"],
    "8":["01110","10001","10001","01110","10001","10001","01110"],
    "9":["01110","10001","10001","01111","00001","00010","01100"],
    "A":["01110","10001","10001","11111","10001","10001","10001"],
    "B":["11110","10001","10001","11110","10001","10001","11110"],
    "C":["01110","10001","10000","10000","10000","10001","01110"],
    "D":["11100","10010","10001","10001","10001","10010","11100"],
    "E":["11111","10000","10000","11110","10000","10000","11111"],
    "F":["11111","10000","10000","11110","10000","10000","10000"],
    "G":["01110","10001","10000","10111","10001","10001","01111"],
    "H":["10001","10001","10001","11111","10001","10001","10001"],
    "I":["01110","00100","00100","00100","00100","00100","01110"],
    "J":["00111","00010","00010","00010","00010","10010","01100"],
    "K":["10001","10010","10100","11000","10100","10010","10001"],
    "L":["10000","10000","10000","10000","10000","10000","11111"],
    "M":["10001","11011","10101","10101","10001","10001","10001"],
    "N":["10001","11001","11001","10101","10011","10011","10001"],
    "O":["01110","10001","10001","10001","10001","10001","01110"],
    "P":["11110","10001","10001","11110","10000","10000","10000"],
    "Q":["01110","10001","10001","10001","10101","10010","01101"],
    "R":["11110","10001","10001","11110","10100","10010","10001"],
    "S":["01111","10000","10000","01110","00001","00001","11110"],
    "T":["11111","00100","00100","00100","00100","00100","00100"],
    "U":["10001","10001","10001","10001","10001","10001","01110"],
    "V":["10001","10001","10001","10001","10001","01010","00100"],
    "W":["10001","10001","10001","10101","10101","11011","10001"],
    "X":["10001","10001","01010","00100","01010","10001","10001"],
    "Y":["10001","10001","01010","00100","00100","00100","00100"],
    "Z":["11111","00001","00010","00100","01000","10000","11111"],
    " ":["00000","00000","00000","00000","00000","00000","00000"],
    ".":["00000","00000","00000","00000","00000","01100","01100"],
    ":":["00000","01100","01100","00000","01100","01100","00000"],
    "-":["00000","00000","00000","11111","00000","00000","00000"],
    "/":["00001","00010","00010","00100","01000","01000","10000"],
    "%":["11001","11010","00010","00100","01000","01011","10011"],
    "*":["00000","00100","10101","01110","10101","00100","00000"],
    "°":["01100","10010","01100","00000","00000","00000","00000"]
  };

  function text(str, x, y, a = 1, s = 1){
    g.fillStyle = ink(a);
    str = String(str).toUpperCase();
    let cx = Math.round(x);
    for (const ch of str){
      const glyph = F[ch] || F["*"];
      for (let r = 0; r < 7; r++){
        const row = glyph[r];
        for (let c = 0; c < 5; c++){
          if (row[c] === "1") g.fillRect(cx + c * s, Math.round(y) + r * s, s, s);
        }
      }
      cx += 6 * s;
    }
    return cx;
  }
  const textW = (str, s = 1) => String(str).length * 6 * s - s;

  // ───────────────────────── 7-segment clock digits ─────────────────────────
  const SEG = ["abcdef","bc","abged","abgcd","fgbc","afgcd","afgedc","abc","abcdefg","abcfgd"];

  function digit(n, x, y, w, h, th, a){
    const on = SEG[n] || "";
    const half = (h - 3 * th) / 2;
    g.fillStyle = ink(a);
    if (on.includes("a")) g.fillRect(x + th, y, w - 2 * th, th);
    if (on.includes("f")) g.fillRect(x, y + th, th, half);
    if (on.includes("b")) g.fillRect(x + w - th, y + th, th, half);
    if (on.includes("g")) g.fillRect(x + th, y + th + half, w - 2 * th, th);
    if (on.includes("e")) g.fillRect(x, y + 2 * th + half, th, half);
    if (on.includes("c")) g.fillRect(x + w - th, y + 2 * th + half, th, half);
    if (on.includes("d")) g.fillRect(x + th, y + h - th, w - 2 * th, th);
  }

  // ───────────────────────── ordered-dither patterns ─────────────────────────
  const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const patCache = new Map();
  function dither(level){                    // level 0..1 → white coverage
    const k = Math.max(0, Math.min(16, Math.round(level * 16)));
    if (patCache.has(k)) return patCache.get(k);
    const t = document.createElement("canvas");
    t.width = t.height = 4;
    const tg = t.getContext("2d");
    tg.fillStyle = `rgb(${PHOS})`;
    for (let y = 0; y < 4; y++)
      for (let x = 0; x < 4; x++)
        if (BAYER[y][x] < k) tg.fillRect(x, y, 1, 1);
    const p = g.createPattern(t, "repeat");
    patCache.set(k, p);
    return p;
  }

  // ───────────────────────── the scripted day ─────────────────────────
  // One plausible 24 hours: fog at dawn, a clear bright morning, cumulus
  // building through noon, a mid-afternoon thunderstorm, clearing to a
  // calm, cold, star-filled night.
  const DAY = [
    { h: 0,  cloud:.18, rain:0,   fog:.14, wind:.12, temp: 9, storm:0  },
    { h: 3,  cloud:.10, rain:0,   fog:.46, wind:.05, temp: 7, storm:0  },
    { h: 5,  cloud:.14, rain:0,   fog:.62, wind:.06, temp: 6, storm:0  },
    { h: 7,  cloud:.16, rain:0,   fog:.34, wind:.16, temp: 9, storm:0  },
    { h: 9,  cloud:.14, rain:0,   fog:.06, wind:.24, temp:14, storm:0  },
    { h:11,  cloud:.32, rain:0,   fog:0,   wind:.32, temp:18, storm:0  },
    { h:13,  cloud:.58, rain:.04, fog:0,   wind:.48, temp:22, storm:.15},
    { h:15,  cloud:.94, rain:.72, fog:0,   wind:.86, temp:20, storm:.85},
    { h:16,  cloud:.98, rain:1,   fog:0,   wind:.94, temp:17, storm:1  },
    { h:18,  cloud:.60, rain:.22, fog:.12, wind:.46, temp:16, storm:.12},
    { h:20,  cloud:.32, rain:.02, fog:.18, wind:.26, temp:14, storm:0  },
    { h:22,  cloud:.22, rain:0,   fog:.14, wind:.16, temp:11, storm:0  },
    { h:24,  cloud:.18, rain:0,   fog:.14, wind:.12, temp: 9, storm:0  }
  ];
  const KEYS = ["cloud","rain","fog","wind","temp","storm"];
  const smooth = (t) => t * t * (3 - 2 * t);

  function weatherAt(hour){
    let i = 0;
    while (i < DAY.length - 2 && DAY[i + 1].h <= hour) i++;
    const a = DAY[i], b = DAY[i + 1];
    const t = smooth((hour - a.h) / (b.h - a.h));
    const w = {};
    for (const k of KEYS) w[k] = a[k] + (b[k] - a[k]) * t;
    return w;
  }

  const SUNRISE = 6.3, SUNSET = 19.6;
  const DIRS = ["NE","ENE","E","SE","S","SW","W","NW"];

  function condition(w, sun){
    if (w.storm > .5 && w.rain > .45) return "THUNDERSTORM";
    if (w.rain > .5)  return "HEAVY RAIN";
    if (w.rain > .12) return "LIGHT RAIN";
    if (w.fog  > .38) return "FOG";
    if (w.cloud > .78) return "OVERCAST";
    if (w.cloud > .38) return "PARTLY CLOUDY";
    return sun > 0 ? "CLEAR" : "CLEAR NIGHT";
  }

  // ───────────────────────── sky furniture ─────────────────────────
  const starRng = mulberry32(19721129);
  const STARS = Array.from({ length: 80 }, () => ({
    x: Math.round(starRng() * (W - 8)) + 4,
    y: Math.round(PLAY_TOP + 6 + starRng() * (HORIZON - PLAY_TOP - 90)),
    p: starRng() * 6.283,
    b: .35 + starRng() * .65
  }));

  function makeCloud(seed){
    const r = mulberry32(seed);
    const u = 6;
    const cols = 6 + Math.floor(r() * 5);
    const blocks = [{ x: 0, y: 0, w: cols * u, h: u * 2 }];
    for (let i = 0; i < cols - 1; i++){
      const hgt = (1 + Math.floor(r() * 3)) * u;
      if (r() < .78) blocks.push({ x: i * u, y: -hgt, w: u * 2, h: hgt + u });
    }
    return { blocks, w: cols * u };
  }

  const CLOUDS = Array.from({ length: 9 }, (_, i) => {
    const r = mulberry32(4400 + i * 77);
    const c = makeCloud(4400 + i * 77);
    return {
      shape: c,
      x: r() * W,
      y: PLAY_TOP + 24 + r() * 120,
      scale: .8 + r() * 1.5,
      drift: .5 + r() * .9
    };
  });

  const RAIN = Array.from({ length: 300 }, () => {
    const r = Math.random();
    return { x: Math.random() * W, y: PLAY_TOP + Math.random() * (HORIZON - PLAY_TOP), len: 4 + r * 7, sp: .8 + r * .6 };
  });
  const SPLASH = [];

  // ───────────────────────── the rally ─────────────────────────
  const ball = { x: W / 2, y: 170, vx: 130, vy: 55, s: 6, hold: 0 };
  const TRAIL = [];
  const pads = [
    { x: 22,      y: 150, w: 6, h: 40, v: 0 },
    { x: W - 28,  y: 150, w: 6, h: 40, v: 0 }
  ];
  let rallyCount = 0;
  const bolt = { t: 0, flash: 0, pts: [] };

  function serve(dir){
    ball.x = W / 2; ball.y = (PLAY_TOP + PLAY_BOT) / 2;
    ball.vx = dir * 120;
    ball.vy = (Math.random() * 2 - 1) * 70;
    ball.hold = .75;
    TRAIL.length = 0;
  }

  // ───────────────────────── frame ─────────────────────────
  let last = performance.now();

  function frame(now){
    let dt = (now - last) / 1000;
    last = now;
    if (dt > .1) dt = .1;                       // tab was hidden
    if (!paused) simTime += dt; else dt = 0;

    const prog = (simTime % CYCLE) / CYCLE;
    const hour = prog * 24;
    const w = weatherAt(hour);

    // solar elevation: -1 (midnight) .. 1 (noon)
    const dayLen = SUNSET - SUNRISE;
    const sunT = (hour - SUNRISE) / dayLen;
    const sunUp = sunT >= 0 && sunT <= 1;
    const elev = sunUp ? Math.sin(Math.PI * sunT) : -Math.sin(Math.PI * ((hour < SUNRISE ? hour + 24 : hour) - SUNSET) / (24 - dayLen));
    const daylight = Math.max(0, elev) * (1 - .55 * w.cloud);
    const night = Math.max(0, -elev);
    const windX = w.wind * Math.cos(Math.PI * (hour - 15) / 12);

    // ── physics ────────────────────────────────────────────────
    if (dt > 0){
      // lightning
      bolt.flash = Math.max(0, bolt.flash - dt * 3.4);
      bolt.t = Math.max(0, bolt.t - dt);
      if (w.storm > .45 && Math.random() < w.storm * dt * 1.5){
        bolt.flash = .55 + Math.random() * .45;
        bolt.t = .16;
        const bx = 40 + Math.random() * (W - 80);
        bolt.pts = [[bx, PLAY_TOP + 30]];
        let py = PLAY_TOP + 30, px = bx;
        while (py < HORIZON - 10){
          py += 16 + Math.random() * 22;
          px += (Math.random() * 2 - 1) * 20;
          bolt.pts.push([Math.round(px), Math.round(Math.min(py, HORIZON))]);
        }
      }

      // ball: temperature sets pace, wind shoves it, rain drags it down
      if (ball.hold > 0){
        ball.hold -= dt;
      } else {
        const target = 88 + w.temp * 4.2;
        ball.vx += windX * 46 * dt;
        ball.vy += w.rain * 34 * dt;
        const sp = Math.hypot(ball.vx, ball.vy) || 1;
        const k = 1 + (target / sp - 1) * Math.min(1, dt * 1.6);
        ball.vx *= k; ball.vy *= k;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y < PLAY_TOP){ ball.y = PLAY_TOP; ball.vy = Math.abs(ball.vy); }
        if (ball.y + ball.s > PLAY_BOT){ ball.y = PLAY_BOT - ball.s; ball.vy = -Math.abs(ball.vy); }

        for (const p of pads){
          const hit = ball.x + ball.s > p.x && ball.x < p.x + p.w &&
                      ball.y + ball.s > p.y && ball.y < p.y + p.h;
          if (hit){
            const off = ((ball.y + ball.s / 2) - (p.y + p.h / 2)) / (p.h / 2);
            ball.vy = off * 105 + windX * 20;
            ball.vx = Math.abs(ball.vx) * (p.x < W / 2 ? 1 : -1) * 1.03;
            ball.x = p.x < W / 2 ? p.x + p.w : p.x - ball.s;
            rallyCount++;
          }
        }
        if (ball.x < -20) serve(1);
        else if (ball.x > W + 20) serve(-1);

        TRAIL.push({ x: ball.x, y: ball.y });
        if (TRAIL.length > 16) TRAIL.shift();
      }

      // paddles: fog blurs their read of the ball, thunder rattles them
      const shake = bolt.t > 0 ? 1 : 0;
      pads.forEach((p, i) => {
        const incoming = (i === 0 && ball.vx < 0) || (i === 1 && ball.vx > 0);
        const blind = w.fog * 42 + w.storm * 26;
        const wobble = Math.sin(simTime * (2.3 + i * .7) + i * 2.1) * blind;
        const aim = ball.hold > 0 || !incoming
          ? (PLAY_TOP + PLAY_BOT) / 2 - p.h / 2
          : ball.y - p.h / 2 + wobble;
        const speed = 150 + w.temp * 2.4;
        const d = aim - p.y;
        p.y += Math.max(-speed * dt, Math.min(speed * dt, d));
        if (shake) p.y += (Math.random() * 2 - 1) * 3;
        p.y = Math.max(PLAY_TOP, Math.min(PLAY_BOT - p.h, p.y));
      });

      // clouds drift downwind
      for (const c of CLOUDS){
        c.x += windX * c.drift * 26 * dt;
        const span = c.shape.w * c.scale;
        if (c.x > W + span) c.x = -span;
        if (c.x < -span)    c.x = W + span;
      }

      // rain
      const activeRain = Math.floor(w.rain * RAIN.length);
      for (let i = 0; i < activeRain; i++){
        const d = RAIN[i];
        d.y += (250 + d.len * 22) * d.sp * dt;
        d.x += windX * 150 * dt;
        if (d.y > HORIZON){
          if (Math.random() < .25) SPLASH.push({ x: d.x, t: .28 });
          d.y = PLAY_TOP - 8;
          d.x = Math.random() * W;
        }
        if (d.x > W + 10) d.x = -10;
        if (d.x < -10) d.x = W + 10;
      }
      for (let i = SPLASH.length - 1; i >= 0; i--){
        SPLASH[i].t -= dt;
        if (SPLASH[i].t <= 0) SPLASH.splice(i, 1);
      }
    }

    // ── draw ───────────────────────────────────────────────────
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);

    // ambient daylight wash on the sky
    g.fillStyle = ink(.012 + daylight * .075);
    g.fillRect(0, PLAY_TOP, W, PLAY_BOT - PLAY_TOP);

    // horizon glow at dawn and dusk
    const lowSun = Math.max(0, 1 - Math.abs(elev) * 4) * (sunUp ? 1 : .35);
    if (lowSun > .01){
      const grd = g.createLinearGradient(0, HORIZON - 110, 0, HORIZON);
      grd.addColorStop(0, ink(0));
      grd.addColorStop(1, ink(.16 * lowSun * (1 - w.cloud * .5)));
      g.fillStyle = grd;
      g.fillRect(0, HORIZON - 110, W, 110);
    }

    // stars
    const starVis = night * (1 - w.cloud) * (1 - w.fog * .7);
    if (starVis > .02){
      for (const s of STARS){
        const tw = .55 + .45 * Math.sin(simTime * 3 + s.p);
        g.fillStyle = ink(starVis * s.b * tw);
        g.fillRect(s.x, s.y, 1, 1);
      }
    }

    // sun / moon on the same arc, twelve hours apart
    const arc = (frac) => ({
      x: 24 + frac * (W - 48),
      y: HORIZON - Math.sin(Math.PI * frac) * (HORIZON - PLAY_TOP - 46)
    });
    if (sunUp){
      const p = arc(sunT);
      const r = 9 + lowSun * 4;
      const a = (1 - w.cloud * .45) * (.55 + elev * .45);
      g.fillStyle = ink(a);
      g.beginPath(); g.arc(p.x, p.y, r, 0, 6.2832); g.fill();
      g.strokeStyle = ink(a * .5); g.lineWidth = 2;
      for (let i = 0; i < 8; i++){
        const ang = i * Math.PI / 4 + simTime * .12;
        g.beginPath();
        g.moveTo(p.x + Math.cos(ang) * (r + 5), p.y + Math.sin(ang) * (r + 5));
        g.lineTo(p.x + Math.cos(ang) * (r + 10), p.y + Math.sin(ang) * (r + 10));
        g.stroke();
      }
    } else {
      const mt = ((hour + 12) % 24 - SUNRISE) / dayLen;
      if (mt >= 0 && mt <= 1){
        const p = arc(mt);
        const a = (1 - w.cloud * .6) * .8;
        g.fillStyle = ink(a);
        g.beginPath(); g.arc(p.x, p.y, 8, 0, 6.2832); g.fill();
        g.fillStyle = "#000";
        g.beginPath(); g.arc(p.x + 4.5, p.y - 2.5, 7.5, 0, 6.2832); g.fill();
      }
    }

    // clouds — ordered-dither cumulus, denser as cover builds
    const visible = Math.round(w.cloud * CLOUDS.length);
    const dens = .18 + w.cloud * .72;
    CLOUDS.forEach((c, i) => {
      if (i >= visible) return;
      const fade = Math.min(1, (w.cloud * CLOUDS.length) - i);
      g.save();
      g.translate(Math.round(c.x), Math.round(c.y));
      g.scale(c.scale, c.scale);
      g.globalAlpha = fade * (.55 + daylight * .45);
      g.fillStyle = dither(dens);
      for (const b of c.shape.blocks) g.fillRect(b.x, b.y, b.w, b.h);
      g.globalAlpha = fade * (.3 + w.cloud * .5);
      g.fillStyle = ink(1);
      for (const b of c.shape.blocks) g.fillRect(b.x, b.y, b.w, 1);
      g.restore();
    });

    // rain
    if (w.rain > .01){
      g.strokeStyle = ink(.34 + w.rain * .34);
      g.lineWidth = 1;
      g.beginPath();
      const activeRain = Math.floor(w.rain * RAIN.length);
      const lean = windX * .55;
      for (let i = 0; i < activeRain; i++){
        const d = RAIN[i];
        const x = Math.round(d.x), y = Math.round(d.y);
        g.moveTo(x, y);
        g.lineTo(x + lean * d.len, y + d.len);
      }
      g.stroke();
      g.fillStyle = ink(.4);
      for (const s of SPLASH) g.fillRect(Math.round(s.x) - 1, HORIZON - 2, 3, 1);
    }

    // fog — low dithered banks
    if (w.fog > .03){
      g.save();
      g.globalAlpha = w.fog * .5;
      g.fillStyle = dither(.22);
      for (let i = 0; i < 5; i++){
        const bw = 150 + i * 40;
        const bx = ((simTime * (6 + i * 3) + i * 130) % (W + bw)) - bw;
        g.fillRect(Math.round(bx), HORIZON - 26 - i * 17, bw, 11 + i * 2);
      }
      g.restore();
    }

    // ── the cabinet: field, net, clock, paddles, ball ──────────
    g.fillStyle = ink(.9);
    g.fillRect(0, TOP_WALL, W, WALL);
    g.fillRect(0, BOT_WALL, W, WALL);

    g.fillStyle = ink(.5);
    for (let y = PLAY_TOP + 4; y < PLAY_BOT - 6; y += 16) g.fillRect(W / 2 - 2, y, 4, 9);

    // the score is the clock
    const hh = Math.floor(hour) % 24;
    const mm = Math.floor((hour % 1) * 60);
    const DW = 19, DH = 32, TH = 4, GAP = 25;
    const clockA = .34 + daylight * .16;
    digit(Math.floor(hh / 10), W / 2 - 104,       34, DW, DH, TH, clockA);
    digit(hh % 10,             W / 2 - 104 + GAP, 34, DW, DH, TH, clockA);
    digit(Math.floor(mm / 10), W / 2 + 60,        34, DW, DH, TH, clockA);
    digit(mm % 10,             W / 2 + 60 + GAP,  34, DW, DH, TH, clockA);

    // phosphor trail
    const dim = 1 - w.fog * .45;
    TRAIL.forEach((p, i) => {
      const a = (i / TRAIL.length) ** 2.4 * .55 * dim;
      if (a > .01){ g.fillStyle = ink(a); g.fillRect(Math.round(p.x), Math.round(p.y), ball.s, ball.s); }
    });

    g.fillStyle = ink(.95 * dim);
    for (const p of pads) g.fillRect(Math.round(p.x), Math.round(p.y), p.w, Math.round(p.h));
    if (ball.hold <= 0) g.fillRect(Math.round(ball.x), Math.round(ball.y), ball.s, ball.s);

    // ── telemetry ──────────────────────────────────────────────
    text("24 HOUR CYCLE", 6, 4, .38);
    const rl = "60 SECOND LOOP";
    text(rl, W - 6 - textW(rl), 4, .38);

    const kph = Math.round(Math.abs(windX) * 78);
    const dir = DIRS[Math.floor(((hour + 2) / 24) * 8) % 8];
    const cond = condition(w, elev);

    text(`TEMP ${String(Math.round(w.temp)).padStart(2, " ")}°C`, 6, 342, .72);
    const mid = cond;
    text(mid, Math.round((W - textW(mid)) / 2), 342, .9);
    const wind = kph < 4 ? "WIND CALM" : `WIND ${kph} KPH ${dir}`;
    text(wind, W - 6 - textW(wind), 342, .72);

    // day progress with quarter ticks
    const bx0 = 6, bx1 = W - 6;
    g.fillStyle = ink(.2);
    g.fillRect(bx0, 332, bx1 - bx0, 1);
    g.fillStyle = ink(.34);
    for (let q = 0; q <= 4; q++) g.fillRect(Math.round(bx0 + (bx1 - bx0) * q / 4), 329, 1, 4);
    g.fillStyle = ink(.95);
    g.fillRect(Math.round(bx0 + (bx1 - bx0) * prog) - 1, 328, 3, 6);

    // ── lightning, on top of everything ────────────────────────
    if (bolt.t > 0 && bolt.pts.length){
      g.strokeStyle = ink(1); g.lineWidth = 2;
      g.beginPath();
      g.moveTo(bolt.pts[0][0], bolt.pts[0][1]);
      for (const p of bolt.pts) g.lineTo(p[0], p[1]);
      g.stroke();
    }
    if (bolt.flash > .01){
      g.fillStyle = ink(bolt.flash * .5);
      g.fillRect(0, 0, W, H);
    }

    if (paused){
      const s = "PAUSED";
      text(s, Math.round((W - textW(s, 2)) / 2), 160, .8, 2);
    }

    // ── phosphor bloom ─────────────────────────────────────────
    g.save();
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = .5;
    g.filter = "blur(2px)";
    g.drawImage(cv, 0, 0);
    g.restore();
    g.filter = "none";
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // ───────────────────────── controls ─────────────────────────
  const tube = document.getElementById("tube");
  const hint = document.getElementById("hint");

  const goFull = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
  };
  tube.addEventListener("click", goFull);
  tube.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); goFull(); }
  });
  addEventListener("keydown", (e) => {
    if (e.code === "Space"){ e.preventDefault(); paused = !paused; }
  });

  let hintTimer = setTimeout(() => hint.classList.add("fade"), 5000);
  addEventListener("pointermove", () => {
    hint.classList.remove("fade");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add("fade"), 5000);
  }, { passive: true });
})();
</script>
