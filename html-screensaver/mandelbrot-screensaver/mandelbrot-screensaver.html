<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbrot Voyage</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #fractal { z-index: 1; }
  #weather { z-index: 2; pointer-events: none; }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65) 100%);
  }
</style>
</head>
<body>
<canvas id="fractal"></canvas>
<canvas id="weather"></canvas>
<div class="vignette"></div>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("fractal");
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, powerPreference: "high-performance" });

  if (!gl) {
    document.body.style.background = "radial-gradient(ellipse at center, #16213e 0%, #050507 100%)";
    return;
  }

  // ---------------------------------------------------------------------
  // Shaders
  // ---------------------------------------------------------------------
  const vsSource = `#version 300 es
  void main() {
    vec2 pos[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
    gl_Position = vec4(pos[gl_VertexID], 0.0, 1.0);
  }`;

  const fsSource = `#version 300 es
  precision highp float;

  uniform vec2 uResolution;
  uniform vec2 uCenter;
  uniform float uScale;
  uniform float uMaxIter;
  uniform float uHue;
  uniform float uFade;

  out vec4 fragColor;

  vec3 palette(float t, float hue) {
    vec3 a = vec3(0.55, 0.5, 0.5);
    vec3 b = vec3(0.45, 0.45, 0.5);
    vec3 c = vec3(1.0, 1.0, 1.0);
    vec3 d = vec3(0.0, 0.12, 0.25) + hue;
    return a + b * cos(6.28318530718 * (c * t + d));
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
    vec2 c = uCenter + uv * 2.0 * uScale;

    vec2 z = c;
    float n = 0.0;
    bool escaped = false;

    for (int i = 0; i < 1000; i++) {
      if (float(i) >= uMaxIter) break;
      float x2 = z.x * z.x;
      float y2 = z.y * z.y;
      if (x2 + y2 > 65536.0) { n = float(i); escaped = true; break; }
      float xy = z.x * z.y;
      z = vec2(x2 - y2, xy + xy) + c;
    }

    vec3 col;
    if (!escaped) {
      col = vec3(0.0);
    } else {
      float x2 = z.x * z.x, y2 = z.y * z.y;
      float smoothIter = n - log2(log2(x2 + y2)) + 4.0;
      col = palette(smoothIter * 0.025, uHue);
    }

    fragColor = vec4(col * uFade, 1.0);
  }`;

  function compileShader(type, source) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  const vs = compileShader(gl.VERTEX_SHADER, vsSource);
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const uResolution = gl.getUniformLocation(program, "uResolution");
  const uCenter = gl.getUniformLocation(program, "uCenter");
  const uScale = gl.getUniformLocation(program, "uScale");
  const uMaxIter = gl.getUniformLocation(program, "uMaxIter");
  const uHue = gl.getUniformLocation(program, "uHue");
  const uFade = gl.getUniformLocation(program, "uFade");

  // ---------------------------------------------------------------------
  // Fractal navigation state
  // ---------------------------------------------------------------------
  let target = { cx: -0.5, cy: 0.0 };
  let scale = 1.4;
  let zoomRate = 0.12;
  let sessionStart = 0;
  let sessionDuration = 60;
  let hue = 0;
  let mode = "fadein"; // 'zooming' | 'fadeout' | 'fadein'
  let fade = 0;
  let simTime = 0;

  function escapeIter(cx, cy, maxIter) {
    let x = 0, y = 0, x2 = 0, y2 = 0, i = 0;
    while (x2 + y2 <= 4 && i < maxIter) {
      y = 2 * x * y + cy;
      x = x2 - y2 + cx;
      x2 = x * x;
      y2 = y * y;
      i++;
    }
    return i;
  }

  // Rough regions known to sit on richly-detailed boundary of the set.
  const REGIONS = [
    { cx: -0.75, cy: 0.0, r: 0.4 },
    { cx: -0.16, cy: 1.04, r: 0.25 },
    { cx: -1.25, cy: 0.0, r: 0.15 },
    { cx: 0.28, cy: 0.48, r: 0.2 },
    { cx: -1.75, cy: 0.0, r: 0.1 }
  ];

  function pickTarget() {
    let best = null;
    for (let attempt = 0; attempt < 60; attempt++) {
      const region = REGIONS[(Math.random() * REGIONS.length) | 0];
      const cx = region.cx + (Math.random() * 2 - 1) * region.r;
      const cy = region.cy + (Math.random() * 2 - 1) * region.r;
      const it = escapeIter(cx, cy, 400);
      if (it > 40 && it < 380 && (!best || it > best.it)) best = { cx, cy, it };
    }
    if (!best) best = { cx: -0.7436438870371587, cy: 0.1318259042053119, it: 200 };

    // Local hill-climb toward more finely detailed boundary structure.
    let radius = 0.05;
    for (let s = 0; s < 30; s++) {
      const ncx = best.cx + (Math.random() * 2 - 1) * radius;
      const ncy = best.cy + (Math.random() * 2 - 1) * radius;
      const it = escapeIter(ncx, ncy, 400);
      if (it > best.it && it < 400) best = { cx: ncx, cy: ncy, it };
      radius *= 0.92;
    }
    return { cx: best.cx, cy: best.cy };
  }

  function startNewSession() {
    target = pickTarget();
    scale = 1.4 + Math.random() * 0.6;
    zoomRate = 0.1 + Math.random() * 0.08;
    sessionStart = simTime;
    sessionDuration = 45 + Math.random() * 55;
  }
  startNewSession();

  function pan(t) {
    const ax = 0.16 * Math.sin(t * 0.07 + 1.3) + 0.08 * Math.sin(t * 0.191 + 4.1);
    const ay = 0.16 * Math.cos(t * 0.063 + 0.4) + 0.08 * Math.sin(t * 0.173 + 2.7);
    return { ax, ay };
  }

  // ---------------------------------------------------------------------
  // Weather overlay
  // ---------------------------------------------------------------------
  const weatherCanvas = document.getElementById("weather");
  const wctx = weatherCanvas.getContext("2d");
  const WEATHER_TYPES = ["clear", "clouds", "fog", "rain", "snow", "storm"];
  const weights = { clear: 1, clouds: 0, fog: 0, rain: 0, snow: 0, storm: 0 };
  let weatherTarget = "clear";
  let weatherTimer = 20 + Math.random() * 20;
  let lightning = 0;

  const TINTS = {
    clear: [0, 0, 0, 0],
    clouds: [190, 196, 205, 0.10],
    fog: [205, 212, 218, 0.22],
    rain: [55, 70, 95, 0.20],
    snow: [215, 228, 240, 0.14],
    storm: [15, 18, 32, 0.38]
  };

  const rainDrops = Array.from({ length: 180 }, () => ({
    x: Math.random(), y: Math.random(), len: 10 + Math.random() * 14, speed: 500 + Math.random() * 300
  }));
  const snowFlakes = Array.from({ length: 120 }, () => ({
    x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, speed: 20 + Math.random() * 30, phase: Math.random() * Math.PI * 2
  }));
  const clouds = Array.from({ length: 7 }, () => ({
    x: Math.random(), y: Math.random() * 0.4, r: 80 + Math.random() * 160, speed: 3 + Math.random() * 6, o: 0.4 + Math.random() * 0.4
  }));

  function updateWeather(dt) {
    weatherTimer -= dt;
    if (weatherTimer <= 0) {
      let next;
      do { next = WEATHER_TYPES[(Math.random() * WEATHER_TYPES.length) | 0]; } while (next === weatherTarget);
      weatherTarget = next;
      weatherTimer = 25 + Math.random() * 35;
    }
    for (const k of WEATHER_TYPES) {
      const t = k === weatherTarget ? 1 : 0;
      weights[k] += (t - weights[k]) * Math.min(1, dt * 0.25);
    }
    if (weights.storm > 0.3 && Math.random() < weights.storm * 0.01) lightning = 1.0;
    lightning = Math.max(0, lightning - dt * 3.5);
  }

  function updateParticles(dt, w, h) {
    for (const d of rainDrops) {
      d.y += (d.speed * dt) / h;
      if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
    }
    for (const f of snowFlakes) {
      f.y += (f.speed * dt) / h;
      if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
    }
    for (const c of clouds) {
      c.x += (c.speed * dt) / w;
      if (c.x > 1.4) c.x -= 1.4;
    }
  }

  function drawWeather(w, h, fadeAlpha) {
    wctx.clearRect(0, 0, w, h);

    let tr = 0, tg = 0, tb = 0, ta = 0;
    for (const k of WEATHER_TYPES) {
      const [r, g, b, a] = TINTS[k];
      const wgt = weights[k];
      tr += r * wgt * a; tg += g * wgt * a; tb += b * wgt * a; ta += a * wgt;
    }
    if (ta > 0.001) {
      wctx.fillStyle = `rgba(${tr / ta | 0},${tg / ta | 0},${tb / ta | 0},${Math.min(0.45, ta).toFixed(3)})`;
      wctx.fillRect(0, 0, w, h);
    }

    if (weights.clouds > 0.01) {
      for (const c of clouds) {
        const cx = ((c.x * w) % (w + 400)) - 200;
        const cy = c.y * h * 0.5;
        const grad = wctx.createRadialGradient(cx, cy, 0, cx, cy, c.r);
        grad.addColorStop(0, `rgba(230,232,238,${(weights.clouds * c.o * 0.5).toFixed(3)})`);
        grad.addColorStop(1, "rgba(230,232,238,0)");
        wctx.fillStyle = grad;
        wctx.beginPath();
        wctx.arc(cx, cy, c.r, 0, Math.PI * 2);
        wctx.fill();
      }
    }

    if (weights.fog > 0.01) {
      for (let i = 0; i < 3; i++) {
        const band = h * 0.28 * (i + 1) + Math.sin(simTime * 0.05 + i) * 30;
        const grad = wctx.createLinearGradient(0, band - 120, 0, band + 120);
        grad.addColorStop(0, "rgba(220,225,230,0)");
        grad.addColorStop(0.5, `rgba(220,225,230,${(weights.fog * 0.16).toFixed(3)})`);
        grad.addColorStop(1, "rgba(220,225,230,0)");
        wctx.fillStyle = grad;
        wctx.fillRect(0, 0, w, h);
      }
    }

    const rainAmount = weights.rain + weights.storm;
    if (rainAmount > 0.01) {
      wctx.strokeStyle = `rgba(180,200,235,${Math.min(0.6, rainAmount * 0.55).toFixed(3)})`;
      wctx.lineWidth = 1;
      wctx.beginPath();
      for (const d of rainDrops) {
        const px = d.x * w;
        const py = d.y * h;
        wctx.moveTo(px, py);
        wctx.lineTo(px + 2, py + d.len);
      }
      wctx.stroke();
    }

    if (weights.snow > 0.01) {
      wctx.fillStyle = `rgba(255,255,255,${Math.min(0.9, weights.snow * 0.85).toFixed(3)})`;
      for (const f of snowFlakes) {
        const px = f.x * w + Math.sin(simTime + f.phase) * 12;
        const py = f.y * h;
        wctx.beginPath();
        wctx.arc(px, py, f.r, 0, Math.PI * 2);
        wctx.fill();
      }
    }

    if (lightning > 0.01) {
      wctx.fillStyle = `rgba(255,255,255,${(lightning * 0.7).toFixed(3)})`;
      wctx.fillRect(0, 0, w, h);
    }

    if (fadeAlpha < 1) {
      wctx.fillStyle = `rgba(0,0,0,${(1 - fadeAlpha).toFixed(3)})`;
      wctx.fillRect(0, 0, w, h);
    }
  }

  // ---------------------------------------------------------------------
  // Resize
  // ---------------------------------------------------------------------
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  function resize() {
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    weatherCanvas.width = window.innerWidth * dpr;
    weatherCanvas.height = window.innerHeight * dpr;
  }
  window.addEventListener("resize", resize);
  resize();

  window.addEventListener("pointerdown", () => {
    if (mode === "zooming") mode = "fadeout";
  });

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  let lastT = performance.now();

  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    dt = Math.min(dt, 0.1);
    simTime += dt;

    if (mode === "zooming") {
      scale *= Math.exp(-zoomRate * dt);
      if (scale < 2.5e-6 || simTime - sessionStart > sessionDuration) mode = "fadeout";
    } else if (mode === "fadeout") {
      fade -= dt * 0.8;
      if (fade <= 0) { fade = 0; startNewSession(); mode = "fadein"; }
    } else if (mode === "fadein") {
      scale *= Math.exp(-zoomRate * dt);
      fade += dt * 0.8;
      if (fade >= 1) { fade = 1; mode = "zooming"; }
    }

    const { ax, ay } = pan(simTime);
    const aspect = canvas.width / canvas.height;
    const centerX = target.cx + ax * scale * aspect;
    const centerY = target.cy + ay * scale;

    hue = (hue + dt * 0.01) % 1;
    const maxIter = Math.min(600, Math.max(50, 90 + 55 * Math.log2(1 / scale)));

    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform2f(uCenter, centerX, centerY);
    gl.uniform1f(uScale, scale);
    gl.uniform1f(uMaxIter, maxIter);
    gl.uniform1f(uHue, hue);
    gl.uniform1f(uFade, fade);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    updateWeather(dt);
    updateParticles(dt, weatherCanvas.width, weatherCanvas.height);
    drawWeather(weatherCanvas.width, weatherCanvas.height, fade);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
