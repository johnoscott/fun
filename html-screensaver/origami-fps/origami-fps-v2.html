<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Front v2</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ================================================================
   PAPER FRONT — an origami toy-battlefield FPS screensaver
   One full day (sunrise → sunset → night) every 60 seconds.
   Click: fullscreen · H: toggle HUD
   ================================================================ */

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W = 0, H = 0, F = 0, DPR = 1, H0 = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  F = Math.min(H * 1.0, W * 0.75);
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const hx = s => [parseInt(s.slice(1, 3), 16) / 255, parseInt(s.slice(3, 5), 16) / 255, parseInt(s.slice(5, 7), 16) / 255];
const c255 = v => v <= 0 ? 0 : v >= 1 ? 255 : (v * 255) | 0;
const css = (c, a) => a === undefined ? `rgb(${c255(c[0])},${c255(c[1])},${c255(c[2])})` : `rgba(${c255(c[0])},${c255(c[1])},${c255(c[2])},${a})`;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
function hash(x, z) { const h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return h - Math.floor(h); }

const P = {
  tan: hx('#c9a56c'), green: hx('#5f8d3e'), red: hx('#e0574a'), yel: hx('#f2c24f'), blue: hx('#4c7fc4'),
  mint: hx('#6cc08b'), pink: hx('#f29bb5'), white: hx('#f3eee3'), brown: hx('#8a5a3a'), gray: hx('#80848b'),
  dark: hx('#3c3f45'), orange: hx('#ff7b22'), navy: hx('#2f4d86'), beige: hx('#e8c9a2'), purple: hx('#9a7fd1'),
  leaf1: hx('#4f9a4a'), leaf2: hx('#3d7f45'), leaf3: hx('#7bb35a'), sakura: hx('#f6b3c8')
};

/* ---------- mesh builders (convex parts, auto-oriented outward) ---------- */
function convex(verts, faces, col, dbl) {
  let cx = 0, cy = 0, cz = 0;
  for (const v of verts) { cx += v[0]; cy += v[1]; cz += v[2]; }
  cx /= verts.length; cy /= verts.length; cz /= verts.length;
  const out = [];
  for (const f of faces) for (let i = 1; i < f.length - 1; i++) {
    let a = verts[f[0]], b = verts[f[i]], c = verts[f[i + 1]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const mx = (a[0] + b[0] + c[0]) / 3 - cx, my = (a[1] + b[1] + c[1]) / 3 - cy, mz = (a[2] + b[2] + c[2]) / 3 - cz;
    if (nx * mx + ny * my + nz * mz < 0) { const t = b; b = c; c = t; }
    out.push({ v: [a, b, c], col, jit: 0.92 + Math.random() * 0.13, dbl: !!dbl });
  }
  return out;
}
function box(w, h, d, col, x = 0, y = 0, z = 0) {
  const v = [];
  for (let i = 0; i < 8; i++) v.push([x + (i & 1 ? w / 2 : -w / 2), y + (i & 2 ? h : 0), z + (i & 4 ? d / 2 : -d / 2)]);
  return convex(v, [[0, 2, 6, 4], [1, 3, 7, 5], [0, 1, 5, 4], [2, 3, 7, 6], [0, 1, 3, 2], [4, 5, 7, 6]], col);
}
function frustum(n, r0, r1, h, col, x = 0, y = 0, z = 0, rot = 0) {
  const v = [], f = [];
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; v.push([x + Math.cos(a) * r0, y, z + Math.sin(a) * r0]); }
  const ring = [...Array(n).keys()];
  if (r1 > 0) {
    for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; v.push([x + Math.cos(a) * r1, y + h, z + Math.sin(a) * r1]); }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; f.push([i, j, n + j, n + i]); }
    f.push(ring.map(i => n + i));
  } else {
    v.push([x, y + h, z]);
    for (let i = 0; i < n; i++) f.push([i, (i + 1) % n, n]);
  }
  f.push(ring);
  return convex(v, f, col);
}
function octa(r, col, x, y, z) {
  const v = [[x + r, y, z], [x - r, y, z], [x, y + r * 1.15, z], [x, y - r * 1.15, z], [x, y, z + r], [x, y, z - r]];
  return convex(v, [[0, 2, 4], [4, 2, 1], [1, 2, 5], [5, 2, 0], [0, 4, 3], [4, 1, 3], [1, 5, 3], [5, 0, 3]], col);
}
const flat = (a, b, c, col) => ({ v: [a, b, c], col, jit: 0.92 + Math.random() * 0.13, dbl: true });

/* ---------- toy models (local space, y up from ground, facing +z) ---------- */
function mSoldier(c) {
  const d = mul(c, .8), l = mix3(c, [1, 1, 1], .14);
  return [
    ...frustum(4, .2, .34, .85, d, 0, 0, 0, Math.PI / 4),
    ...frustum(4, .38, .27, .62, c, 0, .85, 0, Math.PI / 4),
    ...octa(.2, l, 0, 1.68, 0),
    ...frustum(4, .34, 0, .34, d, 0, 1.79, 0, 0),
    ...box(.13, .13, .42, c, .27, 1.05, .12),
    ...box(.13, .13, .42, c, -.25, 1.05, .1),
    ...box(.08, .08, 1.05, mul(c, .58), .3, 1.16, .34)
  ];
}
function mTank(c) {
  const d = mul(c, .55);
  return [
    ...box(.55, .62, 3.4, d, -1.15, 0, 0), ...box(.55, .62, 3.4, d, 1.15, 0, 0),
    ...box(1.9, .62, 3.0, c, 0, .42, 0),
    ...frustum(6, .9, .66, .52, mul(c, .92), 0, 1.04, -.2, Math.PI / 6),
    ...box(.2, .2, 1.9, mul(c, .7), 0, 1.2, 1.25),
    ...box(.3, .3, .25, mul(c, .6), 0, 1.15, 2.2)
  ];
}
function mTree() {
  const sak = Math.random() < .22;
  const g = sak ? [P.sakura, hx('#ee9db7'), hx('#fbd0dc')] : [pick([P.leaf1, P.leaf3]), P.leaf2, pick([P.leaf3, P.leaf1])];
  const s = rnd(.8, 1.35);
  return [
    ...box(.3 * s, 1.1 * s, .3 * s, P.brown, 0, 0, 0),
    ...frustum(6, 1.45 * s, 0, 1.6 * s, g[0], 0, .8 * s, 0, rnd(6)),
    ...frustum(6, 1.1 * s, 0, 1.4 * s, g[1], 0, 1.65 * s, 0, rnd(6)),
    ...frustum(6, .72 * s, 0, 1.15 * s, g[2], 0, 2.45 * s, 0, rnd(6))
  ];
}
function mBlocks() {
  const cols = [P.red, P.yel, P.blue, P.mint, P.purple, P.orange], s = 1.15, out = [];
  const k = Math.random();
  const cube = (x, y, z) => out.push(...box(s, s, s, pick(cols), x, y, z));
  if (k < .33) cube(0, 0, 0);
  else if (k < .7) { cube(-s, 0, 0); cube(0, 0, 0); cube(s, 0, 0); cube(-s / 2, s, 0); cube(s / 2, s, 0); if (Math.random() < .5) cube(0, 2 * s, 0); }
  else { cube(0, 0, 0); cube(.12, s, .08); cube(-.06, 2 * s, -.05); }
  return out;
}
function mTent(c) {
  return [...frustum(4, 1.9, 0, 1.9, c, 0, 0, 0, 0), ...frustum(4, .5, 0, .5, mul(c, .6), 0, 1.75, 0, 0)];
}
function mFlag(c) {
  return [...box(.08, 3.3, .08, P.gray, 0, 0, 0),
    flat([0, 3.2, 0], [0, 2.4, 0], [1.25, 2.8, .12], c), ...octa(.09, P.yel, 0, 3.35, 0)];
}
function mPlane(c) {
  const N = [0, 0, 1.2], L = [-.8, .06, -.6], R = [.8, .06, -.6], C = [0, 0, -.6], K = [0, -.32, -.6];
  return [flat(N, L, C, c), flat(N, C, R, mul(c, .94)), flat(N, C, K, mul(c, .8))];
}
function mGun() {
  const body = hx('#3d6fb6'), dk = hx('#2a4f88'), skin = P.beige, sleeve = hx('#56743a');
  return [
    ...box(.13, .16, .55, body, 0, -.05, .05),
    ...box(.07, .045, .42, dk, 0, .11, .06),
    ...box(.075, .075, .46, P.gray, 0, .0, .5),
    ...box(.095, .095, .08, P.orange, 0, -.01, .76),
    ...frustum(4, .035, 0, .07, P.orange, 0, .155, .27, Math.PI / 4),
    ...box(.09, .24, .11, dk, 0, -.27, -.12),
    ...box(.075, .21, .09, P.yel, 0, -.24, .16),
    ...box(.16, .13, .17, skin, 0, -.25, -.12),
    ...box(.21, .21, .42, sleeve, .015, -.34, -.42),
    ...box(.12, .1, .14, skin, -.01, -.06, .34)
  ];
}

/* ---------- fold layout: map every triangle of a model onto a flat paper sheet ---------- */
function prepFold(tris, sheetCol) {
  const n = tris.length, cells = Math.ceil(n / 2), cols = Math.ceil(Math.sqrt(cells)), rows = Math.ceil(cells / cols);
  const S = 2.1, cw = S / cols, ch = S / rows, cl = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cl.push({ c, r, d: Math.hypot(c + .5 - cols / 2, r + .5 - rows / 2) + Math.random() * .3 });
  cl.sort((a, b) => a.d - b.d);
  const ys = tris.map(t => (t.v[0][1] + t.v[1][1] + t.v[2][1]) / 3);
  const idx = tris.map((_, i) => i).sort((a, b) => ys[a] - ys[b]);
  const paper = mix3(sheetCol, [1, .99, .96], .62);
  idx.forEach((ti, k) => {
    const t = tris[ti], cell = cl[k >> 1], x0 = -S / 2 + cell.c * cw, z0 = -S / 2 + cell.r * ch, y = .03;
    const p00 = [x0, y, z0], p10 = [x0 + cw, y, z0], p11 = [x0 + cw, y, z0 + ch], p01 = [x0, y, z0 + ch];
    t.flat = k & 1 ? [p00, p11, p01] : [p00, p10, p11];
    t.ord = k / Math.max(1, n - 1); // bottom pieces fold first, hat last
    t.paper = paper;
  });
}

/* ---------- terrain ---------- */
const G = 5, HALF = 17, ROWS = 22;
function th(ix, iz) {
  const x = ix * G, z = iz * G;
  return .9 * Math.sin(x * .07 + 1.3) * Math.cos(z * .05) + .6 * Math.sin(z * .11 + x * .03) + (hash(ix, iz) - .5) * .8;
}
function groundH(x, z) {
  const gx = x / G, gz = z / G, ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const h00 = th(ix, iz), h10 = th(ix + 1, iz), h01 = th(ix, iz + 1), h11 = th(ix + 1, iz + 1);
  return fx > fz ? h00 + fx * (h10 - h00) + fz * (h11 - h10) : h00 + fz * (h01 - h00) + fx * (h11 - h01);
}
const pathX = z => 3 * Math.sin(z * .0192);

/* ---------- camera / projection ---------- */
const NEAR = 0.08;
const cam = { x: 0, y: 2, z: 0, yaw: 0, c: 1, s: 0 };
function toCam(x, y, z) { const dx = x - cam.x, dz = z - cam.z; return [dx * cam.c - dz * cam.s, y - cam.y, dx * cam.s + dz * cam.c]; }
function proj(q) { return q[2] < NEAR ? null : [W / 2 + F * q[0] / q[2], H0 - F * q[1] / q[2]]; }

const SX = new Float64Array(8), SY = new Float64Array(8);
function poly(pts, color) {
  const n = pts.length; let m = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], ai = a[2] >= NEAR, bi = b[2] >= NEAR;
    if (ai) { SX[m] = W / 2 + F * a[0] / a[2]; SY[m] = H0 - F * a[1] / a[2]; m++; }
    if (ai !== bi) {
      const t = (NEAR - a[2]) / (b[2] - a[2]), x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
      SX[m] = W / 2 + F * x / NEAR; SY[m] = H0 - F * y / NEAR; m++;
    }
  }
  if (m < 3) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < m; i++) { if (SX[i] < x0) x0 = SX[i]; if (SX[i] > x1) x1 = SX[i]; if (SY[i] < y0) y0 = SY[i]; if (SY[i] > y1) y1 = SY[i]; }
  if (x1 < -20 || x0 > W + 20 || y1 < -20 || y0 > H + 20) return;
  ctx.beginPath(); ctx.moveTo(SX[0], SY[0]);
  for (let i = 1; i < m; i++) ctx.lineTo(SX[i], SY[i]);
  ctx.closePath(); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.fill(); ctx.stroke();
}

/* ---------- environment / lighting ---------- */
const E = {};
const WX = { cloud: .1, rain: 0, storm: 0, snow: 0, fog: 0, wind: .3 };
const WSTATES = {
  clear: { cloud: .12, label: 'Clear', icon: '☀' }, cloudy: { cloud: .7, label: 'Overcast', icon: '☁' },
  rain: { cloud: .88, rain: 1, label: 'Rain', icon: '☂' }, storm: { cloud: 1, rain: 1, storm: 1, label: 'Thunderstorm', icon: 'ϟ' },
  snow: { cloud: .72, snow: 1, label: 'Paper Snow', icon: '❄' }, fog: { cloud: .38, fog: 1, label: 'Fog', icon: '≋' }
};
let weather = new URLSearchParams(location.search).get('w') || 'clear', weatherT = 22, windT = .3, snowCover = 0, wet = 0;
if (WSTATES[weather] && weather !== 'clear') for (const k of ['cloud', 'rain', 'storm', 'snow', 'fog']) WX[k] = WSTATES[weather][k] || 0;

function computeEnv(p) {
  const a = 2 * Math.PI * (p - .25), el = Math.sin(a);
  E.el = el;
  E.L = norm([-Math.cos(a) * .9, el, .55]);
  E.M = norm([Math.cos(a) * .9, -el, .55]);
  const day = smooth(-.12, .35, el); E.day = day;
  const cl = WX.cloud, stm = WX.storm;
  E.sunI = smooth(-.06, .25, el) * (1 - .7 * cl);
  E.warm = smooth(.02, .45, el);
  E.sunC = mix3([1, .55, .32], [1, .96, .88], E.warm);
  E.moonI = smooth(-.02, -.3, el) * .6 * (1 - .6 * cl);
  E.moonC = [.62, .72, 1];
  const twi = 1 - clamp(Math.abs(el) / .28, 0, 1);
  E.amb = mix3(mix3([.42, .5, .9], [.8, .86, .98], day), [1, .72, .66], twi * .45);
  E.ambI = (.3 + .42 * day) * (1 - .28 * stm);
  // sky keyframes
  const N = [[.03, .05, .14], [.1, .14, .28]], T = [[.18, .2, .42], [.98, .52, .33]],
        Gd = [[.32, .52, .85], [1, .8, .62]], D = [[.24, .53, .9], [.74, .87, .98]];
  let k0, k1, t;
  if (el < -.2) { k0 = N; k1 = N; t = 0; }
  else if (el < 0) { k0 = N; k1 = T; t = smooth(-.2, 0, el); }
  else if (el < .15) { k0 = T; k1 = Gd; t = smooth(0, .15, el); }
  else { k0 = Gd; k1 = D; t = smooth(.15, .45, el); }
  let top = mix3(k0[0], k1[0], t), hor = mix3(k0[1], k1[1], t);
  const gray = c => { const l = (c[0] + c[1] + c[2]) / 3; return [l * .96, l * .98, l * 1.03]; };
  top = mix3(top, gray(top), cl * .78); hor = mix3(hor, gray(hor), cl * .7);
  top = mul(top, 1 - .5 * stm); hor = mul(hor, 1 - .4 * stm);
  E.top = top; E.hor = hor;
  E.fog = mix3(hor, gray(hor), .25 + WX.fog * .4);
  E.fogD = .011 + WX.fog * .05 + WX.rain * .01 + WX.snow * .012;
}

function shade(col, nx, ny, nz, jit, depth) {
  let d = nx * E.L[0] + ny * E.L[1] + nz * E.L[2]; d = d > 0 ? d * E.sunI : 0;
  let m = nx * E.M[0] + ny * E.M[1] + nz * E.M[2]; m = m > 0 ? m * E.moonI : 0;
  const a = E.ambI * (.6 + .4 * ny) + E.flash;
  const f = 1 - Math.exp(-depth * E.fogD);
  const r = lerp(col[0] * (E.amb[0] * a + E.sunC[0] * d + E.moonC[0] * m + E.flashC[0]) * jit, E.fog[0], f);
  const g = lerp(col[1] * (E.amb[1] * a + E.sunC[1] * d + E.moonC[1] * m + E.flashC[1]) * jit, E.fog[1], f);
  const b = lerp(col[2] * (E.amb[2] * a + E.sunC[2] * d + E.moonC[2] * m + E.flashC[2]) * jit, E.fog[2], f);
  return `rgb(${c255(r)},${c255(g)},${c255(b)})`;
}

/* prepare a world-space triangle → camera space + colour, with back-face culling */
function prep(a, b, c, col, jit, dbl, out) {
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  const mx = (a[0] + b[0] + c[0]) / 3 - cam.x, my = (a[1] + b[1] + c[1]) / 3 - cam.y, mz = (a[2] + b[2] + c[2]) / 3 - cam.z;
  if (nx * mx + ny * my + nz * mz > 0) { if (!dbl) return; nx = -nx; ny = -ny; nz = -nz; }
  const A = toCam(a[0], a[1], a[2]), B = toCam(b[0], b[1], b[2]), C = toCam(c[0], c[1], c[2]);
  if (A[2] < NEAR && B[2] < NEAR && C[2] < NEAR) return;
  const d = (A[2] + B[2] + C[2]) / 3;
  out.push({ p: [A, B, C], d, color: shade(col, nx, ny, nz, jit, Math.max(d, 0)) });
}

/* ---------- world objects ---------- */
const NAMES_E = ['Pvt. Crease', 'Cpl. Fold', 'Sgt. Pleat', 'Lt. Valley', 'Pvt. Crinkle', 'Cpt. Kami', 'Pvt. Tuck', 'Maj. Mountainfold', 'Pvt. Squash', 'Cpl. Petal', 'Sgt. Sink', 'Pvt. Waterbomb', 'Pvt. Dogear', 'Lt. Reverse'];
const NAMES_A = ['Pvt. Nori', 'Sgt. Washi', 'Cpl. Tissue', 'Pvt. Cardstock', 'Lt. Vellum', 'Pvt. Glossy'];

function xf(o, v) {
  let x = v[0] * o.s, y = v[1] * o.s, z = v[2] * o.s;
  if (o.roll) { const c = Math.cos(o.roll), s = Math.sin(o.roll), nx = x * c - y * s; y = x * s + y * c; x = nx; }
  if (o.tilt) { const c = Math.cos(o.tilt), s = Math.sin(o.tilt), ny = y * c - z * s; z = y * s + z * c; y = ny; }
  return [x * o.cy + z * o.sy + o.x, y + o.y, -x * o.sy + z * o.cy + o.z];
}

const objs = [], planes = [];
function build(o) {
  switch (o.type) {
    case 'tree': o.tris = mTree(); break;
    case 'blocks': o.tris = mBlocks(); break;
    case 'enemy': if (!o.tris) { o.tris = mSoldier(P.tan); prepFold(o.tris, P.tan); } break;
    case 'ally': o.tris = o.tris || mSoldier(P.green); break;
    case 'tank': o.tris = o.tris || mTank(o.team === 'e' ? P.tan : P.green); break;
    case 'tent': o.tris = mTent(pick([P.tan, P.green, P.white, P.pink])); break;
    case 'flag': o.tris = mFlag(pick([P.red, P.blue, P.yel])); break;
  }
}
const SPREAD = { tree: [6, 60], blocks: [5, 40], enemy: [3, 26], ally: [3.5, 12], tank: [9, 34], tent: [12, 46], flag: [7, 30] };
function place(o, init) {
  const z0 = init ? cam.z + (o.type === 'enemy' ? 14 : o.type === 'ally' ? -2 : 4) : cam.z + 96;

function drawWeather(dt) {

function drawGun(walk) {

    ctx.globalAlpha = a;
    ctx.font = `700 ${u * 1.8}px ${FONT}`;
    const s = `${f.a}  ${f.sym}  ${f.b}`, w = ctx.measureText(s).width + u * 3;
    card(W - u * 2.5 - w + slide, fy, w, u * 3.6, .01, f.a === 'You' ? '#fff3c9' : '#f5f0e4');
    txt(f.a, W - u * 2.5 - w + slide + u * 1.5, fy + u * 1.85, u * 1.8, f.a === 'You' ? '#b5651d' : '#4f7a32');
    ctx.font = `700 ${u * 1.8}px ${FONT}`;
    const wa = ctx.measureText(f.a + '  ').width;
    txt(f.sym + '  ' + f.b, W - u * 2.5 - w + slide + u * 1.5 + wa, fy + u * 1.85, u * 1.8, '#3a342c');
    ctx.globalAlpha = 1; fy += u * 4.4;
  }

  // health
  const hy = H - u * 9.5;
  card(u * 2.5, hy, u * 26, u * 7, .015);
  txt('✚', u * 4.5, hy + u * 3.6, u * 3.2, S.health < 35 ? '#c0392b' : '#4f7a32', 'left', 900);
  txt(String(Math.round(S.health)), u * 9, hy + u * 3.6, u * 3.6, '#2f2a24', 'left', 800);
  ctx.fillStyle = 'rgba(60,50,40,.18)'; ctx.fillRect(u * 16.5, hy + u * 3, u * 10, u * 1.2);
  ctx.fillStyle = S.health < 35 ? '#d9534f' : '#6aa84f'; ctx.fillRect(u * 16.5, hy + u * 3, u * 10 * S.health / 100, u * 1.2);
  // kills
  card(u * 2.5, hy - u * 5.2, u * 12, u * 4, -.02, '#fff3c9');
  txt('✂ ' + S.kills + ' folded', u * 3.8, hy - u * 3.1, u * 1.8, '#8a5a20');

  // ammo
  const aw = u * 19, ax = W - aw - u * 2.5, ay = H - u * 9.5;
  card(ax, ay, aw, u * 7, -.015);
  if (S.reload > 0) txt('REFOLDING…', ax + aw / 2, ay + u * 3.6, u * 2.2, '#b5651d', 'center', 800);
  else {
    txt(String(S.ammo), ax + u * 1.8, ay + u * 3.6, u * 3.8, '#2f2a24', 'left', 800);
    txt('/ 30', ax + u * 8.2, ay + u * 4.1, u * 1.8, '#8a7c66', 'left', 700);
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i < Math.ceil(S.ammo / 3) ? '#e8a33c' : 'rgba(60,50,40,.18)'; ctx.fillRect(ax + u * 12.5 + (i % 5) * u * 1.15, ay + u * (i < 5 ? 2.1 : 3.9), u * .8, u * 1.3); }
  }

  if (hintT < 7) {
    ctx.globalAlpha = 1 - smooth(5, 7, hintT);
    txt('click for fullscreen · H toggles HUD', W / 2, H - u * 3, u * 1.8, 'rgba(255,250,240,.9)', 'center', 600);
    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  let dt = (now - last) / 1000; last = now; dt = Math.min(dt, .05);
  const walk = update(dt);
  const total = T / DAY_LEN + START_P, p = total % 1, day = Math.floor(total) + 1;
  computeEnv(p);
  E.flash = S.lightFlash * (.35 + .6 * (1 - E.day)) * .5 + S.lightning * .7;
  E.flashC = [S.lightFlash * .45 * (1 - E.day * .7), S.lightFlash * .3 * (1 - E.day * .7), S.lightFlash * .1 * (1 - E.day * .7)];

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineWidth = 1;
  const sh = S.shake * H * .008;
  ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
  drawSky(p);
  drawWorld();
  drawWeather(dt);
  drawGun(walk);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // lightning / hurt / vignette / grain
  if (S.lightning > 0) { ctx.fillStyle = `rgba(230,238,255,${S.lightning * .35})`; ctx.fillRect(0, 0, W, H); }
  if (S.hurt > 0 || S.health < 35) {
    const a = Math.max(S.hurt * .55, (35 - S.health) / 35 * .35);
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .95);
    g.addColorStop(0, 'rgba(200,30,30,0)'); g.addColorStop(1, `rgba(200,30,30,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,8,20,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .55;
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawHUD(p, day);
  requestAnimationFrame(frame);
}

addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') hud = !hud; });
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
