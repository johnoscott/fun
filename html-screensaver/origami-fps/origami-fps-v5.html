<script>
'use strict';
/* ================================================================
   PAPER FRONT — an origami toy-battlefield FPS screensaver
   One full day (sunrise → sunset → night) every 60 seconds.
   Click: fullscreen · H: toggle HUD
   ================================================================ */

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W = 0, H = 0, F = 0, DPR = 1, H0 = 0, HG = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  F = Math.min(H * 1.0, W * 0.75);
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const hx = s => [parseInt(s.slice(1, 3), 16) / 255, parseInt(s.slice(3, 5), 16) / 255, parseInt(s.slice(5, 7), 16) / 255];
const c255 = v => v <= 0 ? 0 : v >= 1 ? 255 : (v * 255) | 0;
const css = (c, a) => a === undefined ? `rgb(${c255(c[0])},${c255(c[1])},${c255(c[2])})` : `rgba(${c255(c[0])},${c255(c[1])},${c255(c[2])},${a})`;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
function hash(x, z) { const h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return h - Math.floor(h); }

const P = {
  tan: hx('#c9a56c'), green: hx('#5f8d3e'), red: hx('#e0574a'), yel: hx('#f2c24f'), blue: hx('#4c7fc4'),
  mint: hx('#6cc08b'), pink: hx('#f29bb5'), white: hx('#f3eee3'), brown: hx('#8a5a3a'), gray: hx('#80848b'),
  dark: hx('#3c3f45'), orange: hx('#ff7b22'), navy: hx('#2f4d86'), beige: hx('#e8c9a2'), purple: hx('#9a7fd1'),
  leaf1: hx('#4f9a4a'), leaf2: hx('#3d7f45'), leaf3: hx('#7bb35a'), sakura: hx('#f6b3c8')
};

/* ---------- mesh builders (convex parts, auto-oriented outward) ---------- */
function convex(verts, faces, col, dbl) {
  let cx = 0, cy = 0, cz = 0;
  for (const v of verts) { cx += v[0]; cy += v[1]; cz += v[2]; }
  cx /= verts.length; cy /= verts.length; cz /= verts.length;
  const out = [];
  for (const f of faces) for (let i = 1; i < f.length - 1; i++) {
    let a = verts[f[0]], b = verts[f[i]], c = verts[f[i + 1]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const mx = (a[0] + b[0] + c[0]) / 3 - cx, my = (a[1] + b[1] + c[1]) / 3 - cy, mz = (a[2] + b[2] + c[2]) / 3 - cz;
    if (nx * mx + ny * my + nz * mz < 0) { const t = b; b = c; c = t; }
    out.push({ v: [a, b, c], col, jit: 0.92 + Math.random() * 0.13, dbl: !!dbl });
  }
  return out;
}
function box(w, h, d, col, x = 0, y = 0, z = 0) {
  const v = [];
  for (let i = 0; i < 8; i++) v.push([x + (i & 1 ? w / 2 : -w / 2), y + (i & 2 ? h : 0), z + (i & 4 ? d / 2 : -d / 2)]);
  return convex(v, [[0, 2, 6, 4], [1, 3, 7, 5], [0, 1, 5, 4], [2, 3, 7, 6], [0, 1, 3, 2], [4, 5, 7, 6]], col);
}
function frustum(n, r0, r1, h, col, x = 0, y = 0, z = 0, rot = 0) {
  const v = [], f = [];
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; v.push([x + Math.cos(a) * r0, y, z + Math.sin(a) * r0]); }
  const ring = [...Array(n).keys()];
  if (r1 > 0) {
    for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; v.push([x + Math.cos(a) * r1, y + h, z + Math.sin(a) * r1]); }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; f.push([i, j, n + j, n + i]); }
    f.push(ring.map(i => n + i));
  } else {
    v.push([x, y + h, z]);
    for (let i = 0; i < n; i++) f.push([i, (i + 1) % n, n]);
  }
  f.push(ring);
  return convex(v, f, col);
}
function octa(r, col, x, y, z) {
  const v = [[x + r, y, z], [x - r, y, z], [x, y + r * 1.15, z], [x, y - r * 1.15, z], [x, y, z + r], [x, y, z - r]];
  return convex(v, [[0, 2, 4], [4, 2, 1], [1, 2, 5], [5, 2, 0], [0, 4, 3], [4, 1, 3], [1, 5, 3], [5, 0, 3]], col);
}
const flat = (a, b, c, col) => ({ v: [a, b, c], col, jit: 0.92 + Math.random() * 0.13, dbl: true });

/* ---------- toy models (local space, y up from ground, facing +z) ---------- */
function mSoldier(c) {
  const d = mul(c, .8), l = mix3(c, [1, 1, 1], .14);
  return [
    ...frustum(4, .2, .34, .85, d, 0, 0, 0, Math.PI / 4),
    ...frustum(4, .38, .27, .62, c, 0, .85, 0, Math.PI / 4),
    ...octa(.2, l, 0, 1.68, 0),
    ...frustum(4, .34, 0, .34, d, 0, 1.79, 0, 0),
    ...box(.13, .13, .42, c, .27, 1.05, .12),
    ...box(.13, .13, .42, c, -.25, 1.05, .1),
    ...box(.08, .08, 1.05, mul(c, .58), .3, 1.16, .34)
  ];
}
function mTank(c) {
  const d = mul(c, .55);
  return [
    ...box(.55, .62, 3.4, d, -1.15, 0, 0), ...box(.55, .62, 3.4, d, 1.15, 0, 0),
    ...box(1.9, .62, 3.0, c, 0, .42, 0),
    ...frustum(6, .9, .66, .52, mul(c, .92), 0, 1.04, -.2, Math.PI / 6),
    ...box(.2, .2, 1.9, mul(c, .7), 0, 1.2, 1.25),
    ...box(.3, .3, .25, mul(c, .6), 0, 1.15, 2.2)
  ];
}
function mTree() {
  const sak = Math.random() < .22;
  const g = sak ? [P.sakura, hx('#ee9db7'), hx('#fbd0dc')] : [pick([P.leaf1, P.leaf3]), P.leaf2, pick([P.leaf3, P.leaf1])];
  const s = rnd(.8, 1.35);
  return [
    ...box(.3 * s, 1.1 * s, .3 * s, P.brown, 0, 0, 0),
    ...frustum(6, 1.45 * s, 0, 1.6 * s, g[0], 0, .8 * s, 0, rnd(6)),
    ...frustum(6, 1.1 * s, 0, 1.4 * s, g[1], 0, 1.65 * s, 0, rnd(6)),
    ...frustum(6, .72 * s, 0, 1.15 * s, g[2], 0, 2.45 * s, 0, rnd(6))
  ];
}
function mBlocks() {
  const cols = [P.red, P.yel, P.blue, P.mint, P.purple, P.orange], s = 1.15, out = [];
  const k = Math.random();
  const cube = (x, y, z) => out.push(...box(s, s, s, pick(cols), x, y, z));
  if (k < .33) cube(0, 0, 0);
  else if (k < .7) { cube(-s, 0, 0); cube(0, 0, 0); cube(s, 0, 0); cube(-s / 2, s, 0); cube(s / 2, s, 0); if (Math.random() < .5) cube(0, 2 * s, 0); }
  else { cube(0, 0, 0); cube(.12, s, .08); cube(-.06, 2 * s, -.05); }
  return out;
}
function mTent(c) {
  return [...frustum(4, 1.9, 0, 1.9, c, 0, 0, 0, 0), ...frustum(4, .5, 0, .5, mul(c, .6), 0, 1.75, 0, 0)];
}
function mFlag(c) {
  return [...box(.08, 3.3, .08, P.gray, 0, 0, 0),
    flat([0, 3.2, 0], [0, 2.4, 0], [1.25, 2.8, .12], c), ...octa(.09, P.yel, 0, 3.35, 0)];
}
function mPlane(c) {
  const N = [0, 0, 1.2], L = [-.8, .06, -.6], R = [.8, .06, -.6], C = [0, 0, -.6], K = [0, -.32, -.6];
  return [flat(N, L, C, c), flat(N, C, R, mul(c, .94)), flat(N, C, K, mul(c, .8))];
}
function mGun() {
  const body = hx('#3d6fb6'), dk = hx('#2a4f88'), skin = P.beige, sleeve = hx('#56743a');
  return [
    ...box(.13, .16, .55, body, 0, -.05, .05),
    ...box(.07, .045, .42, dk, 0, .11, .06),
    ...box(.075, .075, .46, P.gray, 0, .0, .5),
    ...box(.095, .095, .08, P.orange, 0, -.01, .76),
    ...frustum(4, .035, 0, .07, P.orange, 0, .155, .27, Math.PI / 4),
    ...box(.09, .24, .11, dk, 0, -.27, -.12),
    ...box(.075, .21, .09, P.yel, 0, -.24, .16),
    ...box(.16, .13, .17, skin, 0, -.25, -.12),
    ...box(.21, .21, .42, sleeve, .015, -.34, -.42),
    ...box(.12, .1, .14, skin, -.01, -.06, .34)
  ];
}

/* ---------- v3: soldiers built as real foldable nets (faces hinged along shared creases) ---------- */
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const faceNormal = (v, f) => norm(cross3(sub3(v[f[1]], v[f[0]]), sub3(v[f[2]], v[f[0]])));
const faceCenter = (v, f) => { const c = [0, 0, 0]; for (const i of f) { c[0] += v[i][0]; c[1] += v[i][1]; c[2] += v[i][2]; } return mul(c, 1 / f.length); };
// square-section solid of revolution with consistent outward winding
function lathe(prof, n, rot, cols) {
  const v = [], f = [], fc = [], rings = [];
  for (const [y, r] of prof) {
    if (r === 0) { rings.push([v.length]); v.push([0, y, 0]); continue; }
    const ring = [];
    for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; ring.push(v.length); v.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
    rings.push(ring);
  }
  const capped = rings[0].length > 1;
  if (capped) { f.push([...rings[0]].reverse()); fc.push(cols[0]); }
  for (let k = 0; k < prof.length - 1; k++) {
    const A = rings[k], B = rings[k + 1];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      f.push(A.length === 1 ? [A[0], B[j], B[i]] : B.length === 1 ? [A[i], A[j], B[0]] : [A[i], A[j], B[j], B[i]]);
      fc.push(cols[k + 1]);
    }
  }
  const top = rings[rings.length - 1];
  if (top.length > 1) { f.push([...top]); fc.push(cols[Math.min(cols.length - 1, prof.length)]); }
  const fn = faceNormal(v, f[capped ? 1 : 0]), cen = faceCenter(v, f[capped ? 1 : 0]);
  if (fn[0] * cen[0] + fn[2] * cen[2] < 0) f.forEach(x => x.reverse());
  return { v, f, fc, root: 0 };
}
function boxPart(w, h, d, col, x, y, z) {
  const v = [];
  for (let i = 0; i < 8; i++) v.push([x + (i & 1 ? w / 2 : -w / 2), y + (i & 2 ? h : 0), z + (i & 4 ? d / 2 : -d / 2)]);
  const f = [[0, 2, 6, 4], [1, 3, 7, 5], [0, 1, 5, 4], [2, 3, 7, 6], [0, 1, 3, 2], [4, 5, 7, 6]], c = [x, y + h / 2, z];
  for (const q of f) if (dot3(faceNormal(v, q), sub3(faceCenter(v, q), c)) < 0) q.reverse();
  return { v, f, fc: f.map(() => col), root: 0 };
}
const argBest = (arr, score) => arr.reduce((b, x, i) => score(x, i) > score(arr[b], b) ? i : b, 0);
// glue a part onto a parent face: its root face hinges about one of its own edges
function glue(part, rootScore, parentPart, parentFace, edgeScore) {
  part.root = argBest(part.f, (f) => rootScore(faceNormal(part.v, f), faceCenter(part.v, f)));
  const rf = part.f[part.root], ids = [...rf].sort((a, b) => edgeScore(part.v[b]) - edgeScore(part.v[a])).slice(0, 2);
  part.glue = { part: parentPart, face: parentFace, edge: ids };
}
function buildFold(parts) {
  const nodes = [], idOf = parts.map(() => []);
  const mk = (P, fi, nF, parent, A, B) => {
    const par = nodes[parent], d = norm(sub3(B, A));
    return { pts: P.f[fi].map(i => P.v[i]), col: P.fc[fi], parent, a: A, d, phi: Math.atan2(dot3(d, cross3(nF, par.n)), dot3(nF, par.n)), depth: par.depth + 1, n: nF };
  };
  parts.forEach((P, pi) => {
    const N = P.f.map(f => faceNormal(P.v, f)), edges = new Map();
    const key = (a, b) => a < b ? a + ',' + b : b + ',' + a;
    P.f.forEach((f, fi) => f.forEach((a, k) => { const kk = key(a, f[(k + 1) % f.length]); if (!edges.has(kk)) edges.set(kk, []); edges.get(kk).push(fi); }));
    if (P.glue) { const g = P.glue; idOf[pi][P.root] = nodes.length; nodes.push(mk(P, P.root, N[P.root], idOf[g.part][g.face], P.v[g.edge[0]], P.v[g.edge[1]])); }
    else { idOf[pi][P.root] = nodes.length; nodes.push({ pts: P.f[P.root].map(i => P.v[i]), col: P.fc[P.root], parent: -1, depth: 0, n: N[P.root] }); }
    const q = [P.root], seen = new Set(q);
    while (q.length) {
      const fi = q.shift(), f = P.f[fi];
      for (let k = 0; k < f.length; k++) {
        const a = f[k], b = f[(k + 1) % f.length];
        for (const nf of edges.get(key(a, b))) if (!seen.has(nf)) {
          seen.add(nf); idOf[pi][nf] = nodes.length; nodes.push(mk(P, nf, N[nf], idOf[pi][fi], P.v[a], P.v[b])); q.push(nf);
        }
      }
    }
  });
  const r0 = nodes[0], rc = mul(r0.pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1], a[2] + p[2]], [0, 0, 0]), 1 / r0.pts.length);
  const ax = cross3(r0.n, [0, -1, 0]), sl = Math.hypot(ax[0], ax[1], ax[2]), cc = -r0.n[1];
  let minY = 1e9; for (const P of parts) for (const q of P.v) minY = Math.min(minY, q[1]);
  return {
    nodes, maxD: Math.max(...nodes.map(n => n.depth)), M: new Float64Array(nodes.length * 12), rc, minY, flatY: minY + .03,
    gAx: sl > 1e-6 ? mul(ax, 1 / sl) : [1, 0, 0], gAng: sl > 1e-6 ? Math.atan2(sl, cc) : (cc > 0 ? 0 : Math.PI)

}
function mSoldier3(c) {
  const d = mul(c, .8), l = mix3(c, [1, 1, 1], .14), hat = mul(c, .72);
  const n = 4, body = lathe([[0, .2], [.85, .36], [1.45, .28], [1.52, .12], [1.68, .22], [1.82, .15], [1.84, .36], [2.12, 0]], n, Math.PI / 4, [d, d, c, c, l, l, hat, hat]);
  const armR = boxPart(.13, .13, .42, c, .27, 1.05, .12), armL = boxPart(.13, .13, .42, c, -.25, 1.05, .1);
  const rifle = boxPart(.08, .08, 1.05, mul(c, .58), .3, 1.18, .34);
  const torso = k => 1 + n + k; // band 1 (waist → shoulders) faces
  const tR = torso(argBest([0, 1, 2, 3], (_, i) => faceNormal(body.v, body.f[torso(i)])[0]));
  const tL = torso(argBest([0, 1, 2, 3], (_, i) => -faceNormal(body.v, body.f[torso(i)])[0]));
  glue(armR, (nn) => -nn[0], 0, tR, p => p[2]);
  glue(armL, (nn) => nn[0], 0, tL, p => p[2]);
  const armTop = argBest(armR.f, f => faceNormal(armR.v, f)[1]);
  glue(rifle, (nn) => -nn[1], 1, armTop, p => p[0]);
  const parts = [body, armR, armL, rifle], tris = [];
  for (const P of parts) P.f.forEach((f, fi) => { for (let i = 1; i < f.length - 1; i++) tris.push({ v: [P.v[f[0]], P.v[f[i]], P.v[f[i + 1]]], col: P.fc[fi], jit: .92 + Math.random() * .13, dbl: false }); });
  const fold = buildFold(parts); fold.paper = mix3(c, [1, .99, .96], .62);
  return { tris, fold };
}
/* ---------- v4: origami animal kit ---------- */
function rotM(d, th) { const c = Math.cos(th), sn = Math.sin(th), C = 1 - c, [x, y, z] = d; return [c + x * x * C, x * y * C - z * sn, x * z * C + y * sn, y * x * C + z * sn, c + y * y * C, y * z * C - x * sn, z * x * C - y * sn, z * y * C + x * sn, c + z * z * C]; }
const apR = (r, p) => [r[0] * p[0] + r[1] * p[1] + r[2] * p[2], r[3] * p[0] + r[4] * p[1] + r[5] * p[2], r[6] * p[0] + r[7] * p[1] + r[8] * p[2]];
function orient(P, dir, o) { // point a lathe's y-axis along dir, base at o
  const d = norm(dir), ax = cross3([0, 1, 0], d), s = Math.hypot(ax[0], ax[1], ax[2]), c = d[1];
  const r = s < 1e-6 ? (c > 0 ? [1, 0, 0, 0, 1, 0, 0, 0, 1] : rotM([1, 0, 0], Math.PI)) : rotM(mul(ax, 1 / s), Math.atan2(s, c));

}
function convexPart(v, f, col) {
  const c = mul(v.reduce((a, p) => [a[0] + p[0], a[1] + p[1], a[2] + p[2]], [0, 0, 0]), 1 / v.length);
  for (const q of f) if (dot3(faceNormal(v, q), sub3(faceCenter(v, q), c)) < 0) q.reverse();

function plate(pts, th, col) { // a flat polygon with a little paper thickness
  const n = pts.length, nn = norm(cross3(sub3(pts[1], pts[0]), sub3(pts[2], pts[0])));
  const v = [...pts, ...pts.map(p => [p[0] - nn[0] * th, p[1] - nn[1] * th, p[2] - nn[2] * th])], ids = [...Array(n).keys()];
  const f = [ids, ids.map(i => n + i)];
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; f.push([i, j, n + j, n + i]); }

}
const withP = (P, extra) => Object.assign(P, extra);
// glue every part onto its parent with a hinge, so the whole animal is one foldable sheet
function buildModel(parts) {
  const cen = P => mul(P.v.reduce((a, p) => [a[0] + p[0], a[1] + p[1], a[2] + p[2]], [0, 0, 0]), 1 / P.v.length);
  const P0 = parts[0]; P0.root = argBest(P0.f, f => -faceNormal(P0.v, f)[1]);

    const P = parts[i], pi = P.parent || 0, Q = parts[pi], cp = cen(P), dir = norm(sub3(cp, cen(Q)));
    P.root = argBest(P.f, f => -dot3(faceNormal(P.v, f), dir));
    const qf = argBest(Q.f, f => dot3(faceNormal(Q.v, f), dir) - .8 * Math.hypot(...sub3(faceCenter(Q.v, f), cp)));
    const rf = P.f[P.root], qc = faceCenter(Q.v, Q.f[qf]);
    let best = 0, bd = 1e9;
    rf.forEach((a, k) => {
      const b = rf[(k + 1) % rf.length], m = mul([P.v[a][0] + P.v[b][0], P.v[a][1] + P.v[b][1], P.v[a][2] + P.v[b][2]], .5), dd = Math.hypot(...sub3(m, qc));
      if (dd < bd) { bd = dd; best = k; }

  }

const WSTATES = {

  rain: { cloud: .88, rain: 1, label: 'Rain', icon: '☂' }, storm: { cloud: 1, rain: 1, storm: 1, label: 'Thunderstorm', icon: 'ϟ' },
  snow: { cloud: .72, snow: 1, label: 'Paper Snow', icon: '❄' }, fog: { cloud: .38, fog: 1, label: 'Fog', icon: '≋' }

function computeEnv(p) {
  const a = 2 * Math.PI * (p - .25), el = Math.sin(a);

  E.Ld = norm([-Math.cos(a) * .9, el, .55]);
  E.Md = norm([Math.cos(a) * .9, Math.max(-el, 0) * .42 + .03, 1.25]);
  // ...and where their light comes from: a little behind you, so the faces you see are lit, not silhouetted
  E.L = norm([-Math.cos(a) * .9, Math.max(el, 0) + .12, -.38]);
  E.M = norm([Math.cos(a) * .8, Math.max(-el, 0) * .7 + .3, -.42]);

  const cl = WX.cloud, stm = WX.storm;

  E.warm = smooth(.02, .45, el);

        Gd = [[.32, .52, .85], [1, .8, .62]], D = [[.24, .53, .9], [.74, .87, .98]];
  let k0, k1, t;
  if (el < -.2) { k0 = N; k1 = N; t = 0; }

  smoke.sort((a, b) => (b.z - a.z));
  for (const s of smoke) {
    const q = toCam(s.x, s.y, s.z); if (q[2] < .5) continue;
    const x = W / 2 + F * q[0] / q[2], y = H0 - F * q[1] / q[2], R = F * s.r / q[2];
    const a = (1 - s.life / s.max) * .75;
    const sl = lit(s.col, 0, .6, -.8), fl = E.flash;
    for (let k = 0; k < 6; k++) {
      const a0 = s.rot + k * Math.PI / 3, a1 = a0 + Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a0) * R, y + Math.sin(a0) * R); ctx.lineTo(x + Math.cos(a1) * R, y + Math.sin(a1) * R); ctx.closePath();
      ctx.fillStyle = css(mix3(mul([sl[0] + fl, sl[1] + fl, sl[2] + fl], k % 2 ? 1 : .86), E.fog, 1 - Math.exp(-q[2] * E.fogD)), a); ctx.fill();
    }
  }

  // tracers
  ctx.lineCap = 'round';
  for (const t of tracers) {
    const k = t.t / t.dur, k0 = Math.max(0, k - .25);
    const pa = [lerp(t.a[0], t.b[0], k0), lerp(t.a[1], t.b[1], k0), lerp(t.a[2], t.b[2], k0)], pb = [lerp(t.a[0], t.b[0], k), lerp(t.a[1], t.b[1], k), lerp(t.a[2], t.b[2], k)];
    const A = proj(toCam(...pa)), B = proj(toCam(...pb)); if (!A || !B) continue;
    ctx.strokeStyle = `rgba(${t.col},${.85 - .3 * E.day})`; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  // muzzle / explosion flashes in world
  for (const f of mflashes) {
    const q = toCam(...f.wp); const p = proj(q); if (!p || q[2] < .5) continue;
    const R = F * f.r / q[2] * (1 - f.t / f.dur * .5);
    star(p[0], p[1], R, R * .45, 8, f.t * 20, '#fff3b0', '#ff9a2e', 1 - f.t / f.dur);
  }
  ctx.lineWidth = 1;
}

function star(x, y, R, r, n, rot, c1, c2, a) {
  ctx.globalAlpha = clamp(a, 0, 1);
  for (let i = 0; i < n * 2; i++) {
    const a0 = rot + i / (n * 2) * 6.283, a1 = rot + (i + 1) / (n * 2) * 6.283;
    const r0 = i % 2 ? r : R, r1 = i % 2 ? R : r;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a0) * r0, y + Math.sin(a0) * r0); ctx.lineTo(x + Math.cos(a1) * r1, y + Math.sin(a1) * r1); ctx.closePath();
    ctx.fillStyle = i % 2 ? c1 : c2; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWeather(dt) {
  const r = WX.rain;
  if (r > .02) {
    const sl = WX.wind * .35, nightDim = .7 + .3 * E.day;
    for (let layer = 0; layer < 3; layer++) {
      ctx.strokeStyle = `rgba(210,225,255,${r * (.18 + layer * .12) * nightDim + S.lightning * .3})`;
      ctx.lineWidth = .8 + layer * .5; ctx.beginPath();
      for (let i = layer; i < rain.length; i += 3) {
        const d = rain[i];
        if (i / rain.length > r) continue;
        d.y += dt * (1.4 + d.d * 1.6); d.x += dt * sl * (1 + d.d);
        if (d.y > 1) { d.y -= 1.05; d.x = rnd(-.1, 1.1); }
        if (d.x > 1.1) d.x -= 1.2; if (d.x < -.1) d.x += 1.2;
        const x = d.x * W, y = d.y * H, L = H * .035 * d.d;
        ctx.moveTo(x, y); ctx.lineTo(x - sl * L, y - L);
      }
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  }
  const s = WX.snow;
  if (s > .02) {
    ctx.fillStyle = css(mix3([1, 1, 1], E.amb, .3), Math.min(1, s * 1.2) * (.55 + .45 * E.day));
    ctx.beginPath();
    for (let i = 0; i < snow.length; i++) {
      const f = snow[i]; if (i / snow.length > s) continue;
      f.y += dt * (.05 + f.d * .09); f.x += dt * (WX.wind * .05 + Math.sin(T * 1.5 + f.ph) * .02); f.r += f.vr * dt;
      if (f.y > 1.02) { f.y = -.02; f.x = rnd(); } if (f.x > 1.02) f.x -= 1.04; if (f.x < -.02) f.x += 1.04;
      const x = f.x * W, y = f.y * H, R = (2 + f.d * 4) * H / 900, c = Math.cos(f.r) * R, sn = Math.sin(f.r) * R;
      ctx.moveTo(x + c, y + sn); ctx.lineTo(x - sn, y + c * .5); ctx.lineTo(x - c, y - sn); ctx.lineTo(x + sn, y - c * .5); ctx.closePath();
    }
    ctx.fill();
  }
  if (WX.fog > .02) {
    const g = ctx.createLinearGradient(0, H0 - H * .2, 0, H);
    g.addColorStop(0, css(E.fog, 0)); g.addColorStop(.3, css(E.fog, WX.fog * .3)); g.addColorStop(1, css(E.fog, WX.fog * .12));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

function drawGun(walk) {
  const bobX = Math.sin(walk) * .012, bobY = -Math.abs(Math.cos(walk)) * .014;
  const rl = S.reload > 0 ? Math.sin(Math.PI * (1 - S.reload / 1.7)) : 0;
  const px = .135 + bobX, py = -.125 + bobY - rl * .16 - S.recoil * .006, pz = .42 - S.recoil * .025;
  const pitch = S.recoil * .1 - rl * .5, gyaw = -.1 + rl * .3, roll = rl * .5;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cyw = Math.cos(gyaw), syw = Math.sin(gyaw), cr = Math.cos(roll), sr = Math.sin(roll);
  const toView = v => {
    let x = v[0] * GS, y = v[1] * GS, z = v[2] * GS;
    let x1 = x * cr - y * sr, y1 = x * sr + y * cr; x = x1; y = y1;
    let y2 = y * cp + z * sp, z2 = -y * sp + z * cp; y = y2; z = z2;
    let x3 = x * cyw + z * syw, z3 = -x * syw + z * cyw;
    return [x3 + px, y + py, z3 + pz];
  };
  const toWorld = q => [cam.x + q[0] * cam.c + q[2] * cam.s, cam.y + q[1], cam.z - q[0] * cam.s + q[2] * cam.c];
  const tq = ptracers.map(t => proj(toCam(...t.wp))), H0w = H0; H0 = HG;
  const buf = [];
  const savedFog = E.fogD; E.fogD = 0;
  for (const t of gunTris) prep(toWorld(toView(t.v[0])), toWorld(toView(t.v[1])), toWorld(toView(t.v[2])), t.col, t.jit, false, buf);
  E.fogD = savedFog;
  buf.sort((a, b) => b.d - a.d); for (const m of buf) poly(m.p, m.color);
  const tip = toView([0, .03, .84]), tp = proj(tip);
  // player tracers
  for (let i = 0; i < ptracers.length; i++) {
    const t = ptracers[i], q = tq[i]; if (!q || !tp) continue;
    const k = t.t / .09;
    ctx.strokeStyle = `rgba(255,220,130,${1 - k})`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lerp(tp[0], q[0], k * .6), lerp(tp[1], q[1], k * .6)); ctx.lineTo(lerp(tp[0], q[0], .3 + k * .7), lerp(tp[1], q[1], .3 + k * .7)); ctx.stroke();
  }
  ctx.lineWidth = 1;
  if (S.flash > 0 && tp) {
    const R = F * .11 / tip[2] * (.6 + S.flash * .5);
    star(tp[0], tp[1], R, R * .4, 7, S.flashRot, '#fff6c2', '#ff8a1e', S.flash);
  }
  H0 = H0w;
}

/* ---------- HUD ---------- */
function card(x, y, w, h, rot, fill = '#f5f0e4') {
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(-w / 2 + 3, -h / 2 + 4, w, h);
  ctx.fillStyle = fill; ctx.fillRect(-w / 2, -h / 2, w, h);
  const f = Math.min(w, h) * .32;
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.moveTo(w / 2 - f, -h / 2); ctx.lineTo(w / 2, -h / 2 + f); ctx.lineTo(w / 2 - f, -h / 2 + f); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-w / 2, -h / 2, w, h * .45);
  ctx.restore();
}
const FONT = '"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif';
function txt(s, x, y, size, col = '#3a342c', align = 'left', weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawHUD(p, day) {
  const u = Math.min(H, W * .6) / 100;
  // crosshair
  const cx = W / 2, cy = HG, g = u * (1.1 + S.recoil * 1.6);
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = 'rgba(40,30,20,.7)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g + u * 1.6, -u * .45); ctx.lineTo(g + u * 1.6, u * .45); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, u * .22, 0, 7); ctx.fill();
  if (!hud) return;

  // time / weather card
  const mins = Math.floor(p * 1440), hh = String(Math.floor(mins / 60)).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
  const isNight = E.el < -.05;
  const ws = WSTATES[weather];
  const icon = weather === 'clear' && isNight ? '☾' : ws.icon;
  card(u * 2.5, u * 2.5, u * 33, u * 10.5, -.02);
  txt('PAPER FRONT · DAY ' + day, u * 4, u * 5.2, u * 1.7, '#8a7c66', 'left', 800);
  txt(hh + ':' + mm, u * 4, u * 9, u * 4.4, '#2f2a24', 'left', 800);
  txt(icon + ' ' + ws.label, u * 16.5, u * 9.2, u * 1.75, '#5a4f40', 'left', 700);
  // day progress strip (sun → moon)
  const bx = u * 4, by = u * 11.7, bw = u * 30;
  ctx.fillStyle = 'rgba(60,50,40,.18)'; ctx.fillRect(bx, by, bw, u * .5);
  ctx.fillStyle = '#e8a33c'; ctx.fillRect(bx, by, bw * p, u * .5);

  // compass
  const cw = u * 34, cxx = W / 2 - cw / 2, cyy = u * 2.6;
  card(cxx, cyy, cw, u * 4.4, .005);
  ctx.save(); ctx.beginPath(); ctx.rect(cxx, cyy, cw, u * 4.4); ctx.clip();
  const hd = cam.yaw * 180 / Math.PI;
  for (let d = -180; d <= 180; d += 15) {
    let rel = d - hd; const x = W / 2 + rel * u * .55; if (x < cxx - 20 || x > cxx + cw + 20) continue;
    const lab = { 0: 'N', 90: 'E', '-90': 'W', 180: 'S', '-180': 'S', 45: 'NE', '-45': 'NW', 135: 'SE', '-135': 'SW' }[d];
    if (lab) txt(lab, x, cyy + u * 2.3, u * 1.8, lab.length === 1 ? '#c0392b' : '#5a4f40', 'center', 800);
    else { ctx.fillStyle = '#7a6d5a'; ctx.fillRect(x - .75, cyy + u * 1.5, 1.5, u * 1.6); }
  }
  ctx.restore();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(W / 2, cyy + u * 4.4); ctx.lineTo(W / 2 - u * .7, cyy + u * 5.4); ctx.lineTo(W / 2 + u * .7, cyy + u * 5.4); ctx.fill();

  // kill feed
  let fy = u * 2.6;
  for (const f of S.feed) {
    const a = 1 - smooth(4.8, 6, f.t), slide = (1 - smooth(0, .25, f.t)) * u * 6;
    ctx.globalAlpha = a;
    ctx.font = `700 ${u * 1.8}px ${FONT}`;
    const s = `${f.a}  ${f.sym}  ${f.b}`, w = ctx.measureText(s).width + u * 3;
    card(W - u * 2.5 - w + slide, fy, w, u * 3.6, .01, f.a === 'You' ? '#fff3c9' : '#f5f0e4');
    txt(f.a, W - u * 2.5 - w + slide + u * 1.5, fy + u * 1.85, u * 1.8, f.a === 'You' ? '#b5651d' : '#4f7a32');
    ctx.font = `700 ${u * 1.8}px ${FONT}`;
    const wa = ctx.measureText(f.a + '  ').width;
    txt(f.sym + '  ' + f.b, W - u * 2.5 - w + slide + u * 1.5 + wa, fy + u * 1.85, u * 1.8, '#3a342c');
    ctx.globalAlpha = 1; fy += u * 4.4;
  }

  // health
  const hy = H - u * 9.5;
  card(u * 2.5, hy, u * 26, u * 7, .015);
  txt('✚', u * 4.5, hy + u * 3.6, u * 3.2, S.health < 35 ? '#c0392b' : '#4f7a32', 'left', 900);
  txt(String(Math.round(S.health)), u * 9, hy + u * 3.6, u * 3.6, '#2f2a24', 'left', 800);
  ctx.fillStyle = 'rgba(60,50,40,.18)'; ctx.fillRect(u * 16.5, hy + u * 3, u * 10, u * 1.2);
  ctx.fillStyle = S.health < 35 ? '#d9534f' : '#6aa84f'; ctx.fillRect(u * 16.5, hy + u * 3, u * 10 * S.health / 100, u * 1.2);
  // kills
  card(u * 2.5, hy - u * 5.2, u * 12, u * 4, -.02, '#fff3c9');
  txt('✂ ' + S.kills + ' folded', u * 3.8, hy - u * 3.1, u * 1.8, '#8a5a20');

  // ammo
  const aw = u * 19, ax = W - aw - u * 2.5, ay = H - u * 9.5;
  card(ax, ay, aw, u * 7, -.015);
  if (S.reload > 0) txt('REFOLDING…', ax + aw / 2, ay + u * 3.6, u * 2.2, '#b5651d', 'center', 800);
  else {
    txt(String(S.ammo), ax + u * 1.8, ay + u * 3.6, u * 3.8, '#2f2a24', 'left', 800);
    txt('/ 30', ax + u * 8.2, ay + u * 4.1, u * 1.8, '#8a7c66', 'left', 700);
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i < Math.ceil(S.ammo / 3) ? '#e8a33c' : 'rgba(60,50,40,.18)'; ctx.fillRect(ax + u * 12.5 + (i % 5) * u * 1.15, ay + u * (i < 5 ? 2.1 : 3.9), u * .8, u * 1.3); }
  }

  if (hintT < 7) {
    ctx.globalAlpha = 1 - smooth(5, 7, hintT);
    txt('click for fullscreen · H toggles HUD', W / 2, H - u * 3, u * 1.8, 'rgba(255,250,240,.9)', 'center', 600);
    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  let dt = (now - last) / 1000; last = now; dt = Math.min(dt, .05);
  const walk = update(dt);
  const total = T / DAY_LEN + START_P, p = total % 1, day = Math.floor(total) + 1;
  computeEnv(p);
  E.flash = S.lightFlash * (.3 + .7 * (1 - E.day)) * .55 + S.lightning * .6;
  E.flashC = [S.lightFlash * .45 * (1 - E.day * .7), S.lightFlash * .3 * (1 - E.day * .7), S.lightFlash * .1 * (1 - E.day * .7)];

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineWidth = 1;
  const sh = S.shake * H * .008;
  ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
  drawSky(p);
  drawWorld();
  drawWeather(dt);
  drawGun(walk);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // lightning / hurt / vignette / grain
  if (S.lightning > 0) { ctx.fillStyle = `rgba(230,238,255,${S.lightning * .35})`; ctx.fillRect(0, 0, W, H); }
  if (S.hurt > 0 || S.health < 35) {
    const a = Math.max(S.hurt * .55, (35 - S.health) / 35 * .35);
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .95);
    g.addColorStop(0, 'rgba(200,30,30,0)'); g.addColorStop(1, `rgba(200,30,30,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,8,20,.3)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .55;
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawHUD(p, day);
  requestAnimationFrame(frame);
}

addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') hud = !hud; });
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
