<title>Phosphor Pasture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: one full-bleed CRT tube; a fixed 64-row character grid letterboxed inside it. Single dark look by design. */
:root{
  --tube:#000;
  --phosphor:#40ff6e;
  --phosphor-dim:#1c7a3a;
  --glass:#010603;
  --mono:'VT323','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--tube);color:var(--phosphor);overflow:hidden}
#tube{position:fixed;inset:0;background:var(--glass);cursor:none}
#tube.pointer{cursor:default}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glow{filter:blur(6px) brightness(1.5);opacity:.55;mix-blend-mode:screen;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.32) 0 1px,transparent 1px 3px)}
.vignette{background:radial-gradient(ellipse 85% 80% at 50% 50%,transparent 60%,rgba(0,0,0,.8) 100%);box-shadow:inset 0 0 90px 10px rgba(0,0,0,.85);border-radius:22px}
.roll{height:22%;top:-22%;bottom:auto;background:linear-gradient(to bottom,transparent,rgba(64,255,110,.045) 60%,transparent);animation:roll 8s linear infinite}
@keyframes roll{to{transform:translateY(560%)}}
#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:18px/1.2 var(--mono);letter-spacing:.06em;color:var(--phosphor);text-shadow:0 0 6px var(--phosphor-dim);
  background:rgba(1,6,3,.82);border:1px solid var(--phosphor-dim);padding:4px 12px;white-space:nowrap;
  max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .8s;opacity:1}
#hint.off{opacity:0}
@media (prefers-reduced-motion:reduce){.roll{display:none}}
</style>

<div id="tube">
  <canvas id="glow" aria-hidden="true"></canvas>
  <canvas id="screen" role="img" aria-label="Animated green-screen terminal: a 24 hour day passes every 60 seconds while 47 cowsay characters come and go under changing weather."></canvas>
  <div class="layer scan"></div>
  <div class="layer roll"></div>
  <div class="layer vignette"></div>

        for (let j = 0; j < 4; j++) put(x + Math.random() * w, y + h - k - Math.random() * 3, '*', 1.1, false);
      } else if (ph === 2) {
        const k = Math.floor(p * h);
        o.mask = r => r >= k;
        const pw = Math.round(w * (.4 + .9 * p)), px = x + Math.round((w - pw) / 2);
        for (let c = 0; c < pw; c++) put(px + c, GROUND, c % 3 ? '~' : '-', amb * .9, true);
        for (let j = 0; j < 3; j++) put(x + 1 + Math.random() * (w - 2), y + k + Math.random() * (h - k), '.', amb, false);
      }
      break;
    }
    case 'float': {
      const bob = Math.round(Math.sin(T * 2.2 + a.id) * 1.2) - 4;
      if (ph === 0) { x = lerp(from, a.x0, easeOut(p)); o.i = amb * (.15 + .7 * p); }
      else if (ph === 2) { x = lerp(a.x0, to, easeIn(p)); y -= Math.round(p * 10); o.i = amb * .85 * (1 - p); }
      else o.i = amb * .85;
      y += bob; o.skip = .12; o.i *= .85 + .15 * Math.sin(T * 9);
      break;
    }
  }

  x = Math.round(x);
  if (a.mode === 'burn') {
    for (let k = 0; k < 10; k++) put(x + w * .15 + Math.random() * w * .7, y + 2 - Math.random() * 4, pick("()^'*"), 1.3, false);
    if (moving) dust(a.dir < 0 ? x + w : x - 10, a.dir < 0 ? x + w + 10 : x, y + 3 + Math.random() * 4, 4, "*'.", 1.1);
  }
  if (draw) stamp(A, x, y, o);
  if (ph === 1) front.push(() => {
    drawBubble(a.bub, x, y, (lt - a.E) * 32, Math.max(.9, amb));
    const lab = '[ ' + a.label + ' ]';
    text(clamp(Math.round(x + w / 2 - lab.length / 2), 0, C - lab.length), GROUND + 2, lab, .35 + .3 * amb);
  });
}

/* ---------- the scene ---------- */
function scene(T) {
  const t = ((T % DAY) + DAY) % DAY, h = t / HR, day = Math.floor(T / DAY) + 1;
  if (day !== plannedDay) plan(day);
  G.fill(' '); I.fill(0); shake = 0;

  const alt = -Math.cos(2 * Math.PI * h / 24);
  const light = clamp((alt + .18) / .48, 0, 1);
  const cloud = clamp(.12 + .55 * bell(h, 12.5, 1.5) + bell(h, 15.6, 1.4) + .6 * bell(h, 23, 1.6) + .25 * bell(h, 6, .8), 0, 1);
  const rain = clamp(1.3 * bell(h, 15.6, 1) - .15, 0, 1);
  const storm = clamp(1.4 * bell(h, 15.7, .6) - .3, 0, 1);
  const snow = clamp(1.3 * bell(h, 23.2, 1) - .15, 0, 1);
  const fog = clamp(1.2 * bell(h, 6.1, .9) - .1, 0, 1);
  const bow = clamp(1.4 * bell(h, 17.7, .55) - .2, 0, 1) * (1 - rain);
  const wind = .3 + .5 * storm;
  const cover = h >= 22 ? (h - 22) / 2 * .8 : h < 7.5 ? .8 : h < 10 ? .8 * (1 - (h - 7.5) / 2.5) : 0;
  const wet = clamp(1.2 * bell(h, 16.8, 1.6) - .2, 0, 1);
  const amb = (.5 + .5 * light) * (1 - .15 * cloud);

  // lightning
  const now = T;
  if (storm > .05 && !reduce && now - flashAt > .9 && Math.random() < storm * .03) {
    flashAt = now; bolt = [];
    let bx = Math.floor(C * (.15 + Math.random() * .7));
    for (let y = 8 + rnd(4); y < GROUND; y++) { const d = rnd(3) - 1; bolt.push([bx, y, d < 0 ? '/' : d > 0 ? '\\' : '|']); bx += d; }
  }
  const since = now - flashAt;
  let flash = since >= 0 && since < .3 ? (1 - since / .3) * (since > .07 && since < .11 ? .3 : 1) : 0;
  if (since > .35 && since < .6) shake = Math.max(shake, .5);

  // dawn and dusk glow: a dither that thickens toward the horizon
  const glow = Math.max(bell(h, 6, 1.1), bell(h, 18, 1.1)) * (1 - .6 * cloud);
  const sf = (h - 6) / 12, sunX = lerp(-10, C - 10, clamp(sf, 0, 1)) + 9;
  if (glow > .03) for (let y = GROUND - 24; y < GROUND; y++) {
    const up = (GROUND - y) / 24;
    for (let x = 0; x < C; x++) {
      const d = glow * (1 - up) ** 1.6 * .5 * (1 + 1.4 * Math.exp(-(((x - sunX) / 34) ** 2)));
      const hv = hash(x, y, 3);
      if (hv < d) put(x, y, hv < d * .35 ? ':' : '.', .14 + .3 * d, false);
    }
  }

  // stars and a meteor
  const night = 1 - light;
  if (night > .05) for (const s of stars) put(s.x, s.y, s.ch, night * (.3 + .3 * Math.sin(T * s.sp + s.ph) + (s.ch === '.' ? 0 : .2)), false);
  for (const mh of [2.3, 20.6]) {
    const mt = ((h - mh + 24) % 24) * HR;
    if (mt < .8 && night > .5) {
      const mx = C * .75 - mt * 90 + (mh > 12 ? -C * .3 : 0), my = 3 + mt * 14;
      put(mx, my, '*', 1.3, false);
      for (let k = 1; k < 9; k++) put(mx + k * 2, my - k * .3, k < 4 ? '-' : '.', 1 - k / 10, false);
    }
  }

  // moon
  const mf = ((h - 18.5 + 24) % 24) / 11;
  if (mf <= 1) drawShape(MOON, Math.round(lerp(-6, C - 2, mf)), Math.round(GROUND - 5 - Math.sin(Math.PI * mf) * (GROUND - 14)), .95, null);

  // sun
  if (sf > -.06 && sf < 1.06) {
    const sx = Math.round(lerp(-10, C - 10, sf)), sy = Math.round(GROUND - 5 - Math.sin(Math.PI * clamp(sf, 0, 1)) * (GROUND - 16));
    const pulse = Math.floor(T * 3) % 2;
    SUN.forEach((l, r) => {
      const f = l.search(/\S/);
      for (let c = f; c < l.length; c++) {
        const core = r >= 1 && r <= 3 && c >= 5 && c <= 13;
        const ch = l[c];
        if (!core && ch !== ' ' && pulse && (ch === '|' || ch === '-')) continue;
        put(sx + c, sy + r, ch, (core ? 1.35 : 1.0) * (1 - .7 * rain), core || ch !== ' ');
      }
    });
  }

  // rainbow
  if (bow > .02) {
    const cx = C * .6, cy = GROUND + 4, ry = 30, rx = ry * 2.3, chars = '=~-:.';
    for (let y = Math.max(1, cy - ry - 1); y < GROUND; y++) for (let x = Math.floor(cx - rx - 3); x < cx + rx + 3; x++) {
      const rho = Math.hypot((x - cx) / rx, (y - cy) / ry) * ry;
      const band = Math.floor(ry - rho);
      if (band >= 0 && band < 5) put(x, y, chars[band], bow * (1 - band * .13), false);
    }
  }

  // clouds
  for (const cl of clouds) {
    if (cloud <= cl.th) continue;
    const ci = clamp((cloud - cl.th) * 4, 0, 1) * (.35 + .5 * light) + .1 * flash;
    const shape = cl.big || storm > .3 ? CLOUD_B : CLOUD_S;
    const span = C + 70, x = ((cl.x0 + T * cl.spd * (.6 + wind)) % span) - 35;
    drawShape(shape, Math.round(x), cl.y, ci, storm > .15 ? (c, r) => hash(c, r, cl.id) < storm * .7 ? ':' : null : null);
  }

  // hills
  drawRidge(farRidge, .32 * (.5 + .5 * light), .03);
  drawRidge(nearRidge, .45 * (.5 + .5 * light), .06);

  // ground
  for (let x = 0; x < C; x++) {
    const hv = hash(x, 1, 9);
    let ch = '",\'.`_'[Math.floor(hv * 6)], i = .5 * amb;
    if (hash(x, 2, 9) < cover) { ch = hv < .5 ? '*' : '_'; i = .85; }
    else if (hash(x, 3, 9) < wet * .35) { ch = '~'; i = .6 * amb; }
    put(x, GROUND, ch, i, true);
    for (let y = GROUND + 1; y < R - 1; y++) if (hash(x, y, 4) < .07) put(x, y, '.', .14, false);
  }

  // actors, tallest at the back
  const front = [];
  const on = [];
  for (const a of actors) { const lt = ((T - a.start) % DAY + DAY) % DAY; if (lt < a.T) on.push([a, lt]); }
  on.sort((p, q) => q[0].h - p[0].h);
  for (const [a, lt] of on) drawActor(a, lt, T, amb, front);

  // precipitation
  if (rain > .01) {
    const n = Math.floor(520 * rain), ch = wind > .45 ? '/' : '|';
    for (let k = 0; k < n; k++) {
      const yy = (hash(k, 1, 21) * GROUND + T * (26 + hash(k, 2, 21) * 14)) % GROUND;
      put(hash(k, 3, 21) * (C + 40) - yy * wind * .9, yy, ch, .5 + .2 * hash(k, 4, 21), false);
    }
    for (let k = 0; k < 40 * rain; k++) put(Math.random() * C, GROUND - 1, pick("o.'"), .55, false);
  }
  if (snow > .01) {
    const n = Math.floor(320 * snow);
    for (let k = 0; k < n; k++) {
      const yy = (hash(k, 1, 33) * GROUND + T * (3 + hash(k, 2, 33) * 5)) % GROUND;
      put(hash(k, 3, 33) * (C + 20) + Math.sin(T * 1.3 + k) * 2.5 - yy * .2, yy, '*.+'[k % 3], .75, false);
    }
  }
  if (flash > .1) for (const [bx, by, ch] of bolt) put(bx, by, ch, 1.6, true);

  // fog banks, drifting in front of everything
  if (fog > .02) for (let y = GROUND - 16; y < GROUND; y++) {
    const low = 1 - (GROUND - y) / 18;
    for (let x = 0; x < C; x++) {
      const v = vnoise(x * .05 - T * .5, y * .35 + T * .08) * fog * (.35 + .6 * low);
      if (v > .38) put(x, y, v > .55 ? '~' : v > .46 ? '-' : '.', .22 + .3 * v, true);
    }
  }

  for (const f of front) f();

  // status lines
  const hh = Math.floor(h), mm = Math.floor((h % 1) * 60);
  const clock = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  const sky = storm > .3 ? 'THUNDERSTORM' : rain > .25 ? 'RAIN' : snow > .25 ? 'SNOW' : fog > .3 ? 'FOG'
    : bow > .3 ? 'RAINBOW' : cloud > .6 ? 'OVERCAST' : cloud > .3 ? 'PARTLY CLOUDY' : 'CLEAR';
  const part = h < 4.5 ? 'NIGHT' : h < 5.6 ? 'DAWN' : h < 6.6 ? 'SUNRISE' : h < 11.5 ? 'MORNING' : h < 13 ? 'NOON'
    : h < 17.4 ? 'AFTERNOON' : h < 18.6 ? 'SUNSET' : h < 20 ? 'DUSK' : 'NIGHT';
  const temp = Math.round(11 + 9 * Math.sin((h - 9) / 24 * 2 * Math.PI) - 5 * rain - 6 * snow);
  const left = ` COWSAY/TTY0  DAY ${String(day).padStart(3, '0')}  ${clock}  ${part}  ${sky}  ${temp}C`;
  const right = `ON STAGE ${String(on.length).padStart(2, '0')}/47 ${paused ? ' PAUSED ' : ''}`;
  hud.top = (left + ' '.repeat(Math.max(1, C - left.length - right.length)) + right).slice(0, C);
  const names = on.sort((p, q) => p[0].start - q[0].start).map(([a]) => a.name).join('  ');
  hud.bottom = ('> ' + names + (Math.floor(T * 2) % 2 ? '_' : ' ')).slice(0, C);
  return { light, flash, amb };
}
const hud = { top: '', bottom: '' };

/* ---------- canvas ---------- */
const tube = document.getElementById('tube');
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
const gv = document.getElementById('glow'), gtx = gv.getContext('2d');
let W = 0, H = 0, cw = 0, chH = 0, ox = 0, oy = 0, fs = 12, ratio = .45, dpr = 1;
const FONT = '"VT323","Courier New",monospace';
const P = [64, 255, 110], HOT = [215, 255, 228];
const styles = Array.from({ length: 21 }, (_, L) => {
  if (L <= 10) return `rgba(${P},${L / 10})`;
  const t = (L - 10) / 10;
  return `rgb(${P.map((v, i) => Math.round(lerp(v, HOT[i], t)))})`;
});

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(tube.clientWidth * dpr); H = Math.round(tube.clientHeight * dpr);
  cv.width = W; cv.height = H;
  gv.width = Math.round(W / 2); gv.height = Math.round(H / 2);
  chH = H / R; cw = chH / 2.05;
  const want = Math.floor(W / cw);
  C = clamp(want, 110, 300);
  if (want < 110) { cw = W / C; chH = cw * 2.05; }
  ox = (W - C * cw) / 2; oy = (H - R * chH) / 2;
  fs = Math.min(chH * 1.05, cw / ratio * .98);
  G = new Array(C * R).fill(' '); I = new Float32Array(C * R);
  plannedDay = -1;
  ctx.fillStyle = '#010603'; ctx.fillRect(0, 0, W, H);
}

const buckets = Array.from({ length: 21 }, () => []);
function render(st) {
  const bgL = st.light * .9 + st.flash * 1.4;
  const bg = [1 + 4 * bgL, 6 + 14 * bgL, 3 + 7 * bgL].map(Math.round);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = `rgba(${bg},${reduce ? 1 : .6})`;
  ctx.fillRect(0, 0, W, H);
  const sx = !reduce && shake ? (Math.random() - .5) * shake * cw * 1.2 : 0;
  const sy = !reduce && shake ? (Math.random() - .5) * shake * chH * .5 : 0;
  ctx.translate(ox + sx, oy + sy);
  ctx.font = `${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const gain = 1 + st.flash * .5;
  for (const b of buckets) b.length = 0;
  for (let k = C; k < C * (R - 1); k++) {
    if (G[k] === ' ') continue;
    const L = Math.round(clamp(I[k] * gain, 0, 2) * 10);
    if (L > 0) buckets[L].push(k);
  }
  const yAdj = chH * .04;
  for (let L = 1; L <= 20; L++) {
    const b = buckets[L]; if (!b.length) continue;
    ctx.fillStyle = styles[L];
    for (const k of b) { const x = k % C, y = (k / C) | 0; ctx.fillText(G[k], x * cw + cw / 2, y * chH + chH / 2 + yAdj); }
  }
  // top bar in inverse video, bottom prompt in normal video
  ctx.fillStyle = styles[8]; ctx.fillRect(0, 0, C * cw, chH);
  ctx.fillStyle = `rgb(${bg})`;
  for (let x = 0; x < hud.top.length; x++) if (hud.top[x] !== ' ') ctx.fillText(hud.top[x], x * cw + cw / 2, chH / 2 + yAdj);
  ctx.fillStyle = styles[7];
  for (let x = 0; x < hud.bottom.length; x++) if (hud.bottom[x] !== ' ') ctx.fillText(hud.bottom[x], x * cw + cw / 2, (R - 1) * chH + chH / 2 + yAdj);
  gtx.clearRect(0, 0, gv.width, gv.height);
  gtx.drawImage(cv, 0, 0, gv.width, gv.height);
}

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!paused) simT += dt;
  if (now - lastDraw >= 33) { lastDraw = now; render(scene(simT)); }
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
const hint = document.getElementById('hint');
let hintTimer;
function showHint() {
  hint.classList.remove('off'); tube.classList.add('pointer');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.classList.add('off'); tube.classList.remove('pointer'); }, 4000);
}
tube.addEventListener('mousemove', showHint);
tube.addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else tube.requestFullscreen?.()?.catch?.(() => {});
  } catch (e) {}
});
addEventListener('keydown', e => {
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'ArrowRight') simT += HR;
  else if (e.key === 'ArrowLeft') simT = Math.max(0, simT - HR);
  else if (e.key === 'f' || e.key === 'F') tube.click();
  else return;
  showHint();
});
addEventListener('resize', resize);
try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}

function measure() {
  const m = document.createElement('canvas').getContext('2d');
  m.font = `100px ${FONT}`;
  ratio = m.measureText('M').width / 100 || .45;
}
const start = () => { measure(); resize(); showHint(); requestAnimationFrame(t => { last = t; frame(t); }); };
Promise.race([document.fonts.load(`20px VT323`), new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>

</body></html>
